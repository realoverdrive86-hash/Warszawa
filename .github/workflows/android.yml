name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Inject Styled GIF Splash & Fix Pin Colors
      run: |
        if [ -f "splash.gif" ]; then
          cp splash.gif www/splash.gif
        fi

        python3 -c '
        import os

        if not os.path.exists("www/index.html"):
            raise FileNotFoundError("Файл www/index.html не найден!")

        with open("www/index.html", "r", encoding="utf-8") as f:
            html = f.read()

        # 1. Фиксируем белые маркеры и кнопки зума
        pin_css = "<style>.pin, .leaflet-control-zoom a { background: #ffffff !important; background-color: #ffffff !important; color: #121a27 !important; forced-color-adjust: none !important; }</style>\n"
        html = html.replace("</head>", pin_css + "</head>", 1)

        # 2. Вставляем анимированный GIF в стильный белый круг по центру темного экрана
        if os.path.exists("www/splash.gif"):
            splash_block = """
        <div id="custom-gif-splash" style="position:fixed;inset:0;z-index:999999;background:#1f1a1f;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
          <div style="width:240px;height:240px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.5);">
            <img src="splash.gif" style="width:200px;height:200px;object-fit:contain;" alt="Loading..." />
          </div>
        </div>
        <script>
          setTimeout(function() {
            var splash = document.getElementById("custom-gif-splash");
            if (splash) {
              splash.style.opacity = "0";
              setTimeout(function() { if (splash) splash.remove(); }, 500);
            }
          }, 2500);
        </script>
        """
            idx = html.lower().find("<body")
            if idx != -1:
                end_body_tag = html.find(">", idx)
                if end_body_tag != -1:
                    html = html[:end_body_tag+1] + "\n" + splash_block + html[end_body_tag+1:]
                    print("GIF-заставка в белом круге успешно вшита!")

        with open("www/index.html", "w", encoding="utf-8") as f:
            f.write(html)
        '

    - name: Initialize Android Project
      run: npx cap add android

    - name: Lock App to Dark Theme & Disable MIUI Auto-Invert
      run: |
        STYLE_FILE="android/app/src/main/res/values/styles.xml"
        if [ -f "$STYLE_FILE" ]; then
          sed -i 's/<\/style>/    <item name="android:forceDarkAllowed">false<\/item>\n    <\/style>/g' "$STYLE_FILE"
        fi

        python3 -c '
        gradle_path = "android/app/build.gradle"
        with open(gradle_path, "r") as f:
            gradle = f.read()
        gradle = gradle.replace("dependencies {", "dependencies {\n    implementation \"androidx.webkit:webkit:1.12.1\"", 1)
        with open(gradle_path, "w") as f:
            f.write(gradle)
        '

        python3 -c '
        import glob
        for target in glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True):
            with open(target, "r") as f:
                code = f.read()
            imports = "import android.os.Bundle;\nimport androidx.appcompat.app.AppCompatDelegate;\nimport androidx.webkit.WebSettingsCompat;\nimport androidx.webkit.WebViewFeature;\n"
            code = code.replace("public class MainActivity", imports + "\npublic class MainActivity")
            oncreate = """
            @Override
            public void onCreate(Bundle savedInstanceState) {
                AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_YES);
                super.onCreate(savedInstanceState);
                if (this.bridge != null && this.bridge.getWebView() != null) {
                    if (WebViewFeature.isFeatureSupported(WebViewFeature.ALGORITHMIC_DARKENING)) {
                        WebSettingsCompat.setAlgorithmicDarkeningAllowed(this.bridge.getWebView().getSettings(), false);
                    }
                }
            }
        """
            idx = code.find("{", code.find("public class MainActivity"))
            code = code[:idx+1] + oncreate + code[idx+1:]
            with open(target, "w") as f:
                f.write(code)
        '

    - name: Apply Custom Icon & Clean Dark Native Splash
      run: |
        pip install pillow
        python3 -c '
        import os, shutil
        from PIL import Image, ImageOps

        src = None
        for root, dirs, files in os.walk("."):
            dirs[:] = [d for d in dirs if d not in ("node_modules", "android", ".git", ".github", "www")]
            for f in files:
                if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                    src = os.path.join(root, f)
                    break
            if src:
                break

        if not src:
            raise FileNotFoundError("В репозитории не найдено ни одной картинки для иконки!")

        raw_img = Image.open(src).convert("RGBA")
        min_side = min(raw_img.size)
        img = ImageOps.fit(raw_img, (min_side, min_side), Image.Resampling.LANCZOS)

        res_dir = "android/app/src/main/res"
        shutil.rmtree(f"{res_dir}/mipmap-anydpi-v26", ignore_errors=True)

        sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
        for folder, px in sizes.items():
            path = f"{res_dir}/mipmap-{folder}"
            os.makedirs(path, exist_ok=True)
            resized = img.resize((px, px), Image.Resampling.LANCZOS)
            resized.save(f"{path}/ic_launcher.png", "PNG")
            resized.save(f"{path}/ic_launcher_round.png", "PNG")
            resized.save(f"{path}/ic_launcher_foreground.png", "PNG")

        bg_color = (31, 26, 31, 255)
        for root, dirs, files in os.walk(res_dir):
            if "splash.png" in files:
                target_splash = os.path.join(root, "splash.png")
                with Image.open(target_splash) as old_sp:
                    w, h = old_sp.size
                canvas = Image.new("RGBA", (w, h), bg_color)
                canvas.save(target_splash, "PNG")
        '

    - name: Build Debug APK
      run: |
        cd android && ./gradlew clean && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
