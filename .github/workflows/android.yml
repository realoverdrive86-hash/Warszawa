name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Initialize Capacitor Android
      run: npx cap add android || npx cap sync android

    - name: Change App Name and ID
      run: |
        # Укажите ваше название приложения
        APP_NAME="Warszaw with kids"
        
        # Укажите ваш новый ID пакета (точно такой же, как в capacitor.config.json)
        NEW_ID="com.realoverdrive.warsawwithkids"
        
        # Меняем название приложения в ресурсах
        sed -i "s/>com.mycompany.myapp</>$APP_NAME</g" android/app/src/main/res/values/strings.xml || true
        sed -i "s/\"app_name\">Capacitor/\"app_name\">$APP_NAME/g" android/app/src/main/res/values/strings.xml || true
        
        # Корректируем ID пакета в файлах конфигурации Android сборки
        find android/ -type f \( -name "build.gradle" -o -name "AndroidManifest.xml" \) -exec sed -i "s/com.mycompany.myapp/$NEW_ID/g" {} +

    - name: Generate Apply App Icons
      run: npm run build-assets

    - name: Build Android App (Debug APK)
      run: |
        cd android && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
