name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Force Dark Header & White Markers
      run: |
        # Заставляем приложение всегда запускаться в темной теме (чтобы шапка всегда была темной)
        # И добавляем стиль, возвращающий белый фон маркерам и кнопкам карты при сборке
        if [ -f www/index.html ]; then
          cat << 'EOF' >> www/index.html
        <style>
          .leaflet-control-zoom a {
            background-color: #ffffff !important;
            color: #1f242d !important;
            border-color: #cccccc !important;
          }
          .leaflet-marker-icon, .leaflet-div-icon, [class*="marker"], [class*="pin"] {
            background-color: #ffffff !important;
          }
        </style>
        EOF
        fi

    - name: Initialize Android Project
      run: npx cap add android

    - name: Lock App to Dark Theme
      run: |
        python3 -c '
        import glob
        files = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
        if files:
            with open(files[0], "r") as f:
                code = f.read()
            imports = "import android.os.Bundle;\nimport androidx.appcompat.app.AppCompatDelegate;\n"
            code = code.replace("public class MainActivity", imports + "\npublic class MainActivity")
            oncreate = "\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_YES);\n        super.onCreate(savedInstanceState);\n    }\n"
            idx = code.find("{", code.find("public class MainActivity"))
            code = code[:idx+1] + oncreate + code[idx+1:]
            with open(files[0], "w") as f:
                f.write(code)
        '

    - name: Apply Custom Icon via Python
      run: |
        pip install pillow
        python3 -c '
        import os, shutil
        from PIL import Image

        src = None
        for root, dirs, files in os.walk("."):
            dirs[:] = [d for d in dirs if d not in ("node_modules", "android", ".git", ".github", "www")]
            for f in files:
                if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                    src = os.path.join(root, f)
                    break
            if src:
                break

        if not src:
            raise FileNotFoundError("В репозитории не найдено ни одной картинки!")

        img = Image.open(src).convert("RGBA")
        res_dir = "android/app/src/main/res"
        shutil.rmtree(f"{res_dir}/mipmap-anydpi-v26", ignore_errors=True)

        sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
        for folder, px in sizes.items():
            path = f"{res_dir}/mipmap-{folder}"
            os.makedirs(path, exist_ok=True)
            resized = img.resize((px, px), Image.Resampling.LANCZOS)
            resized.save(f"{path}/ic_launcher.png", "PNG")
            resized.save(f"{path}/ic_launcher_round.png", "PNG")
            resized.save(f"{path}/ic_launcher_foreground.png", "PNG")
        '

    - name: Build Debug APK
      run: |
        cd android && ./gradlew clean && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
