name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Initialize Android Project
      run: npx cap add android

    - name: Apply Custom Icon via Python
      run: |
        pip install pillow
        python3 -c '
        import os, shutil
        from PIL import Image

        # Ищем ваш файл иконки, в каком бы формате он ни был сохранен
        src = "resources/icon.png" if os.path.exists("resources/icon.png") else "res/icon.png"
        img = Image.open(src).convert("RGBA")

        res_dir = "android/app/src/main/res"

        # Удаляем XML-конфиги адаптивных иконок, из-за которых остается крестик
        shutil.rmtree(f"{res_dir}/mipmap-anydpi-v26", ignore_errors=True)

        # Нарезаем и жестко заменяем все иконки во всех папках
        sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
        for folder, px in sizes.items():
            path = f"{res_dir}/mipmap-{folder}"
            os.makedirs(path, exist_ok=True)
            resized = img.resize((px, px), Image.Resampling.LANCZOS)
            resized.save(f"{path}/ic_launcher.png", "PNG")
            resized.save(f"{path}/ic_launcher_round.png", "PNG")
            resized.save(f"{path}/ic_launcher_foreground.png", "PNG")
        print("Иконка успешно конвертирована и вшита!")
        '

    - name: Build Debug APK
      run: |
        cd android && ./gradlew clean && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
