name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Initialize Android Project
      run: npx cap add android

    - name: Force WebView Dark Theme & Block Auto-Invert
      run: |
        # 1. Подключаем библиотеку управления WebView в build.gradle
        sed -i '/dependencies {/a \    implementation "androidx.webkit:webkit:1.12.1"' android/app/build.gradle
        
        # 2. Программно фиксируем ночную тему для CSS и запрещаем авто-перекрашивание
        MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java")
        if [ -f "$MAIN_ACT" ]; then
          sed -i 's/package .*;/&\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatDelegate;\nimport androidx.webkit.WebSettingsCompat;\nimport androidx.webkit.WebViewFeature;/g' "$MAIN_ACT"
          
          cat << 'EOF' > /tmp/oncreate.txt
            @Override
            public void onCreate(Bundle savedInstanceState) {
                AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_YES);
                super.onCreate(savedInstanceState);
                if (this.bridge != null && this.bridge.getWebView() != null) {
                    if (WebViewFeature.isFeatureSupported(WebViewFeature.ALGORITHMIC_DARKENING)) {
                        WebSettingsCompat.setAlgorithmicDarkeningAllowed(this.bridge.getWebView().getSettings(), false);
                    }
                }
            }
          EOF
          
          # Внедряем метод в MainActivity
          sed -i '/public class MainActivity/r /tmp/oncreate.txt' "$MAIN_ACT"
        fi

    - name: Apply Custom Icon via Python
      run: |
        pip install pillow
        python3 -c '
        import os, shutil
        from PIL import Image

        src = None
        for root, dirs, files in os.walk("."):
            dirs[:] = [d for d in dirs if d not in ("node_modules", "android", ".git", ".github", "www")]
            for f in files:
                if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                    src = os.path.join(root, f)
                    break
            if src:
                break

        if not src:
            raise FileNotFoundError("В репозитории не найдено ни одной картинки!")

        img = Image.open(src).convert("RGBA")
        res_dir = "android/app/src/main/res"
        shutil.rmtree(f"{res_dir}/mipmap-anydpi-v26", ignore_errors=True)

        sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
        for folder, px in sizes.items():
            path = f"{res_dir}/mipmap-{folder}"
            os.makedirs(path, exist_ok=True)
            resized = img.resize((px, px), Image.Resampling.LANCZOS)
            resized.save(f"{path}/ic_launcher.png", "PNG")
            resized.save(f"{path}/ic_launcher_round.png", "PNG")
            resized.save(f"{path}/ic_launcher_foreground.png", "PNG")
        '

    - name: Build Debug APK
      run: |
        cd android && ./gradlew clean && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
