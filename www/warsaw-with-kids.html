 и VR-игры. Есть кафе.","ageT":"Для детей и взрослых. Детские группы акробатики: 7–9 и 10–12 лет. До 3 лет на батуты и в игровые зоны нельзя, детям 3–6 лет прыгать только под присмотром взрослого.","stT":"Частично. Вход и нижняя зона просторные, на антресоль (кафе) — по лестнице.","infra":"🚻 Туалет с пеленанием | 🌳 В помещении | ☕ Кафе Stacja Caffé на антресолях","hrs":"Лучше в будни 10:00–15:00. После 16:30 и в выходные многолюдно (детские дни рождения).","note":"","imgO":"","fx":1,"pid":"ChIJFTKVAKnMHkcRk1K3Sh9u8dU","imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLdKoFkzbON_ZRs1d2-wqe0LYZv4pOf2N6lIlEFRMg_5kA7vfjzHIXXsvVPhC024hUjfwNiRovEawBi0sSflvjOym669YO_x_QfCCCVw3umIHpnkzgo-grXTZjvhy64nnYDUiT4K_6IsM9E=s1330-w784-h1330-rw","pay":"p","L":{"pl":{"n":"Stacja Grawitacja","ab":"Centrum rozrywki i sportu o powierzchni 3200 m² na Ochocie: trampoliny, ścianka wspinaczkowa, park linowy i interaktywne gry pod jednym dachem.","wh":"Trampoliny z poduszką powietrzną, ścianka Happy Climb z automatycznym asekurowaniem dla dzieci, park linowy nad trampolinami, tor „ninja” i gry VR. Jest kawiarnia.","ag":"Dla dzieci i dorosłych. Dziecięce grupy akrobatyki: 7–9 i 10–12 lat. Do 3 lat wstęp na trampoliny i do stref zabaw jest zabroniony, dzieci 3–6 lat skaczą tylko pod opieką dorosłego.","st":"Częściowo. Wejście i dolna strefa są przestronne, na antresolę (kawiarnia) prowadzą schody.","in":"🚻 Toaleta z przewijakiem | 🌳 W pomieszczeniu | ☕ Kawiarnia Stacja Caffé na antresoli","hr":"Najlepiej w dni powszednie 10:00–15:00. Po 16:30 i w weekendy tłoczno (dziecięce urodziny)."},"en":{"n":"Stacja Grawitacja","ab":"A 3,200 m² entertainment and sports centre in Ochota: trampolines, a climbing wall, a rope park and interactive games under one roof.","wh":"Trampolines with an air bag, the Happy Climb wall with auto-belay for children, a rope park above the trampolines, a “ninja” course and VR games. There is a cafe.","ag":"For children and adults. Kids' acrobatics groups: ages 7–9 and 10–12. Under 3: not allowed on the trampolines and play areas; ages 3–6 may jump only under adult supervision.","st":"Partly. The entrance and lower zone are spacious; the mezzanine (cafe) is up the stairs.","in":"🚻 Toilet with changing table | 🌳 Indoors | ☕ Stacja Caffe cafe on the mezzanine","hr":"Best on weekdays 10:00–15:00. Crowded after 16:30 and at weekends (children's birthday parties)."}}},{"id":31,"n":"Парк «Поле Мокотовское»","pl":"Park Pole Mokotowskie","d":"M","lat":52.2131,"lng":20.9944,"a":"al. Niepodległości","lo":0,"hi":16,"st":2,"sh":1,"t":["p","g"],"w":"","about":"Один из самых больших парков Варшавы (около 70 га) на стыке Мокотува, Охоты и Средместья. Открыт после реконструкции в конце 2023 года.","why":"Три детские площадки, сенсорные сады, пруд с деревянными мостиками, водная зона с разбрызгивателями, трасса для роликов, пикники и кафе.","ageT":"Для всех возрастов: от 0 до 16+ лет.","stT":"Да. Ровный рельеф и широкие дорожки.","infra":"🚻 Есть туалеты | 🌳 Тень местами | ☕ Кафе и рестораны","hrs":"Лучше с мая по октябрь. В выходные днём многолюдно, спокойнее до 11:30.","pid":"ChIJVQUcLcfMHkcRzfvFo69SvWE","fx":1,"imgG":"https://lh3.googleusercontent.com/gps-cs-s/ANWiy9T9H7IIA6mjmeowBaYlwkI9DQOJoy6nXKrTSqKo1h05z_IZ3Mb0V7ZLgvSkWrl-jAB9CYZNKruWnsOuXA1I-RzsT8m0a7eSqd7ntCge1yGTaVWIDosixRebKpzEylKO8SwVRtE=s1330-w784-h1330-rw","pay":"f","L":{"pl":{"n":"Park Pole Mokotowskie","ab":"Jeden z największych parków Warszawy (około 70 ha) na styku Mokotowa, Ochoty i Śródmieścia. Otwarty po przebudowie pod koniec 2023 roku.","wh":"Trzy place zabaw, ogrody sensoryczne, staw z drewnianymi pomostami, strefa wodna ze zraszaczami, tor dla rolkarzy, pikniki i kawiarnie.","ag":"Dla wszystkich: od 0 do 16+ lat.","st":"Tak. Równy teren i szerokie alejki.","in":"🚻 Są toalety | 🌳 Cień miejscami | ☕ Kawiarnie i restauracje","hr":"Najlepiej od maja do października. W weekendy w ciągu dnia tłoczno, spokojniej do 11:30."},"en":{"n":"Pole Mokotowskie Park","ab":"One of Warsaw's largest parks (about 70 ha) at the junction of Mokotów, Ochota and Śródmieście. Reopened after a rebuild at the end of 2023.","wh":"Three playgrounds, sensory gardens, a pond with wooden boardwalks, a water zone with sprinklers, a roller-skating track, picnics and cafes.","ag":"For all ages: from 0 to 16+ years.","st":"Yes. Flat terrain and wide paths.","in":"🚻 Toilets available | 🌳 Shade in places | ☕ Cafes and restaurants","hr":"Best from May to October. Busy by day at weekends, calmer before 11:30."}}},{"id":32,"n":"Парк «Морское Око»","pl":"Park Morskie Oko","d":"M","lat":52.2066104,"lng":21.0262422,"a":"Puławska 21","lo":0,"hi":16,"st":1,"sh":1,"t":["p"],"w":"","about":"Пейзажный романтический парк с каскадом живописных прудов, старинным дворцом Шустра и очень сложным, холмистым рельефом.","why":"Место идеально для любителей неторопливых прогулок и созерцания природы. Дети обожают кормить местных уток и лебедей у воды. Из-за перепадов высот и геопластики ландшафта, парк превращается в увлекательный природный тренажер, а густые старые деревья прячут от городского шума и зноя.","ageT":"Для любого возраста (0+).","stT":"Ограниченно. Очень холмистый рельеф, спускаться к прудам и подниматься обратно с коляской — хорошая физическая тренировка.","infra":"🚻 На окраине парка | 🌳 Тенистый рельеф | ☕ Кондитерские у выходов","hrs":"15:00 – 17:30. Из-за холмов во второй половине дня здесь создаются уютные тенистые зоны.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfqc7_9L9lDqlA7fSEW7lDaTKoa4hnkSbeOhMrNdrzeGyH6LTBbNMz0F6ZbwmRcEvGTTo71HpjV74cR-XYPJC8nLQ4Abl8GfrYEr0RHHTxRWSClH03qWC3yXtkb2XgnmqgqFTT9n0lAZ_Ja=w800-h450-k-no","fx":1,"pid":"ChIJdYLy3CfNHkcR8sFIsLTSlhk","pay":"f","L":{"pl":{"n":"Park Morskie Oko","ab":"Krajobrazowy park romantyczny z kaskadą malowniczych stawów, zabytkowym pałacem Szustra i bardzo urozmaiconym, pagórkowatym terenem.","wh":"Miejsce idealne dla miłośników spokojnych spacerów i kontemplacji przyrody. Dzieci uwielbiają karmić miejscowe kaczki i łabędzie nad wodą. Dzięki różnicom wysokości i geoplastyce krajobrazu park staje się fascynującym naturalnym torem sprawnościowym, a gęste stare drzewa chronią przed miejskim hałasem i upałem.","ag":"Dla dzieci w każdym wieku (0+).","st":"Ograniczona. Bardzo pagórkowaty teren — schodzenie do stawów i powrót z wózkiem to niezły trening.","in":"🚻 Na skraju parku | 🌳 Zacieniony teren | ☕ Cukiernie przy wyjściach","hr":"15:00–17:30. Dzięki wzgórzom po południu powstają tu przytulne zacienione strefy."},"en":{"n":"Morskie Oko Park","ab":"A landscape romantic park with a cascade of picturesque ponds, the historic Schuster Palace and very hilly terrain.","wh":"A place ideal for lovers of leisurely walks and contemplating nature. Children love feeding the local ducks and swans by the water. Thanks to the height changes and landscape sculpting, the park becomes a fascinating natural gym, and thick old trees shelter you from city noise and heat.","ag":"Any age (0+).","st":"Limited. Very hilly terrain — going down to the ponds and back up with a stroller is a good workout.","in":"🚻 At the edge of the park | 🌳 Shaded terrain | ☕ Pastry shops at the exits","hr":"15:00–17:30. Because of the hills, cosy shaded areas form here in the afternoon."}}},{"id":33,"n":"Скалодром Camp4","pl":"Camp4","d":"U","lat":52.142503,"lng":21.004899,"a":"Krasnowolska 50","lo":4,"hi":16,"st":2,"sh":1,"t":["a"],"w":"","about":"Один из лучших специализированных скалолазных центров города с огромной зоной для боулдеринга и высокими трассами.","why":"Отличный способ бросить вызов страху высоты. Для детей здесь оборудована специальная безопасная стена с яркими зацепами в виде замков, зверей и геометрических фигур. Благодаря системам автоматической страховки TruBlue, ребенок может безопасно карабкаться вверх и плавно спускаться без помощи родителя.","ageT":"От 4 лет и старше.","stT":"Да. Коляску можно оставить на первом уровне центра.","infra":"🚻 Оборудован | 🌳 В помещении | ☕ Спортивный бар","hrs":"10:00 – 13:00 в выходные. На детских трассах дежурят дополнительные инструкторы.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdZlToXRoy1U8hx3HSfQBaOMKZIQI9MGquRzEl1cdgKO9w41gSFxDAI6BLHuoMiiiij3-A-cfobjJ7cLHrpwLIXk2TgP-gepYrg2GUv-9uLxeQvWghwWuZjZQBOXV2KVhdDzvKm=w800-h450-k-no","fx":1,"pid":"ChIJ_y7h0V0yGUcRI3MkrtgbRYA","pay":"p","L":{"pl":{"n":"Camp4","ab":"Jedno z najlepszych specjalistycznych centrów wspinaczkowych w mieście z ogromną strefą boulderingu i wysokimi drogami.","wh":"Świetny sposób na pokonanie lęku wysokości. Dla dzieci urządzono specjalną bezpieczną ścianę z kolorowymi chwytami w kształcie zamków, zwierząt i figur geometrycznych. Dzięki systemom automatycznej asekuracji TruBlue dziecko może bezpiecznie wspinać się w górę i płynnie schodzić bez pomocy rodzica.","ag":"Od 4 lat.","st":"Tak. Wózek można zostawić na pierwszym poziomie centrum.","in":"🚻 Wyposażone | 🌳 W budynku | ☕ Bar sportowy","hr":"10:00–13:00 w weekendy. Na dziecięcych drogach dyżurują dodatkowi instruktorzy."},"en":{"n":"Camp4 Climbing Centre","ab":"One of the city's best specialist climbing centres, with a huge bouldering zone and tall routes.","wh":"A great way to face a fear of heights. A special safe wall for children has bright holds shaped like castles, animals and geometric figures. With TruBlue automatic belay systems, a child can climb up safely and descend smoothly without a parent's help.","ag":"From 4 years.","st":"Yes. A stroller can be left on the centre's first level.","in":"🚻 Equipped | 🌳 Indoors | ☕ Sports bar","hr":"10:00–13:00 at weekends. Extra instructors are on duty at the children's routes."}}},{"id":34,"n":"Каток «Стегны»","pl":"Tor łyżwiarski Stegny","d":"M","lat":52.1874243,"lng":21.0427329,"a":"Inspektowa 1","lo":4,"hi":5,"st":1,"sh":0,"t":["a"],"w":"","about":"Огромный профессиональный конькобежный трек и каток под открытым небом, управляемый городским центром спорта.","why":"Главная зимняя забава Мокотува. Огромная ледовая арена позволяет детям вдоволь накататься на высокой скорости. Для новичков работает прокат коньков и забавных поддерживающих опор-помощников в виде пингвинов и панд. В вечернее время каток красиво подсвечивается и играет динамичная музыка.","ageT":"От 4–5 лет (когда ребенок может уверенно стоять на коньках-помощниках).","stT":"Ограниченно. На самом льду с колясками нельзя, но на трибуны и в зону проката доступ открыт.","infra":"🚻 В здании проката | 🌳 Открытый лед (работает строго с декабря по март) | ☕ Точки обогрева","hrs":"Первый утренний сеанс выходного дня (обычно 10:00 – 12:00). Лед идеально ровный.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLeyvXFH9pZ9wk-6GusqDSPnesgXFm-nlXoqTkQJph_o4QViuqqf3G52Biu8kHkkxGi86KVHejAoby6-nBPpMs9VsTKRVyVd8KLiHGOqzgjZ-yykt2xG5avctXpVOCF-KHP58sbo=w800-h450-k-no","fx":1,"pid":"ChIJWWxWTDXNHkcRTIER3psDqjg","pay":"p","L":{"pl":{"n":"Tor łyżwiarski Stegny","ab":"Ogromny profesjonalny tor łyżwiarski i lodowisko pod gołym niebem, zarządzane przez miejski ośrodek sportu.","wh":"Główna zimowa zabawa Mokotowa. Ogromna arena lodowa pozwala dzieciom do woli szusować z dużą prędkością. Dla początkujących działa wypożyczalnia łyżew i zabawnych podpórek-pomocników w kształcie pingwinów i pand. Wieczorem lodowisko jest pięknie podświetlone i gra dynamiczna muzyka.","ag":"Od 4–5 lat (gdy dziecko pewnie stoi na łyżwach z podpórką).","st":"Ograniczona. Na samym lodzie nie wolno z wózkami, ale na trybuny i do strefy wypożyczalni dostęp jest otwarty.","in":"🚻 W budynku wypożyczalni | 🌳 Otwarty lód (czynne ściśle od grudnia do marca) | ☕ Punkty ogrzewania","hr":"Pierwszy poranny seans w weekend (zwykle 10:00–12:00). Lód jest idealnie równy."},"en":{"n":"Stegny Ice Rink","ab":"A huge professional speed-skating track and open-air ice rink run by the city sports centre.","wh":"Mokotów's main winter fun. The huge ice arena lets children skate at speed to their heart's content. Beginners can rent skates and amusing support aids shaped like penguins and pandas. In the evening the rink is beautifully lit and lively music plays.","ag":"From 4–5 years (when a child can stand confidently on skates with a helper).","st":"Limited. Strollers are not allowed on the ice itself, but the stands and the rental area are accessible.","in":"🚻 In the rental building | 🌳 Open ice (open strictly December to March) | ☕ Warming points","hr":"The first morning session at weekends (usually 10:00–12:00). The ice is perfectly smooth."}}},{"id":35,"n":"Варшавский зоопарк","pl":"Miejski Ogród Zoologiczny","d":"P","lat":52.2581092,"lng":21.0215756,"a":"Ratuszowa 1/3","lo":0,"hi":16,"st":2,"sh":1,"t":["z","p"],"w":"Miejski Ogród Zoologiczny w Warszawie","about":"Огромный исторический зеленый оазис на берегу Вислы, в котором в просторных и современных вольерах живут более 12 000 животных со всего мира.","why":"Безусловный хит для любого возраста. Дети смогут увидеть вживую слонов, жирафов, белых медведей, носорогов, львов и поиграть в прятки с резвыми шимпанзе в огромном приматологическом павильоне. Внутри также работает контактный мини-зоопарк, где разрешено погладить козочек.","ageT":"Для любого возраста (0+).","stT":"Да. Идеал для колясок: длинные плоские аллеи, пандусы во все павильоны.","infra":"🚻 Рассредоточены по парку | 🌳 Много зелени и павильонов | ☕ Несколько кафе","hrs":"09:00 – 13:00. Животные наиболее активны во время утреннего кормления.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLeaDCBDVRIExGEJzDSlSvponW6Kb2AdLmAOlhOccSOxOE481J_EyQ0C1t3wSAUSbiSQ4mvhAM1DpjT-kWBE5k2nz9pHAQuK3NUs3VlwbYA2cND-hW-Awr1YI5xMsx_iKFigrdiX-lb7Zcik=w800-h450-k-no","fx":1,"pid":"ChIJHUmpu2zMHkcRna4vwLrUdhk","pay":"p","L":{"pl":{"n":"Miejski Ogród Zoologiczny","ab":"Ogromna historyczna zielona oaza nad Wisłą, w której w przestronnych, nowoczesnych wybiegach mieszka ponad 12 000 zwierząt z całego świata.","wh":"Niekwestionowany hit w każdym wieku. Dzieci zobaczą na żywo słonie, żyrafy, niedźwiedzie polarne, nosorożce, lwy i pobawią się w chowanego z ruchliwymi szympansami w ogromnym pawilonie naczelnych. W środku działa też mini-zoo kontaktowe, gdzie można pogłaskać kózki.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Idealne dla wózków: długie płaskie aleje, podjazdy do wszystkich pawilonów.","in":"🚻 Rozmieszczone w całym parku | 🌳 Dużo zieleni i pawilonów | ☕ Kilka kawiarni","hr":"9:00–13:00. Zwierzęta są najbardziej aktywne podczas porannego karmienia."},"en":{"n":"Warsaw Zoo","ab":"A huge historic green oasis on the Vistula bank, where over 12,000 animals from around the world live in spacious, modern enclosures.","wh":"An undisputed hit at any age. Children can see elephants, giraffes, polar bears, rhinos and lions live and play hide-and-seek with lively chimpanzees in the huge primate pavilion. Inside there is also a petting mini-zoo where you can stroke the goats.","ag":"Any age (0+).","st":"Yes. Ideal for strollers: long flat avenues, ramps into all pavilions.","in":"🚻 Spread around the park | 🌳 Lots of greenery and pavilions | ☕ Several cafes","hr":"9:00–13:00. Animals are most active during the morning feeding."}}},{"id":36,"n":"Саксонский сад","pl":"Ogród Saski","d":"P","lat":52.240265,"lng":21.0076337,"a":"Marszałkowska, 00-102 Warszawa","lo":0,"hi":16,"st":2,"sh":1,"t":["p","g"],"w":"Ogród Saski w Warszawie","about":"Старейший общественный королевский парк Варшавы, расположенный в самом центре города, славящийся своим величественным ампирным фонтаном, барочными скульптурами и вековыми деревьями.","why":"Великолепное место для отдыха всей семьей. В глубине сада обустроена образцовая огороженная детская площадка с мягким безопасным покрытием, современными качелями, каруселями и деревянными игровыми замками. Прогулку по парку можно совместить с познавательным уроком истории, показав ребенку торжественную смену караула у Могилы Неизвестного Солдата на границе сада.","ageT":"Для любого возраста (0+).","stT":"Да. Идеальные гладкие асфальтированные аллеи, пологие съезды и полное отсутствие барьеров.","infra":"🚻 Новые общественные биотуалеты | 🌳 Густая прохладная тень вековых аллей | ☕ Кофейные киоски и кафе у выходов","hrs":"10:00 – 13:00. Отличное тихое время для игр и прогулок в тени.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdhroQMjtpb-cSHR-f9gKEoJKxeqBqdjQ_XD9oWqmLRgyTr6tMxftwfxyjy2HSkLT_oF16ExN9tJjaiFoHPoASlLG2lO-HzPl0hswL0dwd3fnql-r5cT0E8ln-laCWzJnMyd8pknA=w800-h450-k-no","fx":1,"pid":"ChIJkUWehmHMHkcRR-72WJvPCFg","pay":"f","L":{"pl":{"n":"Ogród Saski","ab":"Najstarszy publiczny park królewski Warszawy, położony w samym centrum miasta, słynący z majestatycznej fontanny w stylu empire, barokowych rzeźb i wiekowych drzew.","wh":"Wspaniałe miejsce odpoczynku dla całej rodziny. W głębi ogrodu urządzono wzorowy ogrodzony plac zabaw z miękką bezpieczną nawierzchnią, nowoczesnymi huśtawkami, karuzelami i drewnianymi zamkami do zabawy. Spacer po parku można połączyć z lekcją historii, pokazując dziecku uroczystą zmianę warty przy Grobie Nieznanego Żołnierza na skraju ogrodu.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Idealnie gładkie asfaltowe aleje, łagodne zjazdy i brak barier.","in":"🚻 Nowe publiczne toalety kabinowe | 🌳 Gęsty chłodny cień wiekowych alei | ☕ Kioski z kawą i kawiarnie przy wyjściach","hr":"10:00–13:00. Świetny, cichy czas na zabawę i spacer w cieniu."},"en":{"n":"Saxon Garden","ab":"Warsaw's oldest public royal park, in the very centre of the city, famous for its majestic Empire-style fountain, Baroque sculptures and centuries-old trees.","wh":"A wonderful place to relax with the whole family. Deep in the garden is a model fenced playground with a soft safe surface, modern swings, carousels and wooden play castles. A walk in the park can be combined with a history lesson by showing the child the solemn Changing of the Guard at the Tomb of the Unknown Soldier on the garden's edge.","ag":"Any age (0+).","st":"Yes. Perfectly smooth asphalt avenues, gentle ramps and no barriers.","in":"🚻 New public portable toilets | 🌳 Dense cool shade of old avenues | ☕ Coffee kiosks and cafes at the exits","hr":"10:00–13:00. A great quiet time for play and walks in the shade."}}},{"id":37,"n":"Музей Праги — зал для малышей","pl":"Muzeum Pragi – sala dla maluchów","d":"P","lat":52.2516096,"lng":21.0392656,"a":"Targowa 50/52","lo":0,"hi":5,"st":2,"sh":1,"t":["m"],"w":"","about":"Современный интерактивный музей, расположенный в одном из старейших уцелевших кирпичных зданий Праги, рассказывающий историю этого колоритного района.","why":"Сюда нужно идти ради «Пражской игровой зоны» (Praska Strefa Zabawy). Это уникальная, бесплатная инклюзивная комната, созданная детскими психологами специально для раннего сенсорного развития детей до 5-6 лет. Здесь нет гаджетов — только мягкие блоки, деревянные конструкции, тканевые лабиринты и развивающие тактильные панели.","ageT":"От 0 до 5 лет.","stT":"Да. Полная доступность, широкие проходы и лифты.","infra":"🚻 Пеленальный уголок | 🌳 В помещении | ☕ Кафе во дворике","hrs":"10:00 – 12:30. Отличное время для спокойной игры с самыми маленькими.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdrkNCnxpkBgoOG4nAEJwLRVPOItxachFtprRIzyo7SBVN9Ljisu4JmXlE3TeobX-mXqyJy7UGcrRIe9v7UOGlUhHFfl265R3_bwS_yKSTHo5W0GWWFkFD8kFINL6UrbdT5LVHR=w800-h450-k-no","fx":1,"pid":"ChIJz3gHi0fMHkcRK4C61nMG5vY","pay":"m","L":{"pl":{"n":"Muzeum Pragi – sala dla maluchów","ab":"Nowoczesne interaktywne muzeum w jednym z najstarszych zachowanych ceglanych budynków Pragi, opowiadające historię tej barwnej dzielnicy.","wh":"Warto tu przyjść dla „Praskiej Strefy Zabawy” (Praska Strefa Zabawy). To wyjątkowa, bezpłatna inkluzywna sala stworzona przez psychologów dziecięcych specjalnie dla wczesnego rozwoju sensorycznego dzieci do 5–6 lat. Nie ma tu gadżetów — są tylko miękkie klocki, drewniane konstrukcje, tkaninowe labirynty i rozwijające panele dotykowe.","ag":"0–5 lat.","st":"Tak. Pełna dostępność, szerokie przejścia i windy.","in":"🚻 Kącik do przewijania | 🌳 W budynku | ☕ Kawiarnia na dziedzińcu","hr":"10:00–12:30. Świetny czas na spokojną zabawę z najmłodszymi."},"en":{"n":"Praga Museum – Toddler Room","ab":"A modern interactive museum in one of Praga's oldest surviving brick buildings, telling the story of this colourful district.","wh":"Come for the “Praga Play Zone” (Praska Strefa Zabawy). It is a unique, free, inclusive room created by child psychologists specifically for early sensory development of children up to 5–6. There are no gadgets here — only soft blocks, wooden structures, fabric mazes and educational tactile panels.","ag":"0–5 years.","st":"Yes. Full accessibility, wide aisles and lifts.","in":"🚻 Baby-changing corner | 🌳 Indoors | ☕ Cafe in the courtyard","hr":"10:00–12:30. A great time for calm play with the youngest."}}},{"id":38,"n":"Музей неона","pl":"Neon Muzeum","d":"C","lat":52.2318484,"lng":21.00677,"a":"Plac Defilad 1 (PKiN, 4 этаж, вход со стороны Marszałkowska)","lo":7,"hi":9,"st":2,"sh":1,"t":["m"],"w":"Neon Muzeum","about":"Единственный в Европе частный музей, посвящённый сохранению и реставрации неоновых вывесок эпохи холодной войны. Находится на 4 этаже Дворца культуры и науки.","why":"Настоящий взрыв цвета и визуального восторга для школьников и подростков. Сотни огромных, светящихся всеми цветами радуги старинных вывесок ресторанов, кинотеатров и вокзалов создают внутри музея невероятную, завораживающую киберпанк-атмосферу. Место признано одной из лучших фотозон Польши.","ageT":"От 7–9 лет и подростки. Вход бесплатный для детей до 6 лет.","stT":"Да. Вход со стороны Marszałkowska, на 4 этаж ведут боковые лифты с уровня −1.","infra":"🚻 Есть | 🌳 В помещении","hrs":"Музей открыт ежедневно 11:00–18:00 (пт–сб до 19:00). Чем позже, тем эффектнее выглядят вывески.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLe44ce4WeamaY7QMzF6ShNpPd6Q_gmSYtyBzEn4_rThvd426V9hMFSFREqWwzaT8BZXSkGN_qTNkjcq1YswoBlJL2emdriYwl6DFMx0r1BxGZHMSgQpNvLiklIG0369qX8CcpbtAq-G_qOE=w800-h450-k-no","fx":1,"pid":"ChIJVVXFfbXNHkcRYARvzX3LLiU","pay":"p","L":{"pl":{"n":"Neon Muzeum","ab":"Jedyne w Europie prywatne muzeum poświęcone zachowaniu i renowacji neonów z czasów zimnej wojny. Mieści się na 4. piętrze Pałacu Kultury i Nauki.","wh":"Prawdziwy wybuch kolorów i wizualnej radości dla uczniów i nastolatków. Setki ogromnych, świecących wszystkimi kolorami tęczy dawnych szyldów restauracji, kin i dworców tworzą w muzeum niezwykły, hipnotyzujący klimat cyberpunku. Miejsce uznawane jest za jedną z najlepszych fotostref w Polsce.","ag":"Od 7–9 lat i nastolatki. Wstęp bezpłatny dla dzieci do 6 lat.","st":"Tak. Wejście od strony Marszałkowskiej, na 4. piętro prowadzą boczne windy z poziomu −1.","in":"🚻 Są | 🌳 W budynku","hr":"Muzeum czynne codziennie 11:00–18:00 (pt–sb do 19:00). Im później, tym efektowniej wyglądają neony.","ad":"Plac Defilad 1 (PKiN, 4. piętro, wejście od ul. Marszałkowskiej)"},"en":{"n":"Neon Museum","ab":"Europe's only private museum devoted to preserving and restoring Cold War-era neon signs. It is on the 4th floor of the Palace of Culture and Science.","wh":"A true explosion of colour and visual delight for schoolchildren and teenagers. Hundreds of huge vintage signs of restaurants, cinemas and railway stations, glowing in every colour of the rainbow, create an incredible, mesmerising cyberpunk atmosphere inside the museum. The place is considered one of Poland's best photo spots.","ag":"From 7–9 years and teenagers. Free admission for children under 6.","st":"Yes. Entrance from the Marszałkowska side; side lifts from level −1 lead to the 4th floor.","in":"🚻 Yes | 🌳 Indoors","hr":"The museum is open daily 11:00–18:00 (Fri–Sat until 19:00). The later, the more striking the signs look.","ad":"Plac Defilad 1 (PKiN, 4th floor, entrance from Marszałkowska Street)"}}},{"id":39,"n":"Парк Скарышевский","pl":"Park Skaryszewski","d":"P","lat":52.2420521,"lng":21.0543913,"a":"Al. Jerzego Waszyngtona","lo":0,"hi":16,"st":2,"sh":1,"t":["p"],"w":"Park Skaryszewski","about":"Огромный ландшафтный парк с вековыми деревьями, искусственными водопадами, озерами и розариями, признанный памятником садово-паркового искусства.","why":"Идеальное место для побега от городской суеты. Аллеи настолько широкие и ровные, что дети могут безопасно кататься на самокатах и велосипедах. Здесь можно взять напрокат каноэ или лодку, устроить пикник на траве под сенью гигантских дубов или зайти в легендарное семейное кафе «Misianka» за домашними пирогами.","ageT":"Для любого возраста (0+).","stT":"Да. Большинство аллей асфальтированы, очень комфортно катить любую коляску.","infra":"🚻 Платные кабинки | 🌳 Плотная тень вековых деревьев | ☕ Известное кафе «Misianka»","hrs":"11:00 – 14:00 летом. Густые кроны надежно защищают от солнца.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfEq7Ljwqii5OogMKkGf5lnx7bOh6u5tC64A2XPeo-3JOc83X1UZkYpqxhqkv_-ndzXt3KH1USlaHEJQiafS3nge4-1G2hHxyo8YzBS-LAVjPuDroU4c_ouTKVpd12CrdivbhTW=w800-h450-k-no","fx":1,"pid":"ChIJ5xnhR03MHkcRubFLoU_kmaM","pay":"f","L":{"pl":{"n":"Park Skaryszewski","ab":"Ogromny park krajobrazowy z wiekowymi drzewami, sztucznymi wodospadami, jeziorami i różanami, uznany za zabytek sztuki ogrodowej.","wh":"Idealne miejsce ucieczki od miejskiego zgiełku. Aleje są tak szerokie i równe, że dzieci mogą bezpiecznie jeździć na hulajnogach i rowerach. Można wypożyczyć kajak lub łódkę, urządzić piknik na trawie pod gigantycznymi dębami albo zajrzeć do legendarnej rodzinnej kawiarni „Misianka” po domowe ciasta.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Większość alej jest asfaltowa, bardzo wygodnie jechać z każdym wózkiem.","in":"🚻 Płatne kabiny | 🌳 Gęsty cień wiekowych drzew | ☕ Znana kawiarnia „Misianka”","hr":"11:00–14:00 latem. Gęste korony drzew skutecznie chronią przed słońcem."},"en":{"n":"Skaryszewski Park","ab":"A huge landscape park with centuries-old trees, artificial waterfalls, lakes and rose gardens, recognised as a monument of garden art.","wh":"A perfect place to escape the city bustle. The avenues are so wide and smooth that children can safely ride scooters and bikes. You can rent a canoe or a boat, have a picnic on the grass under giant oaks or drop into the legendary family cafe “Misianka” for home-baked cakes.","ag":"Any age (0+).","st":"Yes. Most avenues are asphalted, very comfortable for any stroller.","in":"🚻 Paid cabins | 🌳 Dense shade of centuries-old trees | ☕ The well-known cafe “Misianka”","hr":"11:00–14:00 in summer. The dense tree crowns protect from the sun reliably."}}},{"id":40,"n":"Развлекательный центр Jungle Academy","pl":"Jungle Academy","d":"P","lat":52.2217237,"lng":21.0852397,"a":"Wał Miedzeszyński 646","lo":1,"hi":12,"st":2,"sh":1,"t":["a"],"w":"","about":"Масштабный премиальный крытый детский центр площадью более 1000 кв.м, оформленный в стиле диких экзотических джунглей.","why":"Рай для выплеска энергии в любую погоду. Внутри построена гигантская многоуровневая конструкция с веревочными мостиками, тоннелями, скоростными закрытыми горками, скалодромами и подвесными препятствиями. Все элементы выполнены из гипоаллергенных качественных материалов, а для родителей обустроена комфортная панорамная зона отдыха.","ageT":"1–12 лет.","stT":"Да. Большой плоский игровой хаб с выделенной парковкой для колясок в гардеробе.","infra":"🚻 Есть | 🌳 Кондиционирование | ☕ Кафе для родителей","hrs":"10:00 – 13:00. Лучшее время, чтобы избежать шумных детских праздников.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdxVN4uGW-7VQOvFFuylCambQRq2QwPYtuBhk_p6M5aaX1edZ1JNaLLNdVW6EsrosZF3uT5S4HhM_9vgSCCI_Zoo846gD3MfulKkjqVX9vn_q2aXtdkbQ-pgJyuH_sfWjbljJJnpvv9Oks8=w800-h450-k-no","fx":1,"pid":"ChIJATOVBfPNHkcRbWUWBl-UBt0","pay":"p","L":{"pl":{"n":"Jungle Academy","ab":"Duże premium kryte centrum dla dzieci o powierzchni ponad 1000 m², urządzone w stylu dzikich egzotycznych dżungli.","wh":"Raj do wyładowania energii w każdą pogodę. W środku zbudowano gigantyczną wielopoziomową konstrukcję z mostkami linowymi, tunelami, szybkimi zamkniętymi zjeżdżalniami, ściankami wspinaczkowymi i podwieszonymi przeszkodami. Wszystkie elementy wykonano z hipoalergicznych materiałów wysokiej jakości, a dla rodziców urządzono wygodną panoramiczną strefę wypoczynku.","ag":"1–12 lat.","st":"Tak. Duży płaski hub zabaw ze wydzielonym parkingiem na wózki w szatni.","in":"🚻 Są | 🌳 Klimatyzacja | ☕ Kawiarnia dla rodziców","hr":"10:00–13:00. Najlepszy czas, by uniknąć hałaśliwych dziecięcych urodzin."},"en":{"n":"Jungle Academy Indoor Playground","ab":"A large premium indoor children's centre of over 1,000 m², designed in the style of wild exotic jungles.","wh":"A paradise for burning off energy in any weather. Inside is a giant multi-level structure with rope bridges, tunnels, fast enclosed slides, climbing walls and suspended obstacles. All elements are made of high-quality hypoallergenic materials, and a comfortable panoramic lounge is provided for parents.","ag":"1–12 years.","st":"Yes. A large flat play hub with a dedicated stroller parking in the cloakroom.","in":"🚻 Yes | 🌳 Air conditioning | ☕ Cafe for parents","hr":"10:00–13:00. The best time to avoid noisy children's birthday parties."}}},{"id":41,"n":"Пляж Понятувка","pl":"Plaża Poniatówka","d":"P","lat":52.2365285,"lng":21.0420833,"a":"Wybrzeże Szczecińskie","lo":0,"hi":16,"st":1,"sh":1,"t":["w"],"w":"","about":"Широкий песчаный городской пляж на берегу Вислы прямо у подножия грандиозного Национального стадиона.","why":"Летом это главная бесплатная пляжная рекреация города. Здесь построена потрясающая детская площадка из натурального дерева, полностью интегрированная в песок и деревья прибрежной зоны. Дети могут строить замки из песка, играть на водных мини-дамбах, качаться на канатах и лазить по деревянным бревнам-препятствиям в тени прибрежного леса.","ageT":"Для любого возраста (0+).","stT":"Ограниченно. К деревянной детской площадке ведут настилы, но по самому пляжу катить коляску по песку тяжело.","infra":"🚻 Туалет у павильона | 🌳 Тень в прибрежной лесополосе | ☕ Летние бары","hrs":"17:00 – 20:00 в теплые дни. Песок остывает, а вид на закат просто завораживает.","note":"","imgO":"","imgG":"https://lh3.googleusercontent.com/gps-cs-s/ANWiy9QAlmx698RzqKRrmn2YBsWVNqlOhax4tLAk8HqfZljCh4j6xJbfjv8HqVFATPxlAB3Gt0G6kKvzws0IBUbOwqdBjQPgqwiWnhEwjrqP9vhkWA3aHHNKAzLS0E7mnPSUI2hxfYXO5w=s1330-w784-h1330-rw","fx":1,"pid":"ChIJr3ricVTMHkcR2d7qHtpjsIE","pay":"f","L":{"pl":{"n":"Plaża Poniatówka","ab":"Szeroka piaszczysta miejska plaża nad Wisłą u stóp wielkiego Stadionu Narodowego.","wh":"Latem to główna bezpłatna plażowa rekreacja miasta. Zbudowano tu wspaniały plac zabaw z naturalnego drewna, w pełni zintegrowany z piaskiem i drzewami strefy nadbrzeżnej. Dzieci mogą budować zamki z piasku, bawić się na wodnych mini-tamach, huśtać się na linach i wspinać po drewnianych kłodach-przeszkodach w cieniu nadrzecznego lasu.","ag":"Dla dzieci w każdym wieku (0+).","st":"Ograniczona. Do drewnianego placu zabaw prowadzą pomosty, ale po samej plaży ciężko jechać wózkiem po piasku.","in":"🚻 Toaleta przy pawilonie | 🌳 Cień w nadbrzeżnym pasie leśnym | ☕ Letnie bary","hr":"17:00–20:00 w ciepłe dni. Piasek stygnie, a widok zachodu słońca jest zachwycający."},"en":{"n":"Poniatówka Beach","ab":"A wide sandy city beach on the Vistula bank at the foot of the grand National Stadium.","wh":"In summer this is the city's main free beach leisure area. A superb natural-wood playground has been built here, fully integrated into the sand and the trees of the riverside zone. Children can build sandcastles, play on small water dams, swing on ropes and climb wooden log obstacles in the shade of the riverside woods.","ag":"Any age (0+).","st":"Limited. Boardwalks lead to the wooden playground, but pushing a stroller across the sand of the beach itself is hard.","in":"🚻 Toilet by the pavilion | 🌳 Shade in the riverside tree belt | ☕ Summer bars","hr":"17:00–20:00 on warm days. The sand cools and the sunset view is simply mesmerising."}}},{"id":42,"n":"Зимний городок на Национальном стадионе","pl":"Zimowy Narodowy","d":"P","lat":52.2395347,"lng":21.0455762,"a":"Al. Księcia Józefa Poniatowskiego 1","lo":3,"hi":16,"st":2,"sh":1,"t":["a"],"w":"Stadion Narodowy w Warszawie","about":"Ежегодный масштабный зимний парк развлечений, разворачивающийся прямо под крышей главного футбольного стадиона страны.","why":"Главный центр зимнего притяжения. Здесь заливают огромный крытый ледовый каток, монтируют гигантскую ледяную горку для катания на надувных тюбингах-ватрушках с трибун стадиона, открывают зону детского катка со специальными поручнями и устраивают зимние ярмарки со сладостями.","ageT":"От 3 лет (ледяные горки, катки).","stT":"Да. Инфраструктура стадиона включает лифты и широкие пандусы везде.","infra":"🚻 Уборные стадиона | 🌳 Крытая зона | ☕ Фуд-корты","hrs":"Работает строго сезонно (декабрь–март). В будни с 15:00 до 18:00 на ледовых площадках посвободнее.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLc1o9MuXmTEyrVLnimhqolvzEEqcNvUy6EEXz3pHD9ol_TziFEMw7eVcpcAMbI_BFd_N0DTKMNy7tLeuEnXvjj_BiWYQ46cNu2a9GdXQE9t6hmohFX9iKV3XqRWQfmr8Q-_KHuA=w800-h450-k-no","fx":1,"pid":"ChIJ3y5mNr7NHkcRKvQ0JTmZQ-c","pay":"m","L":{"pl":{"n":"Zimowy Narodowy","ab":"Coroczny wielki zimowy park rozrywki rozkładany wprost pod dachem głównego stadionu piłkarskiego kraju.","wh":"Główny ośrodek zimowych atrakcji. Zalewa się tu ogromne kryte lodowisko, montuje gigantyczną lodową zjeżdżalnię do zjazdów na dmuchanych ślizgaczach z trybun stadionu, otwiera strefę lodowiska dla dzieci ze specjalnymi poręczami i urządza zimowe jarmarki ze słodyczami.","ag":"Od 3 lat (lodowe zjeżdżalnie, lodowiska).","st":"Tak. Infrastruktura stadionu obejmuje windy i szerokie podjazdy wszędzie.","in":"🚻 Toalety stadionu | 🌳 Strefa zadaszona | ☕ Food courty","hr":"Czynne ściśle sezonowo (grudzień–marzec). W dni powszednie od 15:00 do 18:00 na lodowiskach jest luźniej."},"en":{"n":"Winter Village at the National Stadium","ab":"An annual large winter amusement park set up right under the roof of the country's main football stadium.","wh":"The main hub of winter attractions. A huge indoor ice rink is flooded here, a giant ice slide for riding inflatable tubes down from the stadium stands is installed, a children's rink zone with special handrails opens and winter fairs with sweets are held.","ag":"From 3 years (ice slides, rinks).","st":"Yes. The stadium's infrastructure includes lifts and wide ramps everywhere.","in":"🚻 Stadium restrooms | 🌳 Covered area | ☕ Food courts","hr":"Strictly seasonal (December–March). On weekdays from 15:00 to 18:00 the ice areas are quieter."}}},{"id":43,"n":"Верёвочный парк на Висле","pl":"Park Linowy nad Wisłą","d":"P","lat":52.2554285,"lng":21.0202009,"a":"ul. Wybrzeże Helskie 1/5","lo":4,"hi":16,"st":1,"sh":1,"t":["a","p"],"w":"","about":"Специализированный веревочный городок, расположенный на правом берегу Вислы среди деревьев, предлагающий трассы различной сложности.","why":"Отличный способ проверить ловкость и баланс на свежем воздухе. Для самых маленьких от 4 лет здесь создана уникальная безопасная «Низкая трасса» (Trasa Dziecięca) с натянутыми страховочными сетками по бокам — ребенок может проходить препятствия без использования карабинов. Для подростков и взрослых открыты высокие экстремальные этапы с тарзанками.","ageT":"От 4 лет до подростков.","stT":"Ограниченно. Парк находится в лесной прибрежной зоне, дорожки грунтовые.","infra":"🚻 Есть | 🌳 Лесная густая тень | ☕ Киоски с кофе и мороженым","hrs":"11:00 – 14:00 в сухую погоду. Деревья отлично закрывают трассы от солнца.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLe4fxnUunzZZ5plkmXzPCCWfIep0r7STrHKWaSUUdItk9wBDW6iaHxNR2UEoumpsg-ts5MZUTtbkG8t4OqDGoe3Bne0X3suBOvzog9C97ggZpO0PdmpygxBtjUJmXkTLd_YVPPTdTqiL5o=w800-h450-k-no","fx":1,"pid":"ChIJyblXomvMHkcRa5h1A_MvX3s","pay":"p","L":{"pl":{"n":"Park Linowy nad Wisłą","ab":"Specjalistyczny park linowy na prawym brzegu Wisły wśród drzew, oferujący trasy o różnym stopniu trudności.","wh":"Świetny sposób na sprawdzenie zwinności i równowagi na świeżym powietrzu. Dla najmłodszych od 4 lat stworzono wyjątkową bezpieczną „Trasę Dziecięcą” z rozciągniętymi siatkami asekuracyjnymi po bokach — dziecko może pokonywać przeszkody bez użycia karabińczyków. Dla nastolatków i dorosłych otwarte są wysokie ekstremalne etapy z tyrolkami.","ag":"Od 4 lat do nastolatków.","st":"Ograniczona. Park leży w leśnej strefie nadbrzeżnej, ścieżki są gruntowe.","in":"🚻 Są | 🌳 Gęsty leśny cień | ☕ Kioski z kawą i lodami","hr":"11:00–14:00 w suchą pogodę. Drzewa doskonale osłaniają trasy przed słońcem."},"en":{"n":"Rope Park by the Vistula","ab":"A specialist rope park on the right bank of the Vistula among trees, offering courses of various difficulty.","wh":"A great way to test agility and balance in the fresh air. For the youngest, from age 4, there is a unique safe “Children's Course” (Trasa Dziecięca) with safety nets stretched along the sides — a child can pass the obstacles without using carabiners. For teenagers and adults, high extreme stages with zip lines are open.","ag":"From 4 years to teenagers.","st":"Limited. The park is in a wooded riverside zone and the paths are dirt.","in":"🚻 Yes | 🌳 Dense forest shade | ☕ Coffee and ice-cream kiosks","hr":"11:00–14:00 in dry weather. The trees shield the courses from the sun well."}}},{"id":44,"n":"Koneser — детские секции","pl":"Centrum Praskie Koneser","d":"P","lat":52.2562595,"lng":21.0439398,"a":"Plac Konesera","lo":3,"hi":15,"st":2,"sh":1,"t":["v","c"],"w":"Centrum Praskie Koneser","about":"Возрожденный архитектурный квартал бывшего старинного водочного завода, превращенный в ультрасовременный культурно-деловой и ресторанный кластер.","why":"По выходным главная площадь Koneser превращается в открытый семейный хаб. Здесь регулярно устраивают бесплатные городские детские фестивали, ставят надувные городки, проводят интерактивные творческие воркшопы, ярмарки игрушек и анимационные шоу, пока родители могут насладиться чашечкой кофе на уличных террасах.","ageT":"От 3 до 15 лет (в зависимости от программы выставок выходного дня).","stT":"Да. Идеал: брусчатка без барьеров, лифты из подземного паркинга прямо на площадь.","infra":"🚻 В паркинге и заведениях | 🌳 Тень под навесами | ☕ Множество ресторанов","hrs":"11:00 – 15:00 по субботам и воскресеньям, когда проходят семейные анимации.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcZx_1JgbU-wc9Mo_MgeqcbtckXSLU0LYKBkQYmJRT-PA7SI5TI1Q_rQ8m7CnvdUBtGI8sNF5gcRplqGnOPJ27Y2k6kHHVYl4_Y0XKOP-XGmjRdRViU5NDgj6ARKRefx3yeATnqLtNtu2I=w800-h450-k-no","fx":1,"pid":"ChIJXy0-HzjMHkcRmLHJOhBhixU","pay":"f","L":{"pl":{"n":"Centrum Praskie Koneser","ab":"Odrodzony architektoniczny kwartał dawnej zabytkowej wytwórni wódek, zamieniony w ultranowoczesny kulturalno-biznesowy i restauracyjny klaster.","wh":"W weekendy główny plac Koneser zamienia się w otwarte rodzinne centrum. Regularnie organizuje się tu bezpłatne miejskie festiwale dla dzieci, stawia dmuchane miasteczka, prowadzi interaktywne warsztaty twórcze, kiermasze zabawek i pokazy animacji, podczas gdy rodzice mogą cieszyć się filiżanką kawy na ulicznych tarasach.","ag":"3–15 lat (zależnie od programu weekendowych wydarzeń).","st":"Tak. Idealnie: bruk bez barier, windy z parkingu podziemnego prosto na plac.","in":"🚻 W parkingu i lokalach | 🌳 Cień pod zadaszeniami | ☕ Wiele restauracji","hr":"11:00–15:00 w soboty i niedziele, kiedy odbywają się rodzinne animacje."},"en":{"n":"Koneser Centre – Kids' Activities","ab":"A revived architectural quarter of a former historic vodka factory, turned into an ultra-modern cultural, business and restaurant cluster.","wh":"At weekends the main Koneser square turns into an open family hub. Free city children's festivals are regularly held here, inflatable play towns are set up, interactive creative workshops, toy fairs and animation shows run, while parents can enjoy a cup of coffee on the street terraces.","ag":"3–15 years (depending on the weekend events programme).","st":"Yes. Ideal: barrier-free cobbles, lifts from the underground car park straight to the square.","in":"🚻 In the car park and venues | 🌳 Shade under awnings | ☕ Many restaurants","hr":"11:00–15:00 on Saturdays and Sundays, when family animations take place."}}},{"id":45,"n":"Дворец и сады в Вилянуве","pl":"Pałac i Ogrody w Wilanowie","d":"X","lat":52.1651749,"lng":21.0905084,"a":"Stanisława Kostki Potockiego 10/16","lo":0,"hi":16,"st":2,"sh":1,"t":["m","p"],"w":"Pałac w Wilanowie","about":"Величественный «Польский Версаль» — роскошная барочная королевская резиденция Яна III Собеского, окруженная регулярным двухэтажным французским парком, английским садом и живописным озером.","why":"Отличное место, чтобы совместить историческую прогулку с детским интерактивом. Дети могут покормить уток у каналов, побегать по зеленым лабиринтам из живой изгороди, а на кассе можно взять специальные семейные брошюры-квесты для увлекательного исследования королевских залов.","ageT":"Для любого возраста (0+).","stT":"Да. Парковые дорожки плотные гравийные, катить коляску легко, ступеней на уличных маршрутах практически нет.","infra":"🚻 Возле касс и в парке | 🌳 Тень у каналов | ☕ Ресторанные террасы на площади | 🚫 Вход с животными запрещён","hrs":"09:30 – 12:00. В утреннем свете дворцовый парк выглядит сказочно.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLch_lQERIiZHmp5JD4lCWWJ42nPKBaHg9IAdWvIbCdTZsCL5ZpItb84wOEvgxkVjsGm6I9GhboUot5dQhSROz0rVJTcAFBlwxfV4_NpMAjTLlOLRHlS3AQvQjm9L79myp8FbeD2=w800-h450-k-no","fx":1,"pid":"ChIJ6xic6UAtGUcRIVWoCEyUf1A","pay":"p","L":{"pl":{"n":"Pałac i Ogrody w Wilanowie","ab":"Majestatyczny „polski Wersal” — wspaniała barokowa rezydencja królewska Jana III Sobieskiego, otoczona regularnym dwupoziomowym ogrodem francuskim, ogrodem angielskim i malowniczym jeziorem.","wh":"Świetne miejsce, by połączyć historyczny spacer z dziecięcą interaktywnością. Dzieci mogą karmić kaczki nad kanałami, biegać po zielonych labiryntach z żywopłotu, a w kasie można wziąć specjalne rodzinne broszury-questy do pasjonującego zwiedzania królewskich komnat.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Alejki parkowe są utwardzone żwirem, wózkiem jedzie się łatwo, na trasach zewnętrznych praktycznie nie ma schodów.","in":"🚻 Przy kasach i w parku | 🌳 Cień przy kanałach | ☕ Tarasy restauracyjne na placu | 🚫 Zakaz wstępu ze zwierzętami","hr":"9:30–12:00. W porannym świetle pałacowy park wygląda bajkowo."},"en":{"n":"Wilanów Palace and Gardens","ab":"The majestic “Polish Versailles” — a magnificent Baroque royal residence of John III Sobieski, surrounded by a formal two-tier French garden, an English garden and a picturesque lake.","wh":"A great place to combine a historic walk with child-friendly interactivity. Children can feed the ducks by the canals, run through green hedge mazes, and at the ticket desk you can pick up special family quest booklets for an exciting exploration of the royal chambers.","ag":"Any age (0+).","st":"Yes. Park paths are firm gravel, strollers roll easily, and outdoor routes have practically no steps.","in":"🚻 Near the ticket desks and in the park | 🌳 Shade by the canals | ☕ Restaurant terraces on the square | 🚫 No pets allowed","hr":"9:30–12:00. In the morning light the palace park looks fairy-tale."}}},{"id":46,"n":"Интерактивный сад света","pl":"Interaktywny Ogród Światła","d":"C","lat":52.2341,"lng":21.0069,"a":"pl. Defilad (Park Świętokrzyski)","lo":0,"hi":16,"st":2,"sh":1,"t":["p","v"],"w":"","about":"Новое бесплатное пространство в центре Варшавы между ул. Свентокшиской и Дворцом культуры. Открылось в середине октября 2026 года.","why":"Светящиеся одуванчики, цветы и бабочки, интерактивная аллея с проекциями под ногами, световое шоу у фонтана и фоторамка на фоне Дворца культуры.","ageT":"Для всех: малышам нравятся светящиеся фигуры, детям 4–10 лет — интерактивная аллея.","stT":"Да. Широкие ровные асфальтированные и мощёные аллеи, без ступеней.","infra":"🚻 Туалетов нет, рядом Złote Tarasy и PKiN | ☕ Кафе на ул. Świętokrzyska","hrs":"Работает вечером, свет включается с сумерек. Лучше в будни: в пятницу и на выходных тесно.","pid":"ChIJUYt_movMHkcRDo_ofyJ1CT0","fx":1,"imgG":"https://lh3.googleusercontent.com/gps-cs-s/ANWiy9SmmgVkdvfWWBhu6xNuzF2rTwFhuMA7qqh2Yi9MhRF5STdyOzniL_DOGKOOeJITFDNSeOkKVbQWkPQslFQ3vxh175BFKOi8ChckmU-oSv6H7lG14kerLiDV9cIOLkQ0RKKZyo_DWiFEHxU=s1330-w784-h1330-rw","pay":"f","L":{"pl":{"n":"Interaktywny Ogród Światła","ab":"Nowa bezpłatna przestrzeń w centrum Warszawy między ulicą Świętokrzyską a Pałacem Kultury. Otwarta w połowie października 2026 roku.","wh":"Świecące dmuchawce, kwiaty i motyle, interaktywna aleja z projekcjami pod stopami, pokaz świetlny przy fontannie i ramka do zdjęć na tle Pałacu Kultury.","ag":"Dla wszystkich: maluchom podobają się świecące figury, dzieciom 4–10 lat — interaktywna aleja.","st":"Tak. Szerokie równe alejki asfaltowe i brukowane, bez schodów.","in":"🚻 Brak toalet, w pobliżu Złote Tarasy i PKiN | ☕ Kawiarnie przy ul. Świętokrzyskiej","hr":"Działa wieczorem, światła włączają się o zmierzchu. Lepiej w dni powszednie: w piątek i w weekendy jest tłoczno."},"en":{"n":"Interactive Garden of Light","ab":"A new free space in central Warsaw between Świętokrzyska Street and the Palace of Culture. Opened in mid-October 2026.","wh":"Glowing dandelions, flowers and butterflies, an interactive alley with projections underfoot, a light show by the fountain and a photo frame with the Palace of Culture behind.","ag":"For everyone: toddlers like the glowing figures, kids aged 4–10 the interactive alley.","st":"Yes. Wide smooth asphalt and paved paths, no steps.","in":"🚻 No toilets, Złote Tarasy and PKiN nearby | ☕ Cafes on Świętokrzyska Street","hr":"Open in the evening, the lights switch on at dusk. Better on weekdays: it is crowded on Fridays and weekends."}}},{"id":47,"n":"Ботанический сад в Повсине","pl":"Ogród Botaniczny w Powsinie","d":"X","lat":52.1058839,"lng":21.0961506,"a":"Prawdziwka 2","lo":0,"hi":16,"st":2,"sh":1,"t":["p"],"w":"Ogród Botaniczny Polskiej Akademii Nauk w Powsinie","about":"Огромный научно-исследовательский ботанический сад Польской академии наук площадью около 40 гектаров на южной окраине города.","why":"Настоящий рай для ценителей флоры. Дети могут побегать по бескрайним зеленым полянам, увидеть коллекции редких экзотических растений, зайти в теплую тропическую оранжерею с пальмами и кактусами, а весной (в апреле-мае) застать невероятное цветение тысяч кустов магнолий и японской сакуры.","ageT":"Для любого возраста (0+).","stT":"Да. Главные маршруты сада заасфальтированы, в оранжерею обустроен пологий въезд.","infra":"🚻 В оранжерее | 🌳 Естественная тень аллей | ☕ Кафе-оранжерея | 🚫 Вход с животными запрещён","hrs":"10:00 – 14:00. Оптимальное время, чтобы обойти цветущие сады.","note":"","imgO":"","pid":"ChIJhf7tLjEsGUcRXq1iUEE3ZFE","fx":1,"imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcJLSSEs32oafki8Wozuqsedw-zLFRfVffSTLADX_tzs_g-jme1tS6-ovr2yYlfYYsCMKyWRH-6bjNl5cHF1r_oX__AY_Z8kbGRxEquCzNjBCHttRJBlWXBGr2jH_5vxp2Nir0e9tiMmZzD=w800-h450-k-no","pay":"p","L":{"pl":{"n":"Ogród Botaniczny w Powsinie","ab":"Ogromny naukowo-badawczy ogród botaniczny Polskiej Akademii Nauk o powierzchni około 40 hektarów na południowych obrzeżach miasta.","wh":"Prawdziwy raj dla miłośników flory. Dzieci mogą biegać po bezkresnych zielonych polanach, zobaczyć kolekcje rzadkich egzotycznych roślin, wejść do ciepłej tropikalnej szklarni z palmami i kaktusami, a wiosną (w kwietniu–maju) zobaczyć niezwykłe kwitnienie tysięcy krzewów magnolii i japońskiej wiśni.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Główne trasy ogrodu są asfaltowe, do szklarni urządzono łagodny podjazd.","in":"🚻 W szklarni | 🌳 Naturalny cień alej | ☕ Kawiarnia-oranżeria | 🚫 Zakaz wstępu ze zwierzętami","hr":"10:00–14:00. Optymalny czas na zwiedzanie kwitnących ogrodów."},"en":{"n":"Powsin Botanical Garden","ab":"A huge research botanical garden of the Polish Academy of Sciences, about 40 hectares, on the city's southern edge.","wh":"A real paradise for flora lovers. Children can run across endless green meadows, see collections of rare exotic plants, enter a warm tropical greenhouse with palms and cacti, and in spring (April–May) catch the incredible bloom of thousands of magnolia bushes and Japanese cherries.","ag":"Any age (0+).","st":"Yes. The garden's main routes are asphalted, and the greenhouse has a gentle ramp.","in":"🚻 In the greenhouse | 🌳 Natural shade of the avenues | ☕ Orangery cafe | 🚫 No pets allowed","hr":"10:00–14:00. The best time to tour the blooming gardens."}}},{"id":48,"n":"Парк культуры в Повсине","pl":"Park Kultury w Powsinie","d":"X","lat":52.116275,"lng":21.091998,"a":"Maślaków 1","lo":1,"hi":16,"st":2,"sh":1,"t":["p","g"],"w":"","about":"Масштабный загородный лесопарк спортивно-развлекательного типа, расположенный прямо на границе с густым Кабацким лесом.","why":"Лучшая локация для активного семейного дня на природе. Здесь обустроены современные бесплатные игровые площадки из дерева, уличные тренажеры, теннисные корты и поля для мини-гольфа. Летом на территории работает большой открытый бассейн с брызгалками, а сосновый воздух делает прогулку целебной.","ageT":"От 1 года до подростков.","stT":"Да. Основные центральные аллеи лесопарка уложены асфальтом или хорошей гладкой плиткой.","infra":"🚻 Туалетные домики | 🌳 Сосновый вековой лес | ☕ Зоны барбекю, открытый бассейн, семейные кафе","hrs":"10:00 – 16:00 в летние выходные. Стоит приезжать на целый день.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcSYdDKbTUsLiY_nKb1G_O-iCK387c2you5LooGcZXKNoCKH57jBcmB-Enn5m1Z5xyAOkBlFL80wiIBbkhbm8tVotinG_1BU-SWJe-V1w8cMmcWMS-khXxYez09NRpUu4ED-2c=w800-h450-k-no","fx":1,"pid":"ChIJU2qFurQtGUcRJinh0U5X3Bc","pay":"f","L":{"pl":{"n":"Park Kultury w Powsinie","ab":"Duży podmiejski park leśny o charakterze sportowo-rekreacyjnym, położony tuż przy gęstym Lesie Kabackim.","wh":"Najlepsze miejsce na aktywny rodzinny dzień na łonie natury. Są tu nowoczesne bezpłatne place zabaw z drewna, siłownie plenerowe, korty tenisowe i pola do minigolfa. Latem działa duży otwarty basen ze zraszaczami, a sosnowe powietrze czyni spacer leczniczym.","ag":"Od 1 roku do nastolatków.","st":"Tak. Główne centralne alejki parku leśnego są wyłożone asfaltem lub dobrą gładką kostką.","in":"🚻 Domki sanitarne | 🌳 Wiekowy las sosnowy | ☕ Strefy grillowe, basen otwarty, rodzinne kawiarnie","hr":"10:00–16:00 w letnie weekendy. Warto przyjechać na cały dzień."},"en":{"n":"Powsin Culture Park","ab":"A large out-of-town forest park of sports and leisure type, right on the edge of the dense Kabaty Forest.","wh":"The best location for an active family day in nature. There are modern free wooden playgrounds, outdoor gyms, tennis courts and mini-golf. In summer a large open-air pool with sprinklers operates, and the pine air makes the walk healing.","ag":"From 1 year to teenagers.","st":"Yes. The main central paths of the forest park are laid with asphalt or good smooth paving.","in":"🚻 Toilet cabins | 🌳 Ancient pine forest | ☕ Barbecue zones, open-air pool, family cafes","hr":"10:00–16:00 on summer weekends. It is worth coming for the whole day."}}},{"id":49,"n":"Верёвочный парк в Повсине","pl":"Park Linowy w Powsinie","d":"X","lat":52.1135713,"lng":21.0937181,"a":"Maślaków 1","lo":4,"hi":5,"st":1,"sh":1,"t":["a"],"w":"","about":"Специализированный канатный городок, гармонично интегрированный в кроны деревьев на территории Парка культуры в Повсине.","why":"Отличный способ потренировать ловкость и преодолеть страх высоты. Для детей ростом от 110 см здесь создана специальная безопасная детская трасса с непрерывной системой страховки — ребенок физически не может отстегнуться во время прохождения подвесных мостиков и сеток. Подростков ждут сложные экстремальные высотные этапы.","ageT":"От 4–5 лет до подростков.","stT":"Ограниченно. Подкатить коляску к началу трасс можно по грунту, но вглубь леса проехать тяжело.","infra":"🚻 Инфраструктура Повсина | 🌳 Плотная тень деревьев | ☕ Точки с быстрой едой","hrs":"11:00 – 13:30. Из-за расположения в густом лесу здесь прохладно даже в зной.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLd-KRWnYZA5HWDp4sEYUFMAjx2Ppp3swziSn0JdQmS6dvL6aDi9ERgl343lWdrd6Rb3zKbwYOzyG9PDkhUWFYaaPcpEGTBEjmrSYy-uRCO4f_0RaMrk7WJqCsZUgIJJC5iEDzBI=w800-h450-k-no","fx":1,"pid":"ChIJQYXYlsstGUcRYaYl4obcEdI","pay":"p","L":{"pl":{"n":"Park Linowy w Powsinie","ab":"Specjalistyczny park linowy harmonijnie wkomponowany w korony drzew na terenie Parku Kultury w Powsinie.","wh":"Świetny sposób na trening zwinności i pokonanie lęku wysokości. Dla dzieci od 110 cm wzrostu stworzono specjalną bezpieczną trasę dziecięcą z nieprzerwanym systemem asekuracji — dziecko fizycznie nie może się odpiąć podczas pokonywania podwieszonych mostków i siatek. Nastolatków czekają wymagające ekstremalne etapy wysokościowe.","ag":"Od 4–5 lat do nastolatków.","st":"Ograniczona. Wózek można dowieźć do początku tras po gruncie, ale w głąb lasu ciężko dojechać.","in":"🚻 Infrastruktura Powsina | 🌳 Gęsty cień drzew | ☕ Punkty z szybkim jedzeniem","hr":"11:00–13:30. Ze względu na położenie w gęstym lesie jest tu chłodno nawet w upał."},"en":{"n":"Powsin Rope Park","ab":"A specialist rope park blended into the tree crowns in the Powsin Culture Park.","wh":"A great way to train agility and overcome a fear of heights. For children 110 cm and taller there is a special safe children's course with a continuous belay system — a child physically cannot unclip while crossing the suspended bridges and nets. Teenagers get challenging extreme high stages.","ag":"From 4–5 years to teenagers.","st":"Limited. You can wheel a stroller to the start of the courses over dirt, but going deeper into the forest is hard.","in":"🚻 Powsin infrastructure | 🌳 Dense tree shade | ☕ Fast-food points","hr":"11:00–13:30. Being in dense forest, it is cool here even in heat."}}},{"id":50,"n":"Детская кофейня «Inna bajka»","pl":"Inna bajka – miejsce spotkań","d":"U","lat":52.1824245,"lng":21.0444315,"a":"Aleja Gen. Władysława Sikorskiego 9b","lo":0,"hi":6,"st":2,"sh":1,"t":["a","c"],"w":"","about":"Стильная, теплая и продуманная до мелочей детская bawialnia семейного типа, созданная как альтернатива шумным игровым центрам.","why":"Здесь создано идеальное экологичное пространство для малышей и дошкольников. Вместо кричащего пластика — развивающие деревянные игрушки, вигвамы, зоны для моделирования и безопасная мягкая локация для ползания. Ежедневно проводятся творческие воркшопы, а родители могут выпить отличный спешелти-кофе в визуально приятной обстановке.","ageT":"От 0 до 6 лет.","stT":"Да. Просторный вход без порогов, удобное место для парковки колясок внутри.","infra":"🚻 Оборудован для детей | 🌳 В помещении | ☕ Полезные детские сладости и полноценное меню","hrs":"09:30 – 12:00. Малыши максимально активны и спокойны именно в утренние часы.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdjijI0UWa9Mtuoh1jF8mogABZepCNt_1DciYFzA2MeXPeKBjLtimLvCklOEWnQX9SwN0Ap8JH3N8akNi85ghjXa5jc_WIqdOkXBmV2lZSmRM5POjFTdEWAYHaC_x5zxxIR1lk=w800-h450-k-no","fx":1,"pid":"ChIJhy2eU1kzGUcRVy7epqDNp7U","pay":"p","L":{"pl":{"n":"Inna bajka – miejsce spotkań","ab":"Stylowa, ciepła i przemyślana w każdym szczególe rodzinna sala zabaw dla dzieci, stworzona jako alternatywa dla hałaśliwych centrów zabaw.","wh":"Powstała tu idealna ekologiczna przestrzeń dla maluchów i przedszkolaków. Zamiast krzykliwego plastiku — rozwijające drewniane zabawki, tipi, strefy modelowania i bezpieczna miękka strefa do raczkowania. Codziennie odbywają się warsztaty twórcze, a rodzice mogą wypić świetną kawę specialty w estetycznym otoczeniu.","ag":"0–6 lat.","st":"Tak. Przestronne wejście bez progów, wygodne miejsce na parkowanie wózków w środku.","in":"🚻 Dostosowane dla dzieci | 🌳 W budynku | ☕ Zdrowe słodkości dla dzieci i pełne menu","hr":"9:30–12:00. Maluchy są najbardziej aktywne i spokojne właśnie rano."},"en":{"n":"Inna Bajka Kids' Cafe","ab":"A stylish, warm, thoughtfully designed family play cafe for children, created as an alternative to noisy play centres.","wh":"An ideal eco-friendly space for toddlers and preschoolers. Instead of garish plastic — educational wooden toys, wigwams, modelling zones and a safe soft crawling area. Creative workshops run daily, and parents can enjoy excellent specialty coffee in pleasant surroundings.","ag":"0–6 years.","st":"Yes. A spacious entrance without thresholds, a convenient stroller parking spot inside.","in":"🚻 Equipped for children | 🌳 Indoors | ☕ Healthy sweets for kids and a full menu","hr":"9:30–12:00. Little ones are at their most active and calm in the morning hours."}}},{"id":51,"n":"Парк Козловского — холм Копа Цвила","pl":"Park Kozłowskiego – Kopa Cwila","d":"U","lat":52.1643192,"lng":21.0222446,"a":"Nutki","lo":0,"hi":16,"st":1,"sh":1,"t":["p"],"w":"","about":"Просторный урсыновский парк, главной доминантой которого является знаменитый искусственный 15-метровый холм Копа Цвила.","why":"Главный центр притяжения района для уличных забав. Летом его пологие зеленые склоны идеально подходят для семейного пикника и запуска воздушных змеев, которые ловят отличные потоки ветра на вершине. Зимой же Копа Цвила превращается в самую популярную и драйвовую трассу во всей Варшаве для катания на санках и сноубордах. У подножия обустроены прекрасные современные детские площадки.","ageT":"Для любого возраста (0+).","stT":"Ограниченно. Вокруг холма дорожки ровные, но подъем на саму вершину с коляской недоступен из-за крутизны склонов.","infra":"🚻 Городской модуль | 🌳 Частичная тень | ☕ Кафе в домах вокруг","hrs":"15:00 – 17:30 зимой (для санок) или 17:00 – 19:30 летом.","note":"","imgO":"","fx":1,"imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfn2nlxqdN4f6F8ds2UkzUqH-pqNuHH5TuLxJjeqzXqSAO3c0VhS2QXpb3TW8vChhTpY4iwyQV5K5hCtoWQmfw9G-Wc3uOylEaXdjd1YJMOF8O-XNGFheUWA0JC6GMK0JkIVZndTA=w800-h450-k-no","pid":"ChIJ48AAn-syGUcRoYq22tc3k9M","pay":"f","L":{"pl":{"n":"Park Kozłowskiego – Kopa Cwila","ab":"Przestronny park na Ursynowie, którego główną dominantą jest słynne sztuczne 15-metrowe wzgórze Kopa Cwila.","wh":"Główne miejsce plenerowych zabaw w dzielnicy. Latem jego łagodne zielone stoki idealnie nadają się na rodzinny piknik i puszczanie latawców, które łapią świetne podmuchy na szczycie. Zimą Kopa Cwila zamienia się w najpopularniejszą i najbardziej szaloną trasę w całej Warszawie do zjeżdżania na sankach i snowboardach. U podnóża urządzono wspaniałe nowoczesne place zabaw.","ag":"Dla dzieci w każdym wieku (0+).","st":"Ograniczona. Wokół wzgórza ścieżki są równe, ale wjazd na sam szczyt z wózkiem jest niemożliwy z powodu stromych stoków.","in":"🚻 Moduł miejski | 🌳 Częściowy cień | ☕ Kawiarnie w okolicznych domach","hr":"15:00–17:30 zimą (na sanki) lub 17:00–19:30 latem."},"en":{"n":"Kozłowski Park – Kopa Cwila Hill","ab":"A spacious Ursynów park whose main landmark is the famous artificial 15-metre hill Kopa Cwila.","wh":"The district's main outdoor-fun hub. In summer its gentle green slopes are perfect for a family picnic and kite flying, catching great winds at the top. In winter Kopa Cwila turns into the most popular and thrilling sledding and snowboarding run in all of Warsaw. Wonderful modern playgrounds lie at the foot.","ag":"Any age (0+).","st":"Limited. Paths around the hill are smooth, but climbing the summit itself with a stroller is impossible because of the steep slopes.","in":"🚻 City toilet module | 🌳 Partial shade | ☕ Cafes in surrounding buildings","hr":"15:00–17:30 in winter (for sledding) or 17:00–19:30 in summer."}}},{"id":52,"n":"Бассейн Aqua Relaks","pl":"Pływalnia Aqua Relaks","d":"U","lat":52.1290066,"lng":21.0585981,"a":"Pod Strzechą 3","lo":6,"hi":16,"st":2,"sh":1,"t":["w"],"w":"","about":"Современный крытый многофункциональный спортивный бассейн, полностью адаптированный под нужды семейного отдыха и обучения плаванию.","why":"Отличное место для первых водных шагов ребенка. Комплекс располагает специализированным малым бассейном с повышенной температурой воды и пологим безбарьерным спуском. Здесь регулярно проходят профессиональные занятия по грудничковому плаванию, а для детей постарше есть небольшие водные горки и гейзеры.","ageT":"От 6 месяцев (грудничковое плавание) до подростков.","stT":"Да. Специально оборудованный семейный комплекс с безбарьерным доступом к раздевалкам.","infra":"🚻 Зона бассейна | 🌳 В помещении | ☕ Автоматы со снеками и напитками","hrs":"12:00 – 14:00 в будни. В обеденное время дорожки пустуют, и в воде максимально спокойно.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcXQmR5Eoj8ej0Wr0_evDte2T1gcGAfpifuY3pKyPiZREMG2xHRam9iGHVv-u6ZXK4REMd3JzWomM7ykjsoe3OOIFUdiRSKuQntLpwSQZrHUCjc3UluBxZiJJP8g9kpohAj1oasRYdenNkp=w800-h450-k-no","fx":1,"pid":"ChIJS1XQUpctGUcRajpWIIFoGOI","pay":"p","L":{"pl":{"n":"Pływalnia Aqua Relaks","ab":"Nowoczesny kryty wielofunkcyjny basen sportowy, w pełni dostosowany do potrzeb rodzinnego wypoczynku i nauki pływania.","wh":"Świetne miejsce na pierwsze wodne kroki dziecka. Kompleks ma specjalistyczny mały basen z podwyższoną temperaturą wody i łagodnym zejściem bez barier. Regularnie odbywają się tu profesjonalne zajęcia pływania niemowląt, a dla starszych dzieci są niewielkie zjeżdżalnie wodne i gejzery.","ag":"Od 6 miesięcy (pływanie niemowląt) do nastolatków.","st":"Tak. Specjalnie wyposażony kompleks rodzinny z bezbarierowym dostępem do szatni.","in":"🚻 Strefa basenowa | 🌳 W pomieszczeniu | ☕ Automaty z przekąskami i napojami","hr":"12:00–14:00 w dni powszednie. W porze obiadowej tory są puste, a w wodzie jest najspokojniej."},"en":{"n":"Aqua Relaks Swimming Pool","ab":"A modern indoor multi-purpose sports pool fully adapted to family leisure and swimming lessons.","wh":"A great place for a child's first steps in the water. The complex has a specialised small pool with warmer water and a gentle barrier-free entry. Professional baby-swimming classes are held regularly, and for older children there are small water slides and geysers.","ag":"From 6 months (baby swimming) to teenagers.","st":"Yes. A specially equipped family complex with barrier-free access to the changing rooms.","in":"🚻 Pool area | 🌳 Indoors | ☕ Snack and drink vending machines","hr":"12:00–14:00 on weekdays. At lunchtime the lanes are empty and the water is calmest."}}},{"id":53,"n":"Космопарк в Blue City","pl":"Kosmopark w Blue City","d":"H","lat":52.2127688,"lng":20.9547477,"a":"Al. Jerozolimskie 179 (уровень +2)","lo":5,"hi":16,"st":2,"sh":1,"t":["m"],"w":"","about":"Масштабная интерактивно-образовательная космическая выставка, развернувшаяся на площадях торгово-развлекательного центра Blue City.","why":"Настоящий космос для маленьких исследователей. Здесь дети могут примерить скафандр астронавта, пройти тренировку на космических центрифугах-тренажерах, поуправлять марсоходом, испытать гравитацию других планет, совершить виртуальный полет к звездам в VR-очках и потрогать настоящие метеориты.","ageT":"От 5 лет до подростков (много интерактивных экранов и гаджетов).","stT":"Да. Выставка расположена на абсолютно ровных площадях торгового центра.","infra":"🚻 Туалеты ТЦ | 🌳 В помещении ТЦ | ☕ Множество ресторанов в Blue City","hrs":"10:00 – 13:00 (сразу после открытия ТЦ). Очереди к популярным симуляторам минимальны.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLeTpx_PkP4S-q_ZzodWclRIAnZymInFeURsf7A9PqDOxqPhuUOYDS_VT36xYWUFqMS3oIMH0QVgrixDk9SVo5iv4qF3MY3zCM9UH1Vt1TRjTK_G34YrB12ks-YqjlfqGsTF49kymScnyaEn=w800-h450-k-no","fx":1,"pid":"ChIJGU77s1vLHkcRt9DYjg7LZTM","pay":"p","L":{"pl":{"n":"Kosmopark w Blue City","ab":"Duża interaktywno-edukacyjna wystawa kosmiczna rozłożona na powierzchni centrum handlowo-rozrywkowego Blue City.","wh":"Prawdziwy kosmos dla małych badaczy. Dzieci mogą tu przymierzyć skafander astronauty, przejść trening na kosmicznych wirówkach, pokierować łazikiem marsjańskim, poczuć grawitację innych planet, odbyć wirtualny lot do gwiazd w goglach VR i dotknąć prawdziwych meteorytów.","ag":"Od 5 lat do nastolatków (wiele interaktywnych ekranów i gadżetów).","st":"Tak. Wystawa mieści się na idealnie równych powierzchniach centrum handlowego.","in":"🚻 Toalety w centrum handlowym | 🌳 W centrum handlowym | ☕ Wiele restauracji w Blue City","hr":"10:00–13:00 (zaraz po otwarciu centrum). Kolejki do popularnych symulatorów są minimalne.","ad":"Al. Jerozolimskie 179 (poziom +2)"},"en":{"n":"Kosmopark at Blue City","ab":"A large interactive and educational space exhibition set up in the Blue City shopping and entertainment centre.","wh":"Real space for little explorers. Here children can try on an astronaut suit, train on space centrifuge simulators, drive a Mars rover, feel the gravity of other planets, take a virtual flight to the stars in VR goggles and touch real meteorites.","ag":"From 5 years to teenagers (many interactive screens and gadgets).","st":"Yes. The exhibition is on perfectly level floors of the shopping centre.","in":"🚻 Shopping-centre toilets | 🌳 Inside the shopping centre | ☕ Many restaurants in Blue City","hr":"10:00–13:00 (right after the centre opens). Queues for popular simulators are minimal.","ad":"Al. Jerozolimskie 179 (level +2)"}}},{"id":54,"n":"Inca Play в Blue City","pl":"Inca Play w Blue City","d":"H","lat":52.2127688,"lng":20.9547477,"a":"Al. Jerozolimskie 179 (уровень +4)","lo":1,"hi":11,"st":2,"sh":1,"t":["a"],"w":"","about":"Уникальная, стилизованная под старинный парк аттракционов крытая игровая площадка на верхнем уровне ТЦ Blue City.","why":"Главная фишка центра — это наличие полноценных уличных аттракционов прямо внутри помещения: здесь дети могут прокатиться на мини-колесе обозрения, пиратском корабле-качелях или прыгнуть на тарзанке. Огромный многоуровневый лабиринт сделан из натурального дерева, а звукоизоляция зон позволяет родителям комфортно отдыхать в кафе.","ageT":"1–11 лет.","stT":"Да. Удобный заезд на лифтах ТЦ, внутри много места для проезда между игровыми элементами.","infra":"🚻 Свои детские санузлы | 🌳 Кондиционирование | ☕ Семейное бистро со здоровым меню внутри","hrs":"11:00 – 14:00 в будни. Отличный вариант оставить ребенка играть, пока родители заняты покупками.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfST5L63wWucDB33D-Z1LnPMnk26xQUuOAZiV1RFleoqqW3jAT5yJ2tmDdurOIh3y0O0X0MAnj6oriwDsJbNrz7pHby4BF9B1P6d2WqLEWoEqqhyCkwQcJVBjrhVewdC0aki3S6rqrIVhOC=w800-h450-k-no","fx":1,"pid":"ChIJzzlwGanLHkcRXaMtN_fVLmM","pay":"p","L":{"pl":{"n":"Inca Play w Blue City","ab":"Wyjątkowa kryta sala zabaw stylizowana na dawny wesołe miasteczko, na górnym poziomie centrum Blue City.","wh":"Główną atrakcją są pełnoprawne atrakcje wesołego miasteczka w pomieszczeniu: dzieci mogą przejechać się mini-diabelskim młynem, piracką huśtawką-statkiem lub skoczyć na tarzance. Ogromny wielopoziomowy labirynt wykonano z naturalnego drewna, a wyciszenie stref pozwala rodzicom wygodnie odpoczywać w kawiarni.","ag":"1–11 lat.","st":"Tak. Wygodny dojazd windami centrum handlowego, w środku dużo miejsca do przejazdu między elementami zabawy.","in":"🚻 Własne toalety dziecięce | 🌳 Klimatyzacja | ☕ Rodzinne bistro ze zdrowym menu w środku","hr":"11:00–14:00 w dni powszednie. Świetna opcja, by zostawić dziecko na zabawie, gdy rodzice robią zakupy.","ad":"Al. Jerozolimskie 179 (poziom +4)"},"en":{"n":"Inca Play at Blue City","ab":"A unique indoor play area styled as an old amusement park, on the upper level of Blue City.","wh":"The main feature is full-size funfair rides indoors: children can ride a mini Ferris wheel, a pirate-ship swing or jump on a zip-swing. The huge multi-level maze is made of natural wood, and soundproofed zones let parents relax comfortably in the cafe.","ag":"1–11 years.","st":"Yes. Easy access by the shopping centre's lifts, with plenty of room inside to pass between play elements.","in":"🚻 Own children's toilets | 🌳 Air conditioning | ☕ Family bistro with a healthy menu inside","hr":"11:00–14:00 on weekdays. A great option to leave the child playing while parents shop.","ad":"Al. Jerozolimskie 179 (level +4)"}}},{"id":55,"n":"Ферма дяди Тома (Диниоландия)","pl":"Farma Wujka Toma / Dyniolandia","d":"L","lat":52.2949092,"lng":20.8989036,"a":"ul. Kazimierza Wóycickiego 41","lo":1,"hi":9,"st":1,"sh":0,"t":["z"],"w":"","about":"Огромное загородное эко-пространство и агротуристическая ферма под открытым небом, расположенная на севере Варшавы.","why":"Прекрасная возможность показать городским детям деревенский колорит. Здесь можно погладить и покормить дружелюбных альпак, козочек и кроликов, попрыгать на гигантских надувных подушках-батутах, заплутать в соломенном лабиринте, а осенью — устроить потрясающую семейную фотосессию среди тысяч оранжевых тыкв на празднике урожая.","ageT":"1–9 лет.","stT":"Ограниченно. Территория эко-фермы грунтовая и травяная, с маленькими колесами-тростями катить может быть тяжело.","infra":"🚻 Эко-туалеты | 🌳 Открытое поле (работает в теплый сезон) | ☕ Фермерские закуски и лимонад","hrs":"10:00 – 13:00 по субботам (особенно в сентябре-октябре).","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdEd-3hllH5FmxwWbYSKFBdI_h-mD-w9FJ7fr2rgu4f4jic-nJX3Aa_ewOUYyJlPJQZkrcgbCNjiNbCBfV4wAySr0tOuTvokLGbwxqKFSBWx9TdLIZlViVHMdaQ_rsCNPdExS96HoiCfg13=w800-h450-k-no","fx":1,"pid":"ChIJ6fHapPjLHkcRIaSSqjnuYGA","pay":"p","L":{"pl":{"n":"Farma Wujka Toma / Dyniolandia","ab":"Ogromna podmiejska eko-przestrzeń i agroturystyczna farma pod gołym niebem na północy Warszawy.","wh":"Wspaniała okazja, by pokazać miejskim dzieciom wiejski koloryt. Można tu pogłaskać i nakarmić przyjazne alpaki, kózki i króliki, poskakać na gigantycznych dmuchanych poduszkach-trampolinach, zgubić się w słomianym labiryncie, a jesienią zrobić niezwykłą rodzinną sesję zdjęciową wśród tysięcy pomarańczowych dyń na święcie plonów.","ag":"1–9 lat.","st":"Ograniczona. Teren eko-farmy jest gruntowy i trawiasty, z małymi kółkami wózka może być ciężko jechać.","in":"🚻 Toalety ekologiczne | 🌳 Otwarte pole (czynne w ciepłym sezonie) | ☕ Przekąski z farmy i lemoniada","hr":"10:00–13:00 w soboty (zwłaszcza we wrześniu–październiku)."},"en":{"n":"Uncle Tom's Farm / Dyniolandia","ab":"A huge out-of-town eco-space and open-air agritourism farm in the north of Warsaw.","wh":"A wonderful chance to show city children countryside charm. You can stroke and feed friendly alpacas, goats and rabbits, bounce on giant inflatable cushion-trampolines, get lost in a straw maze, and in autumn take an amazing family photo shoot among thousands of orange pumpkins at the harvest festival.","ag":"1–9 years.","st":"Limited. The eco-farm's ground is dirt and grass, so it can be hard going with small stroller wheels.","in":"🚻 Eco toilets | 🌳 Open field (operates in the warm season) | ☕ Farm snacks and lemonade","hr":"10:00–13:00 on Saturdays (especially in September–October)."}}},{"id":56,"n":"AIRO и Space Kids","pl":"AIRO i Space Kids","d":"K","lat":52.1941108,"lng":20.9518108,"a":"Łopuszańska 22","lo":1,"hi":16,"st":2,"sh":1,"t":["a"],"w":"","about":"Гигантский двухкомпонентный развлекательный комплекс, объединяющий под одной крышей масштабную батутную арену и космический игровой городок.","why":"Идеальное комбо для семей с детьми разного возраста. Малыши до 5-6 лет отправляются в «Space Kids» — безопасную вселенную с мягкими ракетами, интерактивными песочницами и горками в сухой бассейн. Дети старше 6 лет и подростки могут оторваться в «AIRO» — огромной прыжковой зоне с профессиональными батутами, поролоновыми ямами и полосами препятствий ниндзя.","ageT":"1–5 лет (зона Space Kids), 6–16 лет (батутная арена AIRO).","stT":"Да. Большой современный комплекс, есть пандусы, лифты и парковка для колясок.","infra":"🚻 Чистые уборные | 🌳 В помещении | ☕ Панорамное «Airo Café» на втором уровне","hrs":"12:00 – 14:30. В обеденное время на батутной арене наступает затишье между группами.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLckzMOWK3PKV8LR-OoRWh_zR3OlJlYYH9vic47u5fIgruVIJSXKgmUbWH6yXRq2eVWTP4RAlng01-YF0o3sB9yiwUdfPdQfSDTu-QqjYan81AqK2Ae7dT9tvcvX52w8ACgaeaSAGA=w800-h450-k-no","fx":1,"pid":"ChIJVd1MZcYzGUcRLA0LLLNzmxo","pay":"p","L":{"pl":{"n":"AIRO i Space Kids","ab":"Gigantyczny dwuczęściowy kompleks rozrywkowy łączący pod jednym dachem dużą arenę trampolin i kosmiczne miasteczko zabaw.","wh":"Idealne combo dla rodzin z dziećmi w różnym wieku. Maluchy do 5–6 lat idą do „Space Kids” — bezpiecznego wszechświata z miękkimi rakietami, interaktywnymi piaskownicami i zjeżdżalniami do suchego basenu. Dzieci powyżej 6 lat i nastolatki mogą szaleć w „AIRO” — ogromnej strefie skoków z profesjonalnymi trampolinami, dołami z pianką i torami przeszkód ninja.","ag":"1–5 lat (strefa Space Kids), 6–16 lat (arena trampolin AIRO).","st":"Tak. Duży nowoczesny kompleks, są podjazdy, windy i parking na wózki.","in":"🚻 Czyste toalety | 🌳 W budynku | ☕ Panoramiczna „Airo Café” na drugim poziomie","hr":"12:00–14:30. W porze obiadowej na arenie trampolin zapada cisza między grupami."},"en":{"n":"AIRO & Space Kids","ab":"A giant two-part entertainment complex combining a large trampoline arena and a space-themed play town under one roof.","wh":"A perfect combo for families with children of different ages. Toddlers up to 5–6 go to “Space Kids” — a safe universe with soft rockets, interactive sandpits and slides into a dry ball pit. Children over 6 and teenagers can let loose at “AIRO” — a huge jump zone with professional trampolines, foam pits and ninja obstacle courses.","ag":"1–5 years (Space Kids zone), 6–16 years (AIRO trampoline arena).","st":"Yes. A large modern complex with ramps, lifts and stroller parking.","in":"🚻 Clean restrooms | 🌳 Indoors | ☕ Panoramic “Airo Cafe” on the second level","hr":"12:00–14:30. At lunchtime the trampoline arena quietens between groups."}}},{"id":57,"n":"Музей аркадных автоматов","pl":"Muzeum Gier Wideo – Warsaw Arcade Museum","d":"K","lat":52.1945838,"lng":20.9237816,"a":"Al. Jerozolimskie 200","lo":8,"hi":16,"st":1,"sh":1,"t":["m","a"],"w":"","about":"Интерактивный музей-выставка, собравший крупнейшую в Польше частную коллекцию из более чем 120 ретро-видеоигр и пинбола 80-90-х годов.","why":"Купив один входной билет, подростки получают абсолютный безлимит на все автоматы (жетоны не нужны). Сюда стоит идти ради легендарных Mortal Kombat, Pac-Man, гоночных и стрелковых симуляторов. Место гарантирует бурю эмоций у школьников и мощную дозу ностальгии у их родителей.","ageT":"От 8 лет и старше (подростки будут в полном восторге).","stT":"Ограниченно. Заехать можно, но ангарное пространство плотно заставлено автоматами, проходы бывают узкими.","infra":"🚻 Есть | 🌳 В помещении | ☕ Автоматы со снеками и напитками","hrs":"13:00 – 15:30. Самое спокойное время, когда автоматы свободны.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcjHYhLnkrRvptOgPHYJb8fEhFZpkJv_lywcpDEAtqOdXJulW4HnZJ1RenlMQmYEKQcuQeE02PzPcOLtDLRu_HXqJqhOmquLhSGZbdEMDFl8hMCpb1XXI05DcGMqMqnXkEz1ig1=w800-h450-k-no","fx":1,"pid":"ChIJd3guCnU1GUcRmk5C2dp3al8","pay":"p","L":{"pl":{"n":"Muzeum Gier Wideo – Warsaw Arcade Museum","ab":"Interaktywne muzeum-wystawa, w którym zgromadzono największą w Polsce prywatną kolekcję ponad 120 retro gier wideo i flipperów z lat 80.–90.","wh":"Kupując jeden bilet wstępu, nastolatki dostają absolutny nielimit na wszystkie automaty (żetony niepotrzebne). Warto przyjść dla legendarnych Mortal Kombat, Pac-Mana, symulatorów wyścigowych i strzelanek. Miejsce gwarantuje burzę emocji u uczniów i potężną dawkę nostalgii u ich rodziców.","ag":"Od 8 lat (nastolatkowie będą zachwyceni).","st":"Ograniczona. Można wjechać, ale hangarowa przestrzeń jest gęsto zastawiona automatami, przejścia bywają wąskie.","in":"🚻 Są | 🌳 W pomieszczeniu | ☕ Automaty z przekąskami i napojami","hr":"13:00–15:30. Najspokojniejszy czas, gdy automaty są wolne."},"en":{"n":"Warsaw Arcade Museum","ab":"An interactive museum-exhibition that has gathered Poland's largest private collection of more than 120 retro video games and pinball machines from the 1980s–90s.","wh":"With a single entry ticket, teenagers get absolutely unlimited play on all machines (no tokens needed). Come for the legendary Mortal Kombat, Pac-Man, racing and shooting simulators. The place guarantees a storm of emotions for schoolchildren and a powerful dose of nostalgia for their parents.","ag":"From 8 years (teenagers will be delighted).","st":"Limited. You can get in, but the hangar-like space is densely packed with machines and aisles can be narrow.","in":"🚻 Yes | 🌳 Indoors | ☕ Snack and drink vending machines","hr":"13:00–15:30. The calmest time, when the machines are free."}}},{"id":58,"n":"Парк Щесливицкий","pl":"Park Szczęśliwicki","d":"H","lat":52.2047413,"lng":20.9593258,"a":"Włodarzewska 22","lo":0,"hi":16,"st":2,"sh":1,"t":["p"],"w":"Park Szczęśliwicki","about":"Один из самых рельефных и живописных парков Варшавы, разбитый вокруг каскада бывших глиняных карьеров, превращенных в чистые озера с лебедями.","why":"Настоящий курорт внутри города. Летом здесь работает великолепный открытый комплекс уличных бассейнов с горками, а на вершине главного холма (Górka Szczęśliwicka) обустроена уникальная круглогодичная гравитационная горка-тобогган — дети могут прокатиться на высокой скорости на специальных тележках по рельсовому треку, любуясь панорамой города.","ageT":"Для любого возраста (0+).","stT":"Да. Отличные широкие асфальтированные дорожки вокруг озера и холмов.","infra":"🚻 Туалеты в парке | 🌳 Отличные тенистые холмы | ☕ Рестораны и пиццерии у воды","hrs":"15:00 – 18:00. Идеальное время прокатиться на альпийском тобоггане.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLd6wc7cJUnee87Q37AufIL15gdh7yoVUmvPwfJwNnj4cD8CZlPO6ytGQNR5mZAxHTGBlMU-jAyl_QnNl9g-2Krm9Gfd9V2a4ODGHDVBo2HVcsmiziaIa_H1SKr8oF62rcYe5EiD=w800-h450-k-no","fx":1,"pid":"ChIJ07TYV6rMHkcRRAUQ0C9LhlE","pay":"f","L":{"pl":{"n":"Park Szczęśliwicki","ab":"Jeden z najbardziej rzeźbionych i malowniczych parków Warszawy, rozłożony wokół kaskady dawnych glinianek zamienionych w czyste jeziora z łabędziami.","wh":"Prawdziwy kurort w mieście. Latem działa tu wspaniały otwarty kompleks basenów ze zjeżdżalniami, a na szczycie głównego wzgórza (Górka Szczęśliwicka) urządzono wyjątkową całoroczną grawitacyjną zjeżdżalnię-toboga — dzieci mogą z dużą prędkością zjechać na specjalnych wózkach po torze szynowym, podziwiając panoramę miasta.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Świetne szerokie asfaltowe alejki wokół jeziora i wzgórz.","in":"🚻 Toalety w parku | 🌳 Doskonałe zacienione wzgórza | ☕ Restauracje i pizzerie nad wodą","hr":"15:00–18:00. Idealny czas na przejażdżkę alpejskim tobogganem."},"en":{"n":"Szczęśliwicki Park","ab":"One of Warsaw's most relief-rich and picturesque parks, laid out around a cascade of former clay pits turned into clean lakes with swans.","wh":"A real resort within the city. In summer a splendid open-air pool complex with slides operates here, and on top of the main hill (Górka Szczęśliwicka) there is a unique year-round gravity toboggan — children can ride at high speed on special carts along a rail track, enjoying the city panorama.","ag":"Any age (0+).","st":"Yes. Great wide asphalt paths around the lake and hills.","in":"🚻 Toilets in the park | 🌳 Excellent shaded hills | ☕ Restaurants and pizzerias by the water","hr":"15:00–18:00. The ideal time for a ride on the alpine toboggan."}}},{"id":59,"n":"Парк Гурчевска","pl":"Park Górczewska","d":"B","lat":52.2335236,"lng":20.9053919,"a":"Raginisa","lo":0,"hi":16,"st":2,"sh":1,"t":["p","g"],"w":"","about":"Большой, современный и очень ухоженный районный парк с амфитеат
