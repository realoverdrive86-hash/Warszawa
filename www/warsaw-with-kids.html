ром, масштабными игровыми площадками и собственной соляной градирней (tężnia solankowa).","why":"Прекрасное место для спокойного и оздоровительного отдыха. Дети могут вдоволь набегаться на огороженных игровых городках с безопасным покрытием, а у соляной градирни можно подышать целебным морским воздухом, насыщенным йодом и микроэлементами.","ageT":"Для любого возраста (0+).","stT":"Да. Современная парковая зона с пологими съездами и широкими гладкими аллеями.","infra":"🚻 Туалетные модули | 🌳 Средняя затененность | ☕ Кафе-мороженые у входов","hrs":"16:30 – 19:00 летом. Жара спадает, а в амфитеатре парка часто начинаются бесплатные детские шоу.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdgckhKnp3V-WReMia1j6ymkNnrEe0KJKNwQ1e2oIurxauedeEHzSPCj_zrnrLHTk1bO2cEfrpyX8yYoDJ1YTUHnM-WykbOx4z6DjQrRiJk_w99bFW-NvEmYCJNl9xmlax3PRfS=w800-h450-k-no","fx":1,"pid":"ChIJ2W3nkd_KHkcR2zK4koViRYc","pay":"f","L":{"pl":{"n":"Park Górczewska","ab":"Duży, nowoczesny i bardzo zadbany park dzielnicowy z amfiteatrem, rozległymi placami zabaw i własną tężnią solankową.","wh":"Wspaniałe miejsce na spokojny i prozdrowotny wypoczynek. Dzieci mogą do woli wybiegać się na ogrodzonych miasteczkach zabaw z bezpieczną nawierzchnią, a przy tężni solankowej można pooddychać leczniczym morskim powietrzem nasyconym jodem i mikroelementami.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Nowoczesna strefa parkowa z łagodnymi zjazdami i szerokimi gładkimi alejami.","in":"🚻 Moduły toaletowe | 🌳 Średnie zacienienie | ☕ Lodziarnie przy wejściach","hr":"16:30–19:00 latem. Upał spada, a w parkowym amfiteatrze często zaczynają się bezpłatne pokazy dla dzieci."},"en":{"n":"Górczewska Park","ab":"A large, modern and very well-kept district park with an amphitheatre, extensive playgrounds and its own salt graduation tower (tężnia).","wh":"A wonderful place for calm, health-boosting rest. Children can run to their heart's content in fenced play towns with a safe surface, and by the salt graduation tower you can breathe healing sea air rich in iodine and trace elements.","ag":"Any age (0+).","st":"Yes. A modern park area with gentle ramps and wide smooth avenues.","in":"🚻 Toilet modules | 🌳 Moderate shade | ☕ Ice-cream cafes at the entrances","hr":"16:30–19:00 in summer. The heat fades and free children's shows often start at the park's amphitheatre."}}},{"id":60,"n":"Площадка Юрского периода (Олькувек)","pl":"Plac zabaw Park Jurajski (Olkówek)","d":"U","lat":52.1608018,"lng":21.0238317,"a":"Puszczyka 18","lo":2,"hi":11,"st":2,"sh":1,"t":["g"],"w":"","about":"Тематическая бесплатная игровая зона на Урсынуве, полностью посвященная эпохе динозавров и палеонтологии.","why":"Настоящий хит для юных исследователей. Дети могут лазить по огромным деревянным скелетам динозавров, качаться на качелях в форме доисторических яиц, спускаться с закрученных горок и проводить «археологические раскопки» в гигантской песочнице, выкапывая скрытые под песком окаменелые кости ящеров.","ageT":"2–11 лет.","stT":"Да. Вокруг игровых элементов проложены удобные дорожки, покрытие площадки — безопасная резина и мелкий круглый гравий.","infra":"🚻 Бесплатный биотуалет | 🌳 Частичная тень сосен | ☕ Кофейня у входа","hrs":"09:00 – 11:30 в будни. Сосны дают кружевную тень, а песок в раскопках еще прохладный.","note":"","imgO":"","fx":1,"imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcns21bTru760j-81EjcKmqS2339cnPBtoSlHg3Jxh8h6qP5kH-OU9QODK_T9iRwO13-vOiS7h2DAPj8HOgjBexl3HA0U65f4ZEuuKvVwMJD9g6H2yu-Fz02PYp40x2tnmTdOpC=w800-h450-k-no","pid":"ChIJQ8BRJZMyGUcRNNSnLQ726pI","pay":"f","L":{"pl":{"n":"Plac zabaw Park Jurajski (Olkówek)","ab":"Tematyczna bezpłatna strefa zabaw na Ursynowie, w całości poświęcona epoce dinozaurów i paleontologii.","wh":"Prawdziwy hit dla młodych badaczy. Dzieci mogą wspinać się po ogromnych drewnianych szkieletach dinozaurów, huśtać się na huśtawkach w kształcie prehistorycznych jaj, zjeżdżać z krętych zjeżdżalni i prowadzić „wykopaliska archeologiczne” w gigantycznej piaskownicy, wykopując ukryte pod piaskiem skamieniałe kości gadów.","ag":"2–11 lat.","st":"Tak. Wokół elementów zabawy poprowadzono wygodne alejki, nawierzchnia placu to bezpieczna guma i drobny okrągły żwir.","in":"🚻 Bezpłatna toaleta przenośna | 🌳 Częściowy cień sosen | ☕ Kawiarnia przy wejściu","hr":"9:00–11:30 w dni powszednie. Sosny dają ażurowy cień, a piasek w wykopaliskach jest jeszcze chłodny."},"en":{"n":"Jurassic Playground (Olkówek)","ab":"A themed free play area in Ursynów, entirely devoted to the age of dinosaurs and palaeontology.","wh":"A real hit for young explorers. Children can climb huge wooden dinosaur skeletons, swing on swings shaped like prehistoric eggs, slide down twisting slides and run “archaeological digs” in a giant sandpit, unearthing fossilised reptile bones hidden in the sand.","ag":"2–11 years.","st":"Yes. Convenient paths run around the play elements, and the playground surface is safe rubber and fine round gravel.","in":"🚻 Free portable toilet | 🌳 Partial pine shade | ☕ Cafe at the entrance","hr":"9:00–11:30 on weekdays. The pines give lacy shade and the sand in the digs is still cool."}}},{"id":61,"n":"Эко-площадка в парке «Акция Буря»","pl":"Plac zabaw w Parku Akcji „Burza”","d":"M","lat":52.2119589,"lng":21.0555757,"a":"Bartycka 26","lo":4,"hi":14,"st":2,"sh":1,"t":["g","p"],"w":"","about":"Уникальный ландшафтный игровой комплекс у подножия исторического кургана, завоевавший престижные европейские архитектурные награды.","why":"Площадка выполнена исключительно из дикой робинии и натуральных материалов. Здесь обустроены сложнейшие канатные лабиринты, полосы препятствий, подвесные мосты, ручные гидравлические помпы для игр с водой и экстремально высокие закрытые горки.","ageT":"От 4 до 14 лет.","stT":"Да. Гладкие эко-мостики и пологие съезды без единой ступеньки на пути к вершине.","infra":"🚻 Модульный туалет | 🌳 Окружена деревьями, тенистые зоны | ☕ Кофейные фудтраки","hrs":"16:00 – 19:00. Площадка частично находится в прохладной тени холма.","note":"","imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLfN12yfAu6S2X5F1l3iEao0-s0N97nki5hQau-0kMyj074ZJ50bN008qzaDUMwxlwlFavHySH3KtfkBeKvHpm7gn7pLqouJBNDOJosPb4IbDX1m8GZEme2GkBiIXdcz_qjHhkuo=s1330-w784-h1330-rw","fx":1,"pid":"ChIJXxsrQRTNHkcRxvKRV8QcrWQ","pay":"f","L":{"pl":{"n":"Plac zabaw w Parku Akcji „Burza”","ab":"Wyjątkowy krajobrazowy kompleks zabaw u stóp historycznego kopca, wyróżniony prestiżowymi europejskimi nagrodami architektonicznymi.","wh":"Plac zabaw wykonano wyłącznie z dzikiej robinii i naturalnych materiałów. Są tu bardzo wymagające labirynty linowe, tory przeszkód, mosty podwieszane, ręczne pompy hydrauliczne do zabaw z wodą i ekstremalnie wysokie zamknięte zjeżdżalnie.","ag":"4–14 lat.","st":"Tak. Gładkie eko-mostki i łagodne zjazdy bez ani jednego schodka na drodze na szczyt.","in":"🚻 Moduł toaletowy | 🌳 Otoczony drzewami, zacienione strefy | ☕ Food trucki z kawą","hr":"16:00–19:00. Plac zabaw częściowo leży w chłodnym cieniu wzgórza."},"en":{"n":"Eco Playground in Operation Tempest Park","ab":"A unique landscape play complex at the foot of a historic mound, winner of prestigious European architecture awards.","wh":"The playground is made exclusively of wild black locust wood and natural materials. It has very demanding rope mazes, obstacle courses, suspension bridges, hand hydraulic pumps for water play and extremely tall enclosed slides.","ag":"4–14 years.","st":"Yes. Smooth eco-bridges and gentle ramps without a single step on the way to the top.","in":"🚻 Toilet module | 🌳 Surrounded by trees, shaded zones | ☕ Coffee food trucks","hr":"16:00–19:00. The playground lies partly in the cool shade of the hill."}}},{"id":62,"n":"Водная площадка Syrenka","pl":"Wodny plac zabaw Syrenka","d":"J","lat":52.2269,"lng":21.1448,"a":"ul. Starego Doktora 1","lo":0,"hi":10,"st":2,"sh":0,"t":["w","g"],"w":"","about":"Бесплатная водная площадка под открытым небом в спортивном комплексе Syrenka (OSiR Wawer).","why":"Водные пушки, гейзеры, арки и «водный вулкан», а главный хит — огромное ведро, которое каждые 15–20 минут выливает волну воды.","ageT":"От малышей до младших школьников. До 3 лет — в плавательных подгузниках, до 7 лет — только с присмотром взрослых.","stT":"Да. Безбарьерная территория, пологие съезды.","infra":"🚻 Туалеты и раздевалки | 🌳 Чаша на солнце, скамейки рядом | ☕ Летом киоск с мороженым","hrs":"Ежедневно 10:00–19:00, только в тёплый сезон и при хорошей погоде.","pid":"ChIJe9oZAgDTHkcROA_JHYtvx_Y","fx":1,"imgG":"https://vitrina.pl/images/2024/05/akvapark-dlya-detej-varszava-3.jpg","imgL":"vitrina.pl","pay":"f","L":{"pl":{"n":"Wodny plac zabaw Syrenka","ab":"Bezpłatny wodny plac zabaw pod gołym niebem w kompleksie sportowym Syrenka (OSiR Wawer).","wh":"Armatki wodne, gejzery, łuki i „wodny wulkan”, a głównym hitem jest ogromne wiadro, które co 15–20 minut wylewa falę wody.","ag":"Od maluchów do młodszych uczniów. Do 3 lat — w pieluchach do pływania, do 7 lat — tylko pod opieką dorosłych.","st":"Tak. Teren bez barier, łagodne zjazdy.","in":"🚻 Toalety i przebieralnie | 🌳 Misa na słońcu, ławki obok | ☕ Latem kiosk z lodami","hr":"Codziennie 10:00–19:00, tylko w ciepłym sezonie i przy dobrej pogodzie."},"en":{"n":"Syrenka Water Playground","ab":"A free open-air water playground in the Syrenka sports complex (OSiR Wawer).","wh":"Water cannons, geysers, arches and a “water volcano”, and the main hit is a huge bucket that tips out a wave of water every 15–20 minutes.","ag":"From toddlers to younger schoolchildren. Under 3 — in swim nappies, under 7 — only under adult supervision.","st":"Yes. Barrier-free area, gentle ramps.","in":"🚻 Toilets and changing rooms | 🌳 Basin in the sun, benches nearby | ☕ Ice-cream kiosk in summer","hr":"Daily 10:00–19:00, only in the warm season and in good weather."}}},{"id":63,"n":"Площадка у Westfield Arkadia","pl":"Plac zabaw przy Arkadii","d":"C","lat":52.25688,"lng":20.98402,"a":"Aleja Jana Pawła II 82 (перед главным входом в ТЦ)","lo":1,"hi":12,"st":2,"sh":1,"t":["g"],"w":"","about":"Бесплатная площадка перед ТЦ с волнообразной конструкцией «Всплеск» (Wstęga): холмы, мини-батуты и туннели.","why":"Неоновые качели-кольца, верёвочные лабиринты, закрытые горки, а летом водный трек с мини-дамбами.","ageT":"От 1 года до 12 лет, площадка поделена на зоны.","stT":"Да. Современная зона отдыха у ТЦ, идеальное прорезиненное покрытие без единого барьера.","infra":"🚻 Туалет в ТЦ, 1–2 минуты | 🌳 Тень частично | ☕ Кафе у площадки","hrs":"Ежедневно 9:00–22:00. Водные игры только в тёплый сезон.","note":"","imgO":"","pid":"ChIJOTHmPmLLHkcR1IgK4SvKyaI","fx":1,"imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLf5Vt0iX8T_oSYnqpxOjySMpws0dExxhiGAYejCqhJayre0u093sZXIiKHRhgrfwWvUDP7UsIynGeRoF40VAKI6MmW38WaS2MGLZXLnJzemjOnpXPLw_uLVCBW3UjAlQVPDL0jYVg=s1330-w784-h1330-rw","pay":"f","L":{"pl":{"n":"Plac zabaw przy Arkadii","ab":"Bezpłatny plac zabaw przed centrum handlowym z falistą konstrukcją „Wstęga” (Wstęga): pagórki, mini-trampoliny i tunele.","wh":"Neonowe huśtawki-obręcze, linowe labirynty, zamknięte zjeżdżalnie, a latem wodny tor z mini-tamami.","ag":"Od 1 roku do 12 lat, plac podzielony jest na strefy.","st":"Tak. Nowoczesna strefa rekreacji przy centrum handlowym, idealna gumowa nawierzchnia bez żadnych barier.","in":"🚻 Toaleta w centrum handlowym, 1–2 minuty | 🌳 Częściowy cień | ☕ Kawiarnia przy placu zabaw","hr":"Codziennie 9:00–22:00. Zabawy wodne tylko w ciepłym sezonie.","ad":"Aleja Jana Pawła II 82 (przed głównym wejściem do centrum handlowego)"},"en":{"n":"Playground at Westfield Arkadia","ab":"A free playground in front of the shopping centre with a wave-shaped structure called “Splash” (Wstęga): hills, mini trampolines and tunnels.","wh":"Neon ring swings, rope mazes, enclosed slides, and in summer a water track with mini dams.","ag":"From 1 year to 12 years, the playground is divided into zones.","st":"Yes. A modern recreation area by the shopping centre with ideal rubberised flooring and no barriers.","in":"🚻 Toilet in the shopping centre, 1–2 minutes away | 🌳 Partial shade | ☕ Cafe by the playground","hr":"Daily 9:00–22:00. Water play only in the warm season.","ad":"Aleja Jana Pawła II 82 (in front of the main entrance of the shopping centre)"}}},{"id":64,"n":"Лесная площадка в Фортах Бема","pl":"Plac zabaw Fort Bema","d":"B","lat":52.2562,"lng":20.9329,"a":"Obrońców Tobruku (парк Форт Бема)","lo":1,"hi":12,"st":2,"sh":1,"t":["g","p"],"w":"","about":"Одна из крупнейших игровых зон города посреди старого леса и парка Форт Бема.","why":"Большие деревянные башни, верёвочные паутины, батуты, закрытые горки-трубы и канатный городок. В жару спасает тень деревьев.","ageT":"От 1 года до 12+ лет, для малышей есть отдельная огороженная зона.","stT":"Да. Ровные дорожки, но внутри игровых зон глубокий песок.","infra":"🚻 Туалет с пеленальным столиком | 🌳 Густая тень | ☕ Кафе Młynek и Cafe Jurta","hrs":"10:30 – 14:30. Густая тенистая крона защищает от солнца даже в полдень.","note":"","imgO":"","pid":"ChIJH5zc_qvLHkcRGoVaug9SGb4","fx":1,"imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLcNdHvNNAM0NJi17aCmhogwMEpxmKRtogltK8Ffrnl4Q3XqLFqfiUlgTi7gmPgVi0u67juoeNrpQHC0lxEmEuvkp6-7p1UlNTIrIAjKh_TQTxGXonZOeTO4ix0pqspJTi9UB8ocbA=s1330-w784-h1330-rw","pay":"f","L":{"pl":{"n":"Plac zabaw Fort Bema","ab":"Jedna z największych stref zabaw w mieście pośrodku starego lasu i parku Fort Bema.","wh":"Duże drewniane wieże, pajęczyny linowe, trampoliny, zamknięte zjeżdżalnie-rury i miasteczko linowe. W upał ratuje cień drzew.","ag":"Od 1 roku do 12+ lat, dla maluchów jest osobna ogrodzona strefa.","st":"Tak. Równe alejki, ale wewnątrz stref zabaw jest głęboki piasek.","in":"🚻 Toaleta ze stolikiem do przewijania | 🌳 Gęsty cień | ☕ Kawiarnie Młynek i Cafe Jurta","hr":"10:30–14:30. Gęsta zacieniona korona chroni przed słońcem nawet w południe.","ad":"Obrońców Tobruku (park Fort Bema)"},"en":{"n":"Fort Bema Forest Playground","ab":"One of the city's largest play zones in the middle of an old forest and Fort Bema park.","wh":"Big wooden towers, rope webs, trampolines, enclosed tube slides and a rope town. Tree shade saves the day in the heat.","ag":"From 1 year to 12+ years, with a separate fenced zone for toddlers.","st":"Yes. Smooth paths, but there is deep sand inside the play zones.","in":"🚻 Toilet with changing table | 🌳 Dense shade | ☕ Młynek and Cafe Jurta cafes","hr":"10:30–14:30. The dense shady canopy protects from the sun even at noon.","ad":"Obrońców Tobruku (Fort Bema park)"}}},{"id":65,"n":"Кафе-мороженое Ulica Baśniowa","pl":"Lodziarnia Ulica Baśniowa","d":"Z","lat":52.25752,"lng":20.97858,"a":"aleja Wojska Polskiego 41/lok 102/103","lo":1,"hi":8,"st":2,"sh":1,"t":["c"],"w":"","about":"Семейное кафе-кондитерская на Жолибоже в виде старинной сказочной улочки.","why":"Итальянское джелато порциями на выбор (можно несколько вкусов сразу), веганские сорбеты, безглютеновые рожки и лёд без сахара. Малышам можно попробовать ложечку.","ageT":"1–8 лет.","stT":"Да. Вход на уровне тротуара, без ступеней, двери широкие.","infra":"🚻 Туалет внутри | 🌳 Тенистая аллея, летом веранда | ☕ Кофе, горячий шоколад, выпечка","hrs":"Вт–вс 11:00–20:00, пн 13:00–20:00. Лучше в будни до 15:00, в выходные после обеда очередь.","note":"","imgO":"","imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLf5spzjmI75HFStGY3AcoB8lkO5QJdF7PDbXZp8wX6dOHYjwoloFDDMzL0r2NeODBbxJ5nBE4RM0CIutB9lgk_qf3VRUB8_M0LDHd-lUwUJ8B7BL_1GRUNcXsIWcZnBM0MA_FNsKg=s1330-w784-h1330-rw","fx":1,"pid":"ChIJTVIGeJLLHkcRkH1NqffyWA4","pay":"m","L":{"pl":{"n":"Lodziarnia Ulica Baśniowa","ab":"Rodzinna kawiarnia-cukiernia na Żoliborzu w formie dawnej bajkowej uliczki.","wh":"Włoskie gelato w porcjach do wyboru (można kilka smaków naraz), wegańskie sorbety, bezglutenowe rożki i lody bez cukru. Maluchy mogą spróbować łyżeczki.","ag":"1–8 lat.","st":"Tak. Wejście na poziomie chodnika, bez schodów, drzwi szerokie.","in":"🚻 Toaleta w środku | 🌳 Zacieniona aleja, latem ogródek | ☕ Kawa, gorąca czekolada, wypieki","hr":"Wt–nd 11:00–20:00, pn 13:00–20:00. Lepiej w dni powszednie do 15:00, w weekendy po obiedzie jest kolejka."},"en":{"n":"Ulica Baśniowa Ice Cream Cafe","ab":"A family cafe and pastry shop in Żoliborz designed as an old fairy-tale street.","wh":"Italian gelato in portions of your choice (you can have several flavours at once), vegan sorbets, gluten-free cones and sugar-free ice cream. Little ones can try a spoonful.","ag":"1–8 years.","st":"Yes. Entrance at pavement level, no steps, wide doors.","in":"🚻 Toilet inside | 🌳 Shady avenue, summer terrace | ☕ Coffee, hot chocolate, pastries","hr":"Tue–Sun 11:00–20:00, Mon 13:00–20:00. Better on weekdays before 15:00; at weekends there is a queue after lunch."}}},{"id":66,"n":"Пляж Саска Кемпа","pl":"Plaża Saska Kępa","d":"P","lat":52.2280783,"lng":21.049371,"a":"Wał Miedzeszyński","lo":3,"hi":16,"st":0,"sh":1,"t":["w","p"],"w":"","about":"Уникальный дикий песчаный пляж у реки и скрытая экологическая тропа через настоящий заповедный пойменный лес (зона Natura 2000).","why":"Настоящий дикий оазис посреди мегаполиса. Сюда стоит идти ради мини-походов, сбора ракушек у воды, строительства песчаных замков и пикников на пледах.","ageT":"От 3 лет (для мини-походов и пикников).","stT":"Нет. Тропа лесная с выступающими корнями, а на пляже глубокий песок. Лучше использовать эрго-рюкзак.","infra":"🚻 Кабинки летом | 🌳 Густой прибрежный лес | ☕ Семейное кафе «Plażówka» неподалеку","hrs":"16:30 – 19:30 в теплые дни. Самое красивое время для наблюдения за закатом над Вислой.","note":"","imgO":"","imgG":"https://lh3.googleusercontent.com/gps-cs-s/ANWiy9SkIBLIvT71dcZeGREO6scW3wtO0uYe090adeQXyoiYroDSFUevtGC2uECUygmvJ1LFrAls-fRbfMvNVZb0ZdST0YYSfyzsA3d7ABNF9WivYiFQoWaerQ9syrORI-Gtrj4woqZ8=s1330-w784-h1330-rw","fx":1,"pid":"ChIJp6KCKQfNHkcRs2qWr-AD8sI","pay":"f","L":{"pl":{"n":"Plaża Saska Kępa","ab":"Wyjątkowa dzika piaszczysta plaża nad rzeką i ukryta ścieżka ekologiczna przez prawdziwy chroniony las łęgowy (obszar Natura 2000).","wh":"Prawdziwa dzika oaza pośrodku metropolii. Warto tu przyjść na mini-wędrówki, zbieranie muszelek przy wodzie, budowanie zamków z piasku i pikniki na kocach.","ag":"Od 3 lat (na mini-wędrówki i pikniki).","st":"Nie. Ścieżka leśna z wystającymi korzeniami, a na plaży głęboki piasek. Lepiej użyć nosidła.","in":"🚻 Kabiny latem | 🌳 Gęsty las nadbrzeżny | ☕ Rodzinna kawiarnia „Plażówka” w pobliżu","hr":"16:30–19:30 w ciepłe dni. Najpiękniejszy czas na obserwację zachodu słońca nad Wisłą."},"en":{"n":"Saska Kępa Beach","ab":"A unique wild sandy beach by the river and a hidden eco trail through a genuine protected floodplain forest (Natura 2000 zone).","wh":"A real wild oasis in the middle of a metropolis. Come for mini-hikes, collecting shells by the water, building sandcastles and picnics on blankets.","ag":"From 3 years (for mini-hikes and picnics).","st":"No. The forest trail has protruding roots and the beach has deep sand. A baby carrier works better.","in":"🚻 Cabins in summer | 🌳 Dense riverside forest | ☕ Family cafe “Plażówka” nearby","hr":"16:30–19:30 on warm days. The most beautiful time to watch the sunset over the Vistula."}}},{"id":67,"n":"Кукольный театр «Бай»","pl":"Teatr Baj","d":"P","lat":52.2525,"lng":21.0344443,"a":"ul. Jagiellońska 28","lo":2,"hi":12,"st":2,"sh":1,"t":["m"],"w":"Teatr Baj","about":"Старейший кукольный театр для детей в Польше, расположенный в великолепно отреставрированном историческом здании на Праге.","why":"Театр полностью ориентирован на маленьких зрителей. Здесь ставят невероятные интерактивные спектакли (включая постановки для самых маленьких «нано-спектакли» от 0 до 3 лет). Дети сидят на мягких подушках близко к сцене, становятся полноценными участниками сказки, а после шоу могут потрогать театральных кукол.","ageT":"От 2 до 12 лет.","stT":"Да. Здание полностью перестроено под стандарты безбарьерной среды, есть лифты и пандусы.","infra":"🚻 Оборудованные детские санузлы | 🌳 Климат-контроль | ☕ Уютный детский буфет","hrs":"Строго по расписанию детских спектаклей и семейных воркшопов на сайте театра.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLeO2wZywLBGfCHJbOU5BFlrMH2YNAmSjO_K-NjXz1a45S2mYQnx6bgqwiQoTUuKzYemRC0jjIm85p530kPQz8TsBIK2ghnOVMev9juR0DnrUza-bC8Do8Q2g5K6vykfIlHauocG=w800-h450-k-no","fx":1,"pid":"ChIJG2K51UbMHkcRm61-8nbcog8","pay":"p","L":{"pl":{"n":"Teatr Baj","ab":"Najstarszy w Polsce teatr lalek dla dzieci w pięknie odnowionym zabytkowym budynku na Pradze.","wh":"Teatr w całości jest nastawiony na małych widzów. Wystawia się tu niezwykłe interaktywne spektakle (w tym „nano-spektakle” dla najmłodszych, od 0 do 3 lat). Dzieci siedzą na miękkich poduszkach blisko sceny, stają się pełnoprawnymi uczestnikami bajki, a po przedstawieniu mogą dotknąć teatralnych lalek.","ag":"2–12 lat.","st":"Tak. Budynek został w pełni przebudowany do standardów środowiska bez barier, są windy i podjazdy.","in":"🚻 Wyposażone toalety dziecięce | 🌳 Klimatyzacja | ☕ Przytulny bufet dla dzieci","hr":"Ściśle według repertuaru spektakli dla dzieci i rodzinnych warsztatów na stronie teatru."},"en":{"n":"Baj Puppet Theatre","ab":"Poland's oldest children's puppet theatre, in a beautifully restored historic building in Praga.","wh":"The theatre is entirely focused on young audiences. It stages remarkable interactive performances (including “nano-shows” for the youngest, ages 0–3). Children sit on soft cushions close to the stage, become full participants in the fairy tale and can touch the theatre puppets after the show.","ag":"2–12 years.","st":"Yes. The building was fully rebuilt to barrier-free standards, with lifts and ramps.","in":"🚻 Equipped children's toilets | 🌳 Climate control | ☕ Cosy children's buffet","hr":"Strictly by the schedule of children's performances and family workshops on the theatre's website."}}},{"id":68,"n":"Парк Камёнковские луга","pl":"Kamionkowskie Błonia Elekcyjne","d":"P","lat":52.2434818,"lng":21.0653597,"a":"Stanisława Augusta","lo":0,"hi":16,"st":2,"sh":0,"t":["p"],"w":"Kamionkowskie Błonia Elekcyjne","about":"Огромный, открытый пейзажный парк с бескрайними зелеными лужайками, примыкающий к озеру Камёнковское и парку Скарышевскому.","why":"Излюбленное тайное место местных жителей для активного отдыха без толп туристов. Здесь идеально запускать воздушных змеев, играть в фрисби, футбол или устраивать большие семейные пикники на пледах.","ageT":"Для любого возраста (0+).","stT":"Да. Плотные грунтовые и асфальтированные дорожки вдоль широких лужаек.","infra":"🚻 Биотуалеты | 🌳 Огромные открытые поляны | ☕ Рядом фабричные кондитерские","hrs":"15:00 – 18:00 весной и летом. Отличное время для отдыха на траве.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLelaFMvytgzZmTObf9yuWfslrDB2fHKSyw2H6_9g_csp95HmUYe3frMzehs2YDskkTEys2hAS3DdPg3SX4zAaW_L6AzkdENyRVp54G5I1goN2gRaIMU08LrFqrN6tZP7pE1hfxUsyllztNy=w800-h450-k-no","fx":1,"pid":"ChIJNRRaPLHNHkcRdCIr2NKLh14","pay":"f","L":{"pl":{"n":"Kamionkowskie Błonia Elekcyjne","ab":"Ogromny otwarty park krajobrazowy z bezkresnymi zielonymi łąkami, przylegający do Jeziorka Kamionkowskiego i Parku Skaryszewskiego.","wh":"Ulubione tajne miejsce mieszkańców na aktywny wypoczynek bez tłumów turystów. Idealnie puszczać tu latawce, grać we frisbee, piłkę nożną albo urządzać duże rodzinne pikniki na kocach.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Utwardzone gruntowe i asfaltowe ścieżki wzdłuż szerokich łąk.","in":"🚻 Toalety przenośne | 🌳 Ogromne otwarte polany | ☕ W pobliżu rzemieślnicze cukiernie","hr":"15:00–18:00 wiosną i latem. Świetny czas na odpoczynek na trawie."},"en":{"n":"Kamionek Election Meadows","ab":"A huge open landscape park with endless green meadows, adjoining Lake Kamionkowskie and Skaryszewski Park.","wh":"A favourite secret spot of locals for active leisure without tourist crowds. Ideal for flying kites, playing frisbee or football, or holding big family picnics on blankets.","ag":"Any age (0+).","st":"Yes. Firm dirt and asphalt paths along wide meadows.","in":"🚻 Portable toilets | 🌳 Huge open glades | ☕ Artisan pastry shops nearby","hr":"15:00–18:00 in spring and summer. A great time to relax on the grass."}}},{"id":69,"n":"Детский центр «Остановка Творчество»","pl":"Przystanek Twórczość","d":"L","lat":52.273291,"lng":20.952644,"a":"Włodzimierza Perzyńskiego 14","lo":1,"hi":7,"st":2,"sh":1,"t":["a"],"w":"","about":"Уютный, камерный развивающий центр детского творчества и раннего всестороннего развития.","why":"Главный хит центра — специализированные занятия по сенсопластике (sensoplastyka) и «грязным играм». Дети могут свободно рисовать пальцами и ладошками, лепить из безопасной глины, возиться с крупами и цветным тестом. Это идеальное пространство для развития мелкой моторики и творческой свободы, где ребенку разрешено пачкаться и баловаться.","ageT":"От 1 года до 7 лет.","stT":"Да. Вход оборудован пологим съездом, внутри есть место для парковки коляски.","infra":"🚻 Оборудован для малышей | 🌳 В помещении | ☕ Чайная зона для родителей","hrs":"10:00 – 12:30. Самое спокойное утреннее время для творческих игр.","note":"","imgO":"https://www.tworczosc.org.pl/Photos/Image?fileName=a05f454083e84a759f03ad3897e2236a.jpg","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLecOb8Ock8AP9PrPYGXOhpmRIBFVY-ipgH2wy9xIjzqpi9R8DsWMBlbklPoHkcxGlexC6CmwA3SOfTBPyzF7vc8awUe2jp-CVpKcuxbDQjLjVRTtRCJ4rrnUAQCV2kiqNeW1HQb56mNHA=w800-h450-k-no","fx":1,"pid":"ChIJc8e0mb7LHkcRlt-aCCFHwBs","pay":"p","L":{"pl":{"n":"Przystanek Twórczość","ab":"Przytulne, kameralne centrum rozwoju kreatywności dziecięcej i wszechstronnego wczesnego rozwoju.","wh":"Głównym hitem centrum są specjalistyczne zajęcia sensoplastyki i „brudne zabawy”. Dzieci mogą swobodnie malować palcami i dłońmi, lepić z bezpiecznej gliny, bawić się kaszami i kolorowym ciastem. To idealna przestrzeń do rozwijania motoryki małej i twórczej swobody, w której dziecku wolno się brudzić i dokazywać.","ag":"Od 1 roku do 7 lat.","st":"Tak. Wejście z łagodnym zjazdem, w środku jest miejsce na parkowanie wózka.","in":"🚻 Dostosowane dla maluchów | 🌳 W budynku | ☕ Strefa herbaty dla rodziców","hr":"10:00–12:30. Najspokojniejszy poranny czas na zabawy twórcze."},"en":{"n":"Creativity Stop Children's Centre","ab":"A cosy, intimate centre for children's creativity and comprehensive early development.","wh":"The centre's main hit is specialised sensory-art classes (sensoplastyka) and “messy play”. Children can paint freely with fingers and palms, model safe clay and play with cereals and coloured dough. It is an ideal space for developing fine motor skills and creative freedom, where a child is allowed to get dirty and play around.","ag":"From 1 year to 7 years.","st":"Yes. The entrance has a gentle ramp and there is space to park a stroller inside.","in":"🚻 Equipped for toddlers | 🌳 Indoors | ☕ Tea zone for parents","hr":"10:00–12:30. The calmest morning time for creative play."}}},{"id":70,"n":"Форт Збарж и озеро","pl":"Fort Zbarż i staw","d":"K","lat":52.1707688,"lng":20.9828913,"a":"Wirażowa","lo":10,"hi":12,"st":0,"sh":1,"t":["v","p"],"w":"","about":"Дикие, заброшенные руины оборонительного форта XIX века, окруженные густыми зарослями и глубоким озером прямо у забора аэропорта Шопена.","why":"Настоящее секретное приключение строго для старших школьников и подростков. Сюда стоит идти ради исследования старинных кирпичных казематов (с фонариками) и плейнспоттинга — место находится прямо под глиссадой взлетно-посадочной полосы, и гигантские пассажирские лайнеры пролетают прямо над головой невероятно низко и громко, вызывая дикий восторг.","ageT":"Строго от 10-12 лет и подростки. Для маленьких детей место небезопасно.","stT":"Нет. Дикие руины, заросли, протоптанные крутые тропинки и холмы.","infra":"🚻 Нет (дикая зона) | 🌳 Плотная тень деревьев | ☕ Нет, берите термосы и перекус с собой","hrs":"12:00 – 15:00. Приходить строго в сухую солнечную погоду и в надежной походной обуви!","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcs5AQFnqN7V5tmRSZBm3Ey1h-PsP2ZRmMgHdbT65AvQz_aBkWQj0TDLaUIw2cRIp4pBVunUqg41Lm2TnBUgZHbV-aY0YTmHIQHHOjnqAx5V6oXHTOmtoca4f7LSIbv0pso9X17Vg=w800-h450-k-no","fx":1,"pid":"ChIJ39FPfhkzGUcRzucT-iG7KG4","pay":"f","L":{"pl":{"n":"Fort Zbarż i staw","ab":"Dzikie, opuszczone ruiny dziewiętnastowiecznego fortu obronnego, otoczone gęstymi zaroślami i głębokim jeziorem tuż przy ogrodzeniu lotniska Chopina.","wh":"Prawdziwa tajna przygoda wyłącznie dla starszych uczniów i nastolatków. Warto tu przyjść, by zbadać dawne ceglane kazamaty (z latarkami) i na plane spotting — miejsce leży wprost pod ścieżką podejścia do pasa startowego, a gigantyczne samoloty pasażerskie przelatują nad głową niewiarygodnie nisko i głośno, wywołując dziki zachwyt.","ag":"Ściśle od 10–12 lat i nastolatki. Dla małych dzieci miejsce jest niebezpieczne.","st":"Nie. Dzikie ruiny, zarośla, wydeptane strome ścieżki i wzgórza.","in":"🚻 Brak (dzika strefa) | 🌳 Gęsty cień drzew | ☕ Brak, zabierz termosy i przekąski","hr":"12:00–15:00. Przychodź ściśle w suchą słoneczną pogodę i w solidnym obuwiu turystycznym!"},"en":{"n":"Zbarż Fort and Pond","ab":"Wild, abandoned ruins of a 19th-century defensive fort, surrounded by dense thickets and a deep lake right by the Chopin Airport fence.","wh":"A real secret adventure strictly for older schoolchildren and teenagers. Come to explore the old brick casemates (with torches) and for plane spotting — the place lies right under the runway approach path, and giant passenger jets fly overhead incredibly low and loud, causing wild excitement.","ag":"Strictly from 10–12 years and teenagers. The place is unsafe for small children.","st":"No. Wild ruins, thickets, trodden steep paths and hills.","in":"🚻 None (wild area) | 🌳 Dense tree shade | ☕ None, bring thermoses and snacks","hr":"12:00–15:00. Come strictly in dry, sunny weather and in sturdy hiking footwear!"}}},{"id":71,"n":"Детская зона библиотеки на Кошиковой","pl":"Strefa dziecięca Biblioteki na Koszykowej","d":"C","lat":52.2223717,"lng":21.018613,"a":"Koszykowa 26/28","lo":2,"hi":12,"st":2,"sh":1,"t":["m"],"w":"","about":"Секретный, ультрасовременный и бесплатный детский читальный зал внутри главной публичной библиотеки Мазовии.","why":"Идеальное тихое место, чтобы передохнуть во время прогулки по центру или спрятаться от непогоды. Для детей здесь создано потрясающее пространство: мягкие пуфы-подушки, домики для уединенного чтения, огромный выбор настольных развивающих игр и богатейшая коллекция детских книг на разных языках (включая польский, украинский и английский).","ageT":"2–12 лет.","stT":"Да. Библиотека оборудована по самым современным стандартам доступности (лифты, пологие съезды).","infra":"🚻 Чистые санузлы | 🌳 Климат-контроль | ☕ Кофейня в холле здания","hrs":"15:00 – 17:30 в будни. Идеальное время для спокойного отдыха.","note":"","imgO":"","pid":"ChIJ0RKReO_MHkcRS8RRrJoWBcg","fx":1,"imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfp8qU3Y-Xxz8ZhsCURqPOf_ZFKhL2DPLTM-5T1ww696a-yWziy4aEtUvwfTB3elhAWMRc0Ed_vUUezxlcqXAyn41AJaq2ARv_WmVUFWdzmq2KY4JTw5hRKSEwK4QXv2L3e6uU2=w800-h450-k-no","pay":"f","L":{"pl":{"n":"Strefa dziecięca Biblioteki na Koszykowej","ab":"Tajna, ultranowoczesna i bezpłatna dziecięca czytelnia w głównej publicznej bibliotece Mazowsza.","wh":"Idealne ciche miejsce, by odpocząć podczas spaceru po centrum lub schować się przed niepogodą. Dla dzieci stworzono tu wspaniałą przestrzeń: miękkie pufy-poduszki, domki do samotnego czytania, ogromny wybór rozwijających gier planszowych i bogata kolekcja książek dla dzieci w różnych językach (w tym po polsku, ukraińsku i angielsku).","ag":"2–12 lat.","st":"Tak. Biblioteka jest wyposażona według najnowocześniejszych standardów dostępności (windy, łagodne zjazdy).","in":"🚻 Czyste toalety | 🌳 Klimatyzacja | ☕ Kawiarnia w holu budynku","hr":"15:00–17:30 w dni powszednie. Idealny czas na spokojny odpoczynek."},"en":{"n":"Koszykowa Library Children's Area","ab":"A secret, ultra-modern and free children's reading room inside Mazovia's main public library.","wh":"An ideal quiet place to rest during a walk through the centre or shelter from bad weather. A wonderful space was created for children: soft pouf-cushions, nooks for secluded reading, a huge choice of educational board games and a rich collection of children's books in different languages (including Polish, Ukrainian and English).","ag":"2–12 years.","st":"Yes. The library is equipped to the most modern accessibility standards (lifts, gentle ramps).","in":"🚻 Clean restrooms | 🌳 Climate control | ☕ Cafe in the building lobby","hr":"15:00–17:30 on weekdays. The ideal time for calm relaxation."}}},{"id":72,"n":"Парк «Глиняные карьеры Шнайдера»","pl":"Park Glinianki Sznajdra","d":"B","lat":52.2178654,"lng":20.9116025,"a":"Połczyńska","lo":2,"hi":12,"st":2,"sh":1,"t":["p"],"w":"","about":"Живописный ландшафтный парк на Бемово, разбитый вокруг старинных затопленных карьеров, соединенных красивыми деревянными пирсами и смотровыми мостиками.","why":"Главная фишка — обилие водной фауны. В чистой воде карьеров живут гигантские карпы и амуры, которые подплывают прямо к деревянным настилам в ожидании корма, а вокруг плавают дикие утки и лебеди. На берегу также обустроена классная холмистая игровая зона с канатной тарзанкой и лазилками.","ageT":"От 2 лет (смотреть рыбку) до 12 лет (кататься на тарзанке).","stT":"Да. К пирсам и смоторовым площадкам ведут ровные широкие дорожки.","infra":"🚻 Модульный туалет | 🌳 Уютная тень у воды | ☕ Киоски с перекусом по выходным","hrs":"10:00 – 13:00. Утром у пирсов тишина, и рыба подплывает максимально близко к берегу.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfAzQVlAKJpUjBJ4aO6Hm0cYPz35tQBm9V_rlfUhkrqLTlOYgdvTDUSA1icBWJTxqTWXSgEWGE-SpF0pF9K4O9qHrChWz86PCLTyAPUj2yrv8BQcXHuy8x0RY4akoyAIPqNar_y=w800-h450-k-no","fx":1,"pid":"ChIJtTM1-zHLHkcRss0yY2IE_84","pay":"f","L":{"pl":{"n":"Park Glinianki Sznajdra","ab":"Malowniczy park krajobrazowy na Bemowie, rozłożony wokół dawnych zalanych glinianek połączonych pięknymi drewnianymi pomostami i mostkami widokowymi.","wh":"Główną atrakcją jest bogactwo fauny wodnej. W czystej wodzie glinianek żyją gigantyczne karpie i amury, które podpływają wprost do drewnianych pomostów w oczekiwaniu na karmę, a dookoła pływają dzikie kaczki i łabędzie. Na brzegu urządzono też fajną pagórkowatą strefę zabaw z liną-tarzanką i miejscami do wspinaczki.","ag":"Od 2 lat (oglądanie rybek) do 12 lat (huśtanie na tarzance).","st":"Tak. Do pomostów i placów zabaw prowadzą równe szerokie alejki.","in":"🚻 Moduł toaletowy | 🌳 Przytulny cień nad wodą | ☕ Kioski z przekąskami w weekendy","hr":"10:00–13:00. Rano przy pomostach panuje cisza, a ryby podpływają maksymalnie blisko brzegu."},"en":{"n":"Sznajder Clay Pits Park","ab":"A picturesque landscape park in Bemowo, laid out around old flooded clay pits linked by beautiful wooden piers and viewing bridges.","wh":"The main draw is the abundance of aquatic wildlife. In the clear water of the pits live giant carp and grass carp that swim right up to the wooden boardwalks waiting for food, while wild ducks and swans paddle around. On the shore there is also a cool hilly play zone with a rope zip-swing and climbing frames.","ag":"From 2 years (watching the fish) to 12 years (riding the zip-swing).","st":"Yes. Smooth wide paths lead to the piers and playgrounds.","in":"🚻 Toilet module | 🌳 Cosy shade by the water | ☕ Snack kiosks at weekends","hr":"10:00–13:00. In the morning it is quiet by the piers and the fish come as close to the shore as possible."}}},{"id":73,"n":"Эко-сад на Яздове","pl":"Ogród społeczny Motyka i Słońce","d":"C","lat":52.2211586,"lng":21.0281675,"a":"Jazdów 3/5","lo":3,"hi":11,"st":1,"sh":1,"t":["p"],"w":"","about":"Уникальный зеленый островок деревянных финских домиков и общего городского огорода прямо в самом центре мегаполиса, позади Уяздовского парка.","why":"Место знакомит детей с городской экологией. Здесь можно трогать и нюхать пряные травы на грядках, изучать устройство инсект-отелей (домиков для полезных насекомых), лепить из натуральной глины. По субботам здесь часто устраивают семейные мастер-классы, пекут хлеб в глиняной печи и угощают чаем из трав.","ageT":"3–11 лет.","stT":"Ограниченно. Дорожки между деревянными домиками травяные и грунтовые, проехать можно, но после затяжных дождей бывает грязно.","infra":"🚻 Эко-туалеты | 🌳 Прекрасная тень фруктовых деревьев | ☕ Чай и домашняя выпечка за добровольные донаты","hrs":"12:00 – 16:00 по субботам, во время проведения открытых семейных встреч.","note":"","imgO":"","pid":"ChIJ1QT8b-PMHkcRX7bWfm_pDS8","fx":1,"imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdBVuM1ebnUFLz_UKPc6NyzIyvBJ_dxT64G3mXejyppVP6OEixRDVqe9NcaiWWUPEjfqXGLa_kZbynDzQyUQilJFogJVYsBOGpJMDHukDf0Eulzy9sVU6TqJeC3T28GyK3eOibE8JheJlf2=w800-h450-k-no","pay":"f","L":{"pl":{"n":"Ogród społeczny Motyka i Słońce","ab":"Wyjątkowa zielona wysepka fińskich drewnianych domków i wspólnego miejskiego ogrodu w samym centrum metropolii, za Parkiem Ujazdowskim.","wh":"Miejsce zapoznaje dzieci z miejską ekologią. Można tu dotykać i wąchać pachnące zioła na grządkach, poznawać budowę hoteli dla owadów (domków dla pożytecznych owadów), lepić z naturalnej gliny. W soboty często odbywają się rodzinne warsztaty, piecze się chleb w glinianym piecu i częstuje herbatą ziołową.","ag":"3–11 lat.","st":"Ograniczona. Ścieżki między drewnianymi domkami są trawiaste i gruntowe, da się przejechać, ale po długotrwałych deszczach bywa błotniście.","in":"🚻 Toalety ekologiczne | 🌳 Wspaniały cień drzew owocowych | ☕ Herbata i domowe wypieki za dobrowolne datki","hr":"12:00–16:00 w soboty, podczas otwartych spotkań rodzinnych."},"en":{"n":"Jazdów Community Garden","ab":"A unique green islet of Finnish wooden houses and a shared city vegetable garden in the very centre of the metropolis, behind Ujazdów Park.","wh":"The place introduces children to urban ecology. You can touch and smell fragrant herbs in the beds, study how insect hotels (houses for beneficial insects) work and model natural clay. On Saturdays family workshops are often held, bread is baked in a clay oven and herbal tea is served.","ag":"3–11 years.","st":"Limited. Paths between the wooden houses are grass and dirt; you can get through, but it gets muddy after prolonged rain.","in":"🚻 Eco toilets | 🌳 Wonderful fruit-tree shade | ☕ Tea and home baking for voluntary donations","hr":"12:00–16:00 on Saturdays, during open family meetings."}}},{"id":74,"n":"Парк Аркадия у дворца Круликарня","pl":"Park Arkadia przy Królikarni","d":"M","lat":52.1911,"lng":21.0264,"a":"ul. Puławska (парк у дворца Królikarnia)","lo":0,"hi":12,"st":2,"sh":1,"t":["p","g"],"w":"","about":"Парк с каскадом прудов и ухоженными аллеями у подножия дворца Круликарня.","why":"Детская площадка, пруды с утками, просторные лужайки для игр и пикника.","ageT":"От 0 до 12 лет: малышам утки и трава, детям постарше велосипеды и самокаты.","stT":"Да, внизу ровные широкие дорожки. Подъём к дворцу крутой.","infra":"🚻 Платный автотуалет у ул. Idzikowskiego | 🌳 Густая тень | ☕ Кафе во дворце Круликарня","hrs":"Круглосуточно. Спокойнее в будни днём или ближе к закату, в воскресенье после обеда многолюдно.","pid":"ChIJT8BMaC3NHkcRad8f6ewC6ug","fx":1,"imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLd3-dx5zSXUZQSQNd6X8e0LwgU8xaDVO_8NaOR4PziVCa4s3kMvVcyj3wc1aVJdoYKum5_n9hHJT4z5WufBGx3FijGc5F5wRZjn15tEiOExJptTQeSd56djcSKB6saquxiU5Ylyaw=s1330-w784-h1330-rw","pay":"f","L":{"pl":{"n":"Park Arkadia przy Królikarni","ab":"Park z kaskadą stawów i zadbanymi alejami u stóp pałacu Królikarnia.","wh":"Plac zabaw, stawy z kaczkami, przestronne trawniki do zabaw i pikników.","ag":"Od 0 do 12 lat: maluchom kaczki i trawa, starszym dzieciom rowery i hulajnogi.","st":"Tak, na dole równe szerokie alejki. Podejście do pałacu jest strome.","in":"🚻 Płatna toaleta automatyczna przy ul. Idzikowskiego | 🌳 Gęsty cień | ☕ Kawiarnia w pałacu Królikarnia","hr":"Całą dobę. Spokojniej w dni powszednie w ciągu dnia lub bliżej zachodu słońca, w niedzielę po obiedzie tłoczno.","ad":"ul. Puławska (park przy pałacu Królikarnia)"},"en":{"n":"Arkadia Park by Królikarnia Palace","ab":"A park with a cascade of ponds and well-kept avenues at the foot of Królikarnia Palace.","wh":"A playground, ponds with ducks, spacious lawns for games and picnics.","ag":"From 0 to 12 years: ducks and grass for toddlers, bikes and scooters for older kids.","st":"Yes, flat wide paths at the bottom. The climb up to the palace is steep.","in":"🚻 Paid automatic toilet by Idzikowskiego Street | 🌳 Dense shade | ☕ Cafe in Królikarnia Palace","hr":"Open 24 hours. Calmer on weekday daytimes or near sunset; busy on Sunday after lunch.","ad":"ul. Puławska (park by Królikarnia Palace)"}}}].map(o=>({...o,img:o.imgO||o.imgG||null,ex:"",ok:0}));

const IMAP=['science','dome','dollhouse','illusion','gravity','oldfountain','palace','bridge','rex','tower','riverside','roofgarden','castle','meadow','tank','kidslab','railway','pinball','pixelfloor','citymodel','trampoline','waterpark','lakefountains','greenhouse','vr','softplay','indoorpool','formal','cinema','skatepark','gym','pondpark','lakepalace','boulder','icerink','zoo','formal','brickmuseum','neon','pondpark','jungle','beach','wintertown','ropepark','factory','baroque','lanterns','greenhouse','forestpark','ropepark','craft','hillkite','indoorpool','space','carnival','farm','airo','arcade','quarry','amphi','dinoplay','mound','splash','futuristic','forestplay','icecream','wildbeach','puppet','meadow','craft','ruins','library','quarry','eco','lakepalace'];

const ill=l=>{const k=IMAP[l.id]||'meadow',n=IMAP.slice(0,l.id).filter(x=>x===k).length;U=0;
 const st=['','transform:scaleX(-1)','filter:hue-rotate(60deg)','transform:scaleX(-1);filter:hue-rotate(120deg)'][Math.min(n,3)];
 return `<svg viewBox="0 0 600 340" preserveAspectRatio="xMidYMid slice" style="${st}">${S[k]()}</svg>`};
const mk=new Map();
R.forEach(l=>{const m=L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',html:`<div class="pin">${T[l.t[0]][0]}</div>`,iconSize:[30,30]})}).on('click',()=>show(l));mk.set(l.id,m)});
function ok(l){const a=F.age;return(!F.d.size||F.d.has(l.d))&&(!F.t.size||l.t.some(x=>F.t.has(x)))&&(!a||(l.lo<=a[2]&&l.hi>=a[1]))&&(!F.sh||l.sh)&&(!F.st||l.st===2)&&(!F.pay||(F.pay==='f'?l.pay!=='p':l.pay!=='f'))}
function badges(l){const PB={f:t('free'),p:t('paid'),m:t('part')};return`<span class="b">${PB[l.pay]}</span><span class="b">👶 ${l.lo}–${l.hi}${l.hi>=16?'+':''} ${t('yrs')}</span><span class="b">${ico(t('stB')[l.st])}</span><span class="b">${l.sh?t('shB'):t('noshB')}</span>`+l.t.map(x=>`<span class="b">${T[x][0]} ${tn(x)}</span>`).join('')}
function apply(){const v=R.filter(ok);
 R.forEach(l=>{const m=mk.get(l.id);ok(l)?m.addTo(map):m.remove()});
 $('#cnt').textContent=t('found')(v.length,R.length);
 $('#list').innerHTML=v.map(l=>`<div class="it" data-i="${l.id}"><h3>${T[l.t[0]][0]} ${tx(l,'n')}</h3><small>${LANG==='pl'?'':l.pl+' · '}${dn(l.d)}</small><div class="bd">${badges(l)}</div></div>`).join('')||`<p>${t('empty')}</p>`;
 document.querySelectorAll('.it').forEach(e=>e.onclick=()=>show(R[e.dataset.i]))}
function chips(title,items,on,tog){const g=document.createElement('div');g.className='fg';g.innerHTML=`<b>${title}</b>`;
 const sync=()=>g.querySelectorAll('.ch').forEach(c=>c.classList.toggle('on',!!on(c.dataset.k)));
 items.forEach(([k,lab])=>{const c=document.createElement('span');c.className='ch';c.dataset.k=k;c.innerHTML=ico(lab);c.onclick=()=>{tog(k);sync();apply()};g.appendChild(c)});sync();return g}
const fp=$('#fp');
function buildFilters(){fp.innerHTML='';
 fp.append(chips(t('fRegion'),Object.keys(I18N.ru.D).map(k=>[k,dn(k)]),k=>F.d.has(k),k=>F.d.has(k)?F.d.delete(k):F.d.add(k)),
 chips(t('fAge'),AG.map(a=>[a[0],a[0]+t('ageSfx')]),k=>F.age&&F.age[0]===k,k=>{const a=AG.find(x=>x[0]===k);F.age=F.age===a?null:a}),
 chips(t('fPrice'),[['f',t('free')],['p',t('paid')]],k=>F.pay===k,k=>{F.pay=F.pay===k?null:k}),
 chips(t('fCond'),[['sh',t('shade')],['st',t('strl')]],k=>F[k],k=>F[k]=!F[k]),
 chips(t('fType'),Object.keys(T).map(k=>[k,T[k][0]+' '+tn(k)]),k=>F.t.has(k),k=>F.t.has(k)?F.t.delete(k):F.t.add(k)));
 const rs=document.createElement('span');rs.className='ch';rs.textContent=t('reset');rs.onclick=()=>{F.d.clear();F.t.clear();F.age=null;F.pay=null;F.sh=F.st=false;buildFilters();apply()};fp.append(rs)}
$('#fb').onclick=()=>fp.classList.toggle('open');
function view(m){$('#map').style.display=m?'block':'none';$('#list').style.display=m?'none':'grid';$('#tm').classList.toggle('on',m);$('#tl').classList.toggle('on',!m);if(m)setTimeout(()=>map.invalidateSize(),50)}

function setLang(lg){LANG=lg;try{localStorage.setItem('wk_lang',lg)}catch(e){}

 $('h1').textContent=t('title');$('#tm').textContent=t('map');$('#tl').textContent=t('list');$('#fb').textContent=t('filters');
 document.querySelectorAll('.lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lg));
 buildFilters();apply();const s=$('#sh');if(s.classList.contains('open'))show(R[s.dataset.i])}
document.querySelectorAll('.lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
// Wikipedia (MediaWiki API): фото, координаты и вводный абзац. Сначала fetch, затем JSONP как запасной путь.
function wq(t){return`https://pl.wikipedia.org/w/api.php?action=query&format=json&redirects=1&titles=${encodeURIComponent(t)}&prop=pageimages|extracts&pithumbsize=700&exintro=1&explaintext=1&exchars=260`}
function jsonp(u){return new Promise((res,rej)=>{const cb='wp'+Math.random().toString(36).slice(2),s=document.createElement('script');const t=setTimeout(()=>{s.remove();rej()},8000);window[cb]=d=>{clearTimeout(t);s.remove();delete window[cb];res(d)};s.onerror=()=>{clearTimeout(t);rej()};s.src=u+'&callback='+cb;document.head.appendChild(s)})}
async function wiki(l){if(!l.w||l.ok||l.imgO||l.imgG)return;let j;
 try{j=await (await fetch(wq(l.w)+'&origin=*')).json()}catch(e){try{j=await jsonp(wq(l.w))}catch(e2){l.ok=-1;return}}
 const p=Object.values((j.query||{}).pages||{})[0];if(!p||p.missing!==undefined){l.ok=-1;return}
 l.ok=1;l.img=(p.thumbnail||{}).source||null;l.ex=p.extract||'';
}
const ph=l=>{const p=$('#ph');if($('#sh').dataset.i!=l.id)return;
 if(l.img){p.innerHTML='<i>'+t('photo')+(l.imgL||(l.imgO?t('phO'):l.imgG?t('phG'):'Wikipedia / Wikimedia Commons'))+'</i>';p.style.backgroundImage=`url(${l.img})`}
 else{p.style.backgroundImage='';p.innerHTML=ill(l)+'<i>'+t('illus')+'</i>'}};
function show(l){const s=$('#sh');s.dataset.i=l.id;
 const q=encodeURIComponent(l.pl+', '+l.a.replace(/\s*\(.*\)\s*$/,'')+', Warszawa');
 $('#ph').style.backgroundImage='';$('#ph').innerHTML=l.img?T[l.t[0]][0]:ill(l)+'<i>'+t('illus')+'</i>';
 $('#bd').innerHTML=`<h2>${tx(l,'n')}</h2>${LANG==='pl'?'':'<small>'+l.pl+'</small>'}<div>📍 ${adr(l)} · ${dn(l.d)}</div><div class="bd">${badges(l)}</div>
 <p>${tx(l,'ab')}</p><div class="why"><b>${t('why')}</b> ${tx(l,'wh')}</div>
 <div class="nt2">👶 <b>${t('age')}</b> ${tx(l,'ag')}<br>${ico('♿')} <b>${t('stl')}</b> ${tx(l,'st')}<br>🧺 <b>${t('infra')}</b> ${tx(l,'in')}<br>🕐 <b>${t('best')}</b> ${tx(l,'hr')||'—'}</div>
 <div class="bt"><a class="pr" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q}${l.pid?'&destination_place_id='+l.pid:''}">${t('route')}</a><button id="go">${t('onmap')}</button></div>`;
 $('#go').onclick=()=>{view(true);map.flyTo([l.lat,l.lng],16)};
 s.classList.add('open');ph(l);
 wiki(l).then(()=>{ph(l);})}
$('#x').onclick=()=>$('#sh').classList.remove('open');
map.on('click',()=>$('#sh').classList.remove('open'));
setLang(LANG);
R.forEach(wiki);
// Уточнение координат по OpenStreetMap (Nominatim): исходные координаты могут быть сдвинуты.
const GK='wk_geo_v2';let GC={};try{GC=JSON.parse(localStorage.getItem(GK)||'{}')}catch(e){}
const dist=(a,b,c2,d)=>{const t=x=>x*Math.PI/180,k=6371000,x=t(c2-a),y=t(d-b);return 2*k*Math.asin(Math.sqrt(Math.sin(x/2)**2+Math.cos(t(a))*Math.cos(t(c2))*Math.sin(y/2)**2))};
const setPos=(l,la,ln)=>{l.lat=la;l.lng=ln;mk.get(l.id).setLatLng([la,ln])};
R.forEach(l=>{if(GC[l.id]&&!l.fx)setPos(l,GC[l.id][0],GC[l.id][1])});
async function geoOne(l){const a=l.a.replace(/\(.*?\)/g,'').replace(/,?\s*\+\d+/,'').trim();
 const qs=/\d/.test(a)?[a+', Warszawa',l.pl+', Warszawa']:[l.pl+', Warszawa',a+', Warszawa'];
 for(const q of qs){try{const j=await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=pl&viewbox=20.8,52.4,21.3,52.05&bounded=1&q='+encodeURIComponent(q))).json();
  if(j[0]){const la=+j[0].lat,ln=+j[0].lon;if(dist(la,ln,l.lat,l.lng)<3500){setPos(l,la,ln);GC[l.id]=[la,ln];try{localStorage.setItem(GK,JSON.stringify(GC))}catch(e){}return}}}catch(e){return}
  await new Promise(r=>setTimeout(r,1100))}}
(async()=>{for(const l of R){if(GC[l.id]||l.fx)continue;await geoOne(l);await new Promise(r=>setTimeout(r,1100))}})();
