:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2a37;--mu:#6b7280;--ac:#e4572e;--ln:#e5e1d8}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t b" "f l";align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--ln)}h1{grid-area:t;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lg{grid-area:l;justify-self:end}.tabs{grid-area:b}#fb{grid-area:f;justify-self:start;width:96px;text-align:center}.tabs button{width:64px;padding:6px 0;text-align:center}
h1{font-size:15px;line-height:1.2;margin:0;min-width:0}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:2px}
.tabs button,.fb{border:0;background:none;color:var(--tx);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.tabs .on{background:var(--ac);color:#fff}
.fb{border:1px solid var(--ln)}.ic{height:1.2em;width:1.2em;vertical-align:-.25em;border-radius:3px}.lg{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:2px}.lg button{border:0;background:none;color:var(--tx);padding:5px 6px;border-radius:8px;font:600 12px system-ui;cursor:pointer}.lg .on{background:var(--ac);color:#fff}
#fp{display:none;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--ln);max-height:45vh;overflow:auto}
#fp.open{display:block}
.fg{margin-bottom:6px}.fg b{font-size:11px;color:var(--mu);text-transform:uppercase;display:block;margin-bottom:3px}
.ch{display:inline-block;border:1px solid var(--ln);border-radius:14px;padding:3px 10px;margin:0 4px 4px 0;cursor:pointer;font-size:13px;user-select:none}
.ch.on{background:var(--ac);border-color:var(--ac);color:#fff}
#cnt{font-size:12px;color:var(--mu);padding:4px 12px}
main{flex:1;position:relative;min-height:0}
#map,#list{position:absolute;inset:0}
#list{overflow:auto;padding:8px 12px;display:none;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;align-content:start}
.it{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;cursor:pointer}
.it h3{margin:0;font-size:14px}.it small{color:var(--mu)}
.bd{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.b{font-size:12px;background:var(--bg);border-radius:8px;padding:2px 7px}
.pin{font-size:20px;text-align:center;line-height:30px;width:30px;height:30px;background:#fff;border:2px solid var(--ac);border-radius:50%;box-shadow:0 1px 4px #0005}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px #0004;transform:translateY(105%);transition:transform .25s;z-index:1000;max-width:560px;margin:auto}
#sh.open{transform:none}
#ph{height:170px;background:linear-gradient(135deg,#f4a261,#e4572e);display:flex;align-items:center;justify-content:center;font-size:56px;background-size:cover;background-position:center;position:relative}
#ph svg{position:absolute;inset:0;width:100%;height:100%}#ph i{position:absolute;right:6px;bottom:4px;font:10px system-ui;color:#fff;background:#0007;padding:1px 5px;border-radius:6px}
#bd{padding:12px}#bd h2{margin:0;font-size:18px}
.why{margin:8px 0;padding:8px 10px;background:var(--bg);border-left:3px solid var(--ac);border-radius:6px}
.bt{display:flex;gap:8px;margin-top:10px}
.bt a,.bt button{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--ac);color:var(--ac);background:none;text-decoration:none;font:inherit;cursor:pointer}
.bt .pr{background:var(--ac);color:#fff}
#x{position:absolute;right:8px;top:8px;border:0;background:#0007;color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;z-index:2}
.nt2{font-size:13px;line-height:1.6}.nt{font-size:12px;color:var(--mu);margin-top:8px}

const R=[{"id":0,"n":"Центр науки «Коперник»","pl":"Centrum Nauki Kopernik","d":"C","lat":52.2418552,"lng":21.0287271,"a":"Wybrzeże Kościuszkowskie 20","lo":3,"hi":14,"st":2,"sh":1,"t":["m"],"w":"Centrum Nauki Kopernik","about":"Крупнейший интерактивный научный музей Польши. Здесь нет скучных экскурсоводов — все экспонаты, рычаги, оптические иллюзии и гидравлические установки можно и нужно трогать руками, запуская физические и химические процессы.","why":"Это лучшее место, чтобы влюбить ребенка в науку через игру. Для самых маленьких (до 6 лет) здесь открыта уникальная сенсорная зона «Bzzz!» с водными экспериментами и лазилками, а старшие дети могут вырабатывать электричество или строить мосты.","ageT":"3–6 лет (зона «Bzzz!»), 7–14 лет (основная экспозиция).","stT":"Да. Есть просторные лифты, широкие проходы и пологие пандусы.","infra":"🚻 Есть | 🌳 Кондиционеры | ☕ Кафе на территории","hrs":"09:00 – 13:00 (в будни меньше школьных групп) или после 16:00.","note":"","imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLch6eTA9vN-3EVviecvMqraGXBvlmyfB2enAY2PwmcpxmXIrInmfcP6MQmB-fGJwRLj68QmFS8SYIaqf7fkWpQLzi2-M-UIeY4LY6QO5BbAizmEwVIdflLatWUQqE6qQzSCygpe=s1330-w784-h1330-rw","fx":1,"pid":"ChIJ0cxQolvMHkcRYAlBuLnx1gg","pay":"p","L":{"pl":{"n":"Centrum Nauki Kopernik","ab":"Największe interaktywne muzeum nauki w Polsce. Nie ma tu nudnych przewodników — wszystkie eksponaty, dźwignie, iluzje optyczne i instalacje hydrauliczne można i trzeba dotykać, uruchamiając zjawiska fizyczne i chemiczne.","wh":"To najlepsze miejsce, by zarazić dziecko nauką przez zabawę. Dla najmłodszych (do 6 lat) działa wyjątkowa strefa sensoryczna „Bzzz!” z eksperymentami wodnymi i miejscami do wspinaczki, a starsze dzieci mogą wytwarzać prąd lub budować mosty.","ag":"3–6 lat (strefa „Bzzz!”), 7–14 lat (główna ekspozycja).","st":"Tak. Są przestronne windy, szerokie przejścia i łagodne podjazdy.","in":"🚻 Są | 🌳 Klimatyzacja | ☕ Kawiarnia na terenie","hr":"9:00–13:00 (w dni powszednie mniej grup szkolnych) lub po 16:00."},"en":{"n":"Copernicus Science Centre","ab":"Poland's largest interactive science museum. There are no boring guides here — every exhibit, lever, optical illusion and hydraulic installation can and should be touched to set physical and chemical processes in motion.","wh":"The best place to make a child fall in love with science through play. The youngest (under 6) have the unique sensory zone “Bzzz!” with water experiments and climbing areas, while older kids can generate electricity or build bridges.","ag":"3–6 years (“Bzzz!” zone), 7–14 years (main exhibition).","st":"Yes. Spacious lifts, wide aisles and gentle ramps.","in":"🚻 Yes | 🌳 Air conditioning | ☕ Cafe on site","hr":"9:00–13:00 (fewer school groups on weekdays) or after 16:00."}}},{"id":1,"n":"Планетарий «Коперник»","pl":"Planetarium Centrum Nauki Kopernik","d":"C","lat":52.2420404,"lng":21.0294246,"a":"Wybrzeże Kościuszkowskie 20","lo":4,"hi":16,"st":2,"sh":1,"t":["m"],"w":"","about":"Сверхсовременный цифровой планетарий со сферическим куполом, расположенный в отдельном футуристическом здании рядом с Центром науки.","why":"Малышей ждут специальные мультяшные полнокупольные сеансы с эффектом полного погружения, где созвездия и планеты оживают под музыку. Подростки оценят лазерные шоу и реалистичные космические путешествия к черным дырам.","ageT":"От 4 лет и старше.","stT":"Да. Доступ в холл идеальный, в самом зале коляску можно оставить на специальной «парковке» у входа.","infra":"🚻 Есть | 🌳 В помещении | ☕ Кафе в холле","hrs":"11:00 – 15:00. Подбирайте время строго под детские сеансы на сайте.","note":"","imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLeWNX67uZhRhaKhOSPJZ7xg3ZazLu3Doo8K2HIomH7B-ztVFpsAn0aGhLtP1euQACICc0AppaUqKVJUqcIAbhDOGrNI2IVL99ZQ0_Iqvilrnh2ipxJ3bmHXsd8QDdn2z_65kdV2cg=s1330-w784-h1330-rw","fx":1,"pid":"ChIJx2dvrlvMHkcR2zQyX0ZkwC8","pay":"p","L":{"pl":{"n":"Planetarium Centrum Nauki Kopernik","ab":"Supernowoczesne cyfrowe planetarium ze sferyczną kopułą, w osobnym futurystycznym budynku obok Centrum Nauki.","wh":"Maluchy czekają specjalne bajkowe seanse pełnokopułowe z efektem pełnego zanurzenia, podczas których gwiazdozbiory i planety ożywają przy muzyce. Nastolatkom spodobają się pokazy laserowe i realistyczne podróże kosmiczne do czarnych dziur.","ag":"Od 4 lat.","st":"Tak. Hol jest w pełni dostępny, a wózek można zostawić na specjalnym „parkingu” przy wejściu do sali.","in":"🚻 Są | 🌳 W budynku | ☕ Kawiarnia w holu","hr":"11:00–15:00. Dobierz godzinę dokładnie do seansów dla dzieci na stronie."},"en":{"n":"Copernicus Planetarium","ab":"An ultra-modern digital planetarium with a spherical dome, in a separate futuristic building next to the Science Centre.","wh":"Little ones get special cartoon full-dome shows with total immersion, where constellations and planets come alive to music. Teenagers will enjoy the laser shows and realistic space journeys to black holes.","ag":"From 4 years.","st":"Yes. The lobby is fully accessible, and strollers can be left in a special “parking” area at the hall entrance.","in":"🚻 Yes | 🌳 Indoors | ☕ Cafe in the lobby","hr":"11:00–15:00. Pick the time strictly to match the children's shows listed on the website."}}},{"id":2,"n":"Музей кукольных домиков, игр и игрушек","pl":"Muzeum Domków Lalek, Gier i Zabawek","d":"C","lat":52.2484158,"lng":21.0097179,"a":"Podwale 15","lo":5,"hi":16,"st":0,"sh":1,"t":["m"],"w":"","about":"Секретный и очень уютный музей в самом сердце Старого города. В витринах собрана огромная коллекция исторических миниатюрных домиков, школ, больниц и магазинов XIX–XX веков со всеми крошечными предметами интерьера.","why":"Рассматривание микроскопической посуды, каминов, старинных кукол и швейных машинок завораживает детей. Место отлично развивает воображение и показывает, как жили люди сто лет назад.","ageT":"От 5 лет (когда появляется интерес к мелким деталям).","stT":"Нет. Историческое здание подвального типа с узкими крутыми лестницами.","infra":"🚻 Есть | 🌳 В помещении | ☕ Кафе в шаговой доступности","hrs":"12:00 – 15:00. Отличный способ спрятаться от полуденного зноя или дождя в Старом городе.","note":"","imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLdkTOV82Pip9RliqECnmtXDNbBPLhXhtxKT2A_oSi8ssmuASRHG4dSsHbl0443GYY6ijAhcmx96KtMtp5pGgpck5RzNUHjOwfcB4BVZmyfsOp4VoDI57hKLosReVx8pR58F3HHBMcW3col1=s1330-w784-h1330-rw","fx":1,"pid":"ChIJG7gk7ozMHkcRMsgidKA4Hnc","pay":"p","L":{"pl":{"n":"Muzeum Domków Lalek, Gier i Zabawek","ab":"Tajemnicze i bardzo przytulne muzeum w samym sercu Starego Miasta. W gablotach zgromadzono ogromną kolekcję historycznych miniaturowych domków, szkół, szpitali i sklepów z XIX–XX wieku z maleńkimi przedmiotami wyposażenia.","wh":"Oglądanie mikroskopijnych naczyń, kominków, dawnych lalek i maszyn do szycia fascynuje dzieci. Miejsce świetnie rozwija wyobraźnię i pokazuje, jak żyli ludzie sto lat temu.","ag":"Od 5 lat (gdy pojawia się zainteresowanie drobnymi detalami).","st":"Nie. Zabytkowy budynek typu piwnicznego z wąskimi, stromymi schodami.","in":"🚻 Są | 🌳 W budynku | ☕ Kawiarnie w pobliżu","hr":"12:00–15:00. Dobry sposób na schronienie się przed upałem lub deszczem na Starym Mieście."},"en":{"n":"Dollhouse, Games and Toys Museum","ab":"A secret and very cosy museum in the heart of the Old Town. Showcases hold a huge collection of historic miniature houses, schools, hospitals and shops from the 19th–20th centuries, with all the tiny interior details.","wh":"Looking at microscopic dishes, fireplaces, antique dolls and sewing machines fascinates children. A great place to spark imagination and see how people lived a hundred years ago.","ag":"From 5 years (when interest in tiny details appears).","st":"No. A historic basement-type building with narrow, steep stairs.","in":"🚻 Yes | 🌳 Indoors | ☕ Cafes within walking distance","hr":"12:00–15:00. A good way to hide from midday heat or rain in the Old Town."}}},{"id":3,"n":"Музей «Мир иллюзий»","pl":"Muzeum Świat Iluzji","d":"C","lat":52.2495279,"lng":21.0118534,"a":"Rynek Starego Miasta 21","lo":6,"hi":16,"st":1,"sh":1,"t":["m"],"w":"","about":"Интерактивное пространство оптических иллюзий, зеркальных лабиринтов и перевернутых комнат, расположенное прямо на Рыночной площади.","why":"Здесь ребенок сможет «потерять гравитацию» в вихревом туннеле Vortex, уменьшиться в размерах в комнате Эймса и сделать десятки смешных и удивительных семейных фотографий для соцсетей.","ageT":"От 6 лет и подростки (чтобы понимать суть оптических обманов).","stT":"Ограниченно. Исторический многоэтажный дом на Рынке, внутри есть ступеньки.","infra":"🚻 Есть | 🌳 В помещении | ☕ Рядом рестораны Рыночной площади","hrs":"10:00 – 12:00. Утром в залах свободнее, проще делать фото без людей.","note":"","imgG":"https://lh3.googleusercontent.com/gps-cs-s/ANWiy9TbtVIadakpAKCkhHHCS5SsIycpRJgouPkov6Xv_r3wpeplOVYCY1iZcCegZNbEymTglN6jmAZajBq6_S5I2GKf4t2NklvPE8oohtAlzB0acS9KfGywVfpm22WkACPsqxj-jc_hmA=s1330-w784-h1330-rw","fx":1,"pid":"ChIJwwroUpnNHkcRLAKDCk9TF54","pay":"p","L":{"pl":{"n":"Muzeum Świat Iluzji","ab":"Interaktywna przestrzeń iluzji optycznych, labiryntów luster i odwróconych pokoi, tuż przy Rynku Starego Miasta.","wh":"Dziecko może tu „stracić grawitację” w tunelu wirowym Vortex, zmniejszyć się w pokoju Amesa i zrobić dziesiątki zabawnych, niezwykłych rodzinnych zdjęć do mediów społecznościowych.","ag":"Od 6 lat i nastolatki (by zrozumieć sens złudzeń optycznych).","st":"Ograniczona. Zabytkowa wielopiętrowa kamienica na Rynku, w środku są schodki.","in":"🚻 Są | 🌳 W budynku | ☕ W pobliżu restauracje na Rynku","hr":"10:00–12:00. Rano w salach jest luźniej i łatwiej zrobić zdjęcia bez ludzi."},"en":{"n":"World of Illusions Museum","ab":"An interactive space of optical illusions, mirror mazes and upside-down rooms, right on the Old Town Market Square.","wh":"Here a child can “lose gravity” in the Vortex tunnel, shrink in the Ames room and take dozens of funny, amazing family photos for social media.","ag":"From 6 years and teenagers (to grasp the idea behind optical tricks).","st":"Limited. A historic multi-storey house on the Market Square with steps inside.","in":"🚻 Yes | 🌳 Indoors | ☕ Restaurants nearby on the Market Square","hr":"10:00–12:00. In the morning the halls are emptier, so it's easier to take photos without crowds."}}},{"id":4,"n":"Музей гравитации","pl":"Muzeum Grawitacji","d":"C","lat":52.2511408,"lng":21.0072327,"a":"Świętojerska 5/7","lo":5,"hi":12,"st":2,"sh":1,"t":["m"],"w":"","about":"Инновационная научно-популярная площадка, посвященная силам притяжения, законам физики и космическим явлениям.","why":"Сюда стоит идти ради забавных физических экспериментов. Дети могут испытать на себе действие невесомости, поиграть с кинетическим песком, проверить баланс своего тела на интерактивных тренажерах и узнать, сколько бы они весили на Марсе или Юпитере.","ageT":"5–12 лет.","stT":"Да. Площадка плоская, проходы позволяют свободно маневрировать.","infra":"🚻 Есть | 🌳 В помещении | ☕ Рядом много кофейных точек","hrs":"10:00 – 13:00 в будни. В выходные здесь часто проводят детские праздники.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfybV_tRYvXvGSGzJ_W861tZd9qZzWry2Q5wf6KESfWUd-shv3WzgB4ilGSKfznactQtznEoo1TEdX0H20GW9nzkArSJldpTrDaLNIKnfUZJYpoA-hww9pvK1g1FpZgBVYy-pGfpnatb-Vw=w800-h450-k-no","fx":1,"pid":"ChIJVSqKlx3NHkcRAzoQxoAQljU","pay":"p","L":{"pl":{"n":"Muzeum Grawitacji","ab":"Innowacyjne centrum popularnonaukowe poświęcone siłom grawitacji, prawom fizyki i zjawiskom kosmicznym.","wh":"Warto przyjść dla zabawnych doświadczeń fizycznych. Dzieci mogą poczuć nieważkość, pobawić się piaskiem kinetycznym, sprawdzić równowagę ciała na interaktywnych urządzeniach i dowiedzieć się, ile ważyłyby na Marsie czy Jowiszu.","ag":"5–12 lat.","st":"Tak. Podłoga jest płaska, a przejścia pozwalają swobodnie manewrować.","in":"🚻 Są | 🌳 W budynku | ☕ W pobliżu wiele kawiarni","hr":"10:00–13:00 w dni powszednie. W weekendy często odbywają się tu dziecięce urodziny."},"en":{"n":"Gravity Museum","ab":"An innovative popular-science venue devoted to gravity, the laws of physics and cosmic phenomena.","wh":"Come for the fun physics experiments. Children can experience weightlessness, play with kinetic sand, test their balance on interactive machines and find out how much they would weigh on Mars or Jupiter.","ag":"5–12 years.","st":"Yes. The floor is flat and the aisles allow easy manoeuvring.","in":"🚻 Yes | 🌳 Indoors | ☕ Many coffee spots nearby","hr":"10:00–13:00 on weekdays. Children's birthday parties are often held here at weekends."}}},{"id":5,"n":"Мультимедийный парк фонтанов","pl":"Multimedialny Park Fontann","d":"C","lat":52.2541811,"lng":21.0113074,"a":"Skwer I Dywizji Pancernej","lo":0,"hi":16,"st":2,"sh":0,"t":["w","p"],"w":"Multimedialny Park Fontann","about":"Огромный каскад фонтанов у подножия Старого города, который по вечерам превращается в открытый мультимедийный театр под открытым небом.","why":"Днем это приятное место, где дети могут побегать между струями сухого фонтана, а по пятницам и субботам (с мая по сентябрь) здесь разворачивается масштабное шоу. Лазеры, музыка и анимация проецируются прямо на стены из водяной пыли, рассказывая легенды о варшавской русалке.","ageT":"Для любого возраста (0+).","stT":"Да. Ровные асфальтированные и мощеные дорожки по всему скверу.","infra":"🚻 Туалеты рядом | 🌳 Мало тени днем | ☕ Летние фудтраки","hrs":"21:00 – 22:30 по пятницам и субботам. Приходить за 40 минут до шоу, чтобы занять места на траве.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLc1XaZJdFJKk91EOCNgxOgu-AtuJuLce24-oVHmEoiCj23HJLX4vOaS7xR2zYqUET1IPwQ_ozXBCYns8HWHuOgj4YeWil1ERUgBXjfWCzeMGQEu7rGjuzJipAN5wrNeSGIfgZM_=w800-h450-k-no","fx":1,"pid":"ChIJh0QLCW7MHkcRBpU8uKhlEU8","pay":"f","L":{"pl":{"n":"Multimedialny Park Fontann","ab":"Ogromna kaskada fontann u stóp Starego Miasta, wieczorami zamieniająca się w plenerowy teatr multimedialny.","wh":"W dzień to przyjemne miejsce, gdzie dzieci mogą biegać między strugami suchej fontanny, a w piątki i soboty (od maja do września) odbywa się tu spektakularny pokaz. Lasery, muzyka i animacje wyświetlane są wprost na ściany z mgły wodnej i opowiadają legendy o warszawskiej syrence.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Równe asfaltowe i brukowane alejki w całym skwerze.","in":"🚻 Toalety w pobliżu | 🌳 W dzień mało cienia | ☕ Letnie food trucki","hr":"21:00–22:30 w piątki i soboty. Przyjdź 40 minut przed pokazem, by zająć miejsca na trawie."},"en":{"n":"Multimedia Fountain Park","ab":"A huge cascade of fountains at the foot of the Old Town that turns into an open-air multimedia theatre in the evening.","wh":"By day it is a pleasant place where children can run between the jets of the dry fountain, and on Fridays and Saturdays (May to September) a grand show takes place. Lasers, music and animation are projected straight onto walls of water mist, telling legends of the Warsaw Mermaid.","ag":"Any age (0+).","st":"Yes. Smooth asphalt and paved paths throughout the square.","in":"🚻 Toilets nearby | 🌳 Little shade by day | ☕ Summer food trucks","hr":"21:00–22:30 on Fridays and Saturdays. Arrive 40 minutes before the show to get a spot on the grass."}}},{"id":6,"n":"Парк Лазенки Королевские","pl":"Łazienki Królewskie","d":"C","lat":52.2146733,"lng":21.0328941,"a":"Agrykola 1","lo":0,"hi":16,"st":1,"sh":1,"t":["p"],"w":"Łazienki Królewskie","about":"Роскошная старинная королевская резиденция с дворцами, озерами и тенистыми аллеями.","why":"Главный хит для детей — это обилие дружелюбной живой природы. Прямо по дорожкам важно гуляют павлины, а с деревьев спускаются десятки ручных белок, готовых брать орешки прямо из детских ладошек. Также можно покататься на деревянных гондолах по главному пруду.","ageT":"Для любого возраста (0+).","stT":"Ограниченно. Дорожки в основном широкие грунтовые или гравийные, местами есть холмистые спуски к прудам.","infra":"🚻 Автоматические туалеты | 🌳 Отличная тень деревьев | ☕ Кафе в парке","hrs":"09:00 – 12:00. Утром белки самые активные, а павлины гуляют прямо по дорожкам.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcix15VXPkMwxKOgiJE13LQMeuxOhDbC61s2yxqza3md7XanBbQyMhqB3Gm8YeB85xrt2xUgMhp6LE1d3PHf1VEmlY6dSY0DJv7OUzmt5zKDrZIZx7h-H-Ow6INIvgh1TXLVZRA=w800-h450-k-no","fx":1,"pid":"ChIJ435ebh7NHkcRcaqhXGG2Vow","pay":"m","L":{"pl":{"n":"Łazienki Królewskie","ab":"Wspaniała dawna rezydencja królewska z pałacami, jeziorami i zacienionymi alejami.","wh":"Największą atrakcją dla dzieci jest bogactwo przyjaznej przyrody. Po alejkach dostojnie spacerują pawie, a z drzew schodzą dziesiątki oswojonych wiewiórek, które biorą orzeszki prosto z dziecięcych dłoni. Można też popływać drewnianymi gondolami po głównym stawie.","ag":"Dla dzieci w każdym wieku (0+).","st":"Ograniczona. Alejki są głównie szerokie, gruntowe lub żwirowe, miejscami są wzgórza i zejścia do stawów.","in":"🚻 Automatyczne toalety | 🌳 Doskonały cień drzew | ☕ Kawiarnia w parku","hr":"9:00–12:00. Rano wiewiórki są najbardziej aktywne, a pawie spacerują po alejkach."},"en":{"n":"Royal Łazienki Park","ab":"A magnificent former royal residence with palaces, lakes and shady avenues.","wh":"The big draw for children is the abundance of friendly wildlife. Peacocks stroll proudly along the paths and dozens of tame squirrels climb down from the trees to take nuts straight from little hands. You can also ride wooden gondolas on the main pond.","ag":"Any age (0+).","st":"Limited. Paths are mostly wide dirt or gravel, with some hilly slopes down to the ponds.","in":"🚻 Automatic toilets | 🌳 Excellent tree shade | ☕ Cafe in the park","hr":"9:00–12:00. In the morning the squirrels are most active and peacocks wander along the paths."}}},{"id":7,"n":"Уяздовский парк","pl":"Park Ujazdowski","d":"C","lat":52.2206481,"lng":21.02687,"a":"Aleje Ujazdowskie 6","lo":1,"hi":12,"st":2,"sh":1,"t":["p"],"w":"Park Ujazdowski","about":"Один из красивейших ухоженных парков Варшавы с живописным прудом, каменным мостиком и скульптурами.","why":"Внутри парка спрятана одна из лучших бесплатных детских площадок города. Она разделена на зоны: безопасные песочницы и мини-горки для малышей, и огромные футуристические канатные лабиринты и веревочные мосты на резиновом покрытии для детей постарше.","ageT":"1–5 лет (зона песочниц), 6–12 лет (высокие лабиринты).","stT":"Да. Отличные дорожки, площадка имеет бесшовное резиновое покрытие.","infra":"🚻 Платный туалет | 🌳 Густая тень деревьев | ☕ Киоски с мороженым","hrs":"09:30 – 12:00 или 16:00 – 18:30 в будни. На выходных площадка переполнена.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLeQGxnQXURe6QRrAqlNWtjunKcQ82ifhwOjO8bzrz8eOqZh-MEnMcj8k__WnQ_8kIC_BNF3ChbkyoRCS-7qHpfip-R3UwoHCfDNS186pM4D8mWL6ExChqckFcIdXP7PihXnQVdAyjRe1VuS=w800-h450-k-no","fx":1,"pid":"ChIJwW4S2uTMHkcRh-xOGEZVdxo","pay":"f","L":{"pl":{"n":"Park Ujazdowski","ab":"Jeden z najpiękniejszych zadbanych parków Warszawy z malowniczym stawem, kamiennym mostkiem i rzeźbami.","wh":"W parku ukryty jest jeden z najlepszych bezpłatnych placów zabaw w mieście. Podzielony jest na strefy: bezpieczne piaskownice i mini-zjeżdżalnie dla maluchów oraz ogromne futurystyczne labirynty linowe i mosty linowe na gumowej nawierzchni dla starszych dzieci.","ag":"1–5 lat (strefa piaskownic), 6–12 lat (wysokie labirynty).","st":"Tak. Świetne alejki, plac zabaw ma bezszwową gumową nawierzchnię.","in":"🚻 Toaleta płatna | 🌳 Gęsty cień drzew | ☕ Kioski z lodami","hr":"9:30–12:00 lub 16:00–18:30 w dni powszednie. W weekendy plac zabaw jest przepełniony."},"en":{"n":"Ujazdów Park","ab":"One of Warsaw's most beautiful, well-kept parks with a picturesque pond, a stone bridge and sculptures.","wh":"Hidden in the park is one of the best free playgrounds in the city. It is divided into zones: safe sandpits and mini slides for toddlers, and huge futuristic rope mazes and rope bridges on rubber flooring for older children.","ag":"1–5 years (sandpit zone), 6–12 years (tall mazes).","st":"Yes. Excellent paths, and the playground has seamless rubber flooring.","in":"🚻 Paid toilet | 🌳 Dense tree shade | ☕ Ice-cream kiosks","hr":"9:30–12:00 or 16:00–18:30 on weekdays. The playground is crowded at weekends."}}},{"id":8,"n":"Музей эволюции","pl":"Muzeum Ewolucji","d":"C","lat":52.2323287,"lng":21.0058526,"a":"Plac Defilad 1","lo":4,"hi":10,"st":1,"sh":1,"t":["m"],"w":"Muzeum Ewolucji Instytutu Paleobiologii PAN","about":"Палеонтологический музей, расположенный прямо в левом крыле Дворца культуры и науки.","why":"Идеальное место для маленьких фанатов динозавров. Здесь выставлены настоящие огромные скелеты динозавров, найденные польскими экспедициями в пустыне Гоби, гигантские яйца рептилий, древние окаменелости и реалистичные макеты доисторических амфибий.","ageT":"От 4 до 10 лет.","stT":"Ограниченно. На входе во Дворец культуры есть массивные ступени, но внутри музея передвигаться можно.","infra":"🚻 Есть во Дворце | 🌳 В помещении | ☕ Кафе внутри здания","hrs":"10:00 – 13:00. Понедельник — выходной. Музей небольшой, хорош для совмещения с прогулкой.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLdE16L01QpIozateSDn219hTOeNekvxMb3nLpJovkEXYNO1VhIlFlG-Wo1DkFe2JnLdkEUaJmA36b2ssEUSB06RcJ6jzfOw3Xj4bQrPzK1D_tPVjtsYUm99xm-Q0odhxxa8c669=w800-h450-k-no","fx":1,"pid":"ChIJdf30kozMHkcREj7q4O96gkU","pay":"p","L":{"pl":{"n":"Muzeum Ewolucji","ab":"Muzeum paleontologiczne w lewym skrzydle Pałacu Kultury i Nauki.","wh":"Idealne miejsce dla małych fanów dinozaurów. Prezentowane są prawdziwe ogromne szkielety dinozaurów znalezione przez polskie wyprawy na pustyni Gobi, gigantyczne jaja gadów, prastare skamieniałości i realistyczne modele prehistorycznych płazów.","ag":"4–10 lat.","st":"Ograniczona. Przy wejściu do Pałacu są masywne schody, ale w samym muzeum można się poruszać.","in":"🚻 W Pałacu | 🌳 W budynku | ☕ Kawiarnia w budynku","hr":"10:00–13:00. Poniedziałek nieczynne. Muzeum jest niewielkie, dobrze łączyć je ze spacerem."},"en":{"n":"Museum of Evolution","ab":"A palaeontology museum in the left wing of the Palace of Culture and Science.","wh":"A perfect place for little dinosaur fans. It displays real giant dinosaur skeletons found by Polish expeditions in the Gobi Desert, giant reptile eggs, ancient fossils and realistic models of prehistoric amphibians.","ag":"4–10 years.","st":"Limited. There are massive steps at the Palace entrance, but you can move around inside the museum.","in":"🚻 In the Palace | 🌳 Indoors | ☕ Cafe in the building","hr":"10:00–13:00. Closed on Mondays. A small museum, good to combine with a walk."}}},{"id":9,"n":"Смотровая площадка Дворца культуры","pl":"Taras widokowy Pałacu Kultury i Nauki","d":"C","lat":52.2320344,"lng":21.0066738,"a":"Plac Defilad 1","lo":3,"hi":16,"st":2,"sh":1,"t":["v"],"w":"Pałac Kultury i Nauki","about":"Открытая круговая терраса на 30-м этаже самого известного и высокого сталинского небоскреба Варшавы (высота — 114 метров).","why":"Детей захватывает сам подъем на скоростном лифте за считанные секунды. Сверху открывается потрясающий вид на всю Варшаву, стадионы, небоскребы и извивающуюся Вислу — город выглядит как игрушечный макет.","ageT":"От 3 лет и старше.","stT":"Да. До площадки ведут скоростные лифты, по самой террасе можно катить коляску.","infra":"🚻 Есть на этаже | 🌳 Ветрено, есть крытые зоны | ☕ Кафе на 30-м этаже","hrs":"За 1 час до заката. Вы застанете город при дневном свете, увидите красивый закат и ночные огни.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcevAyC8gRzWq9Ffj5A73otKU3gHsA9O_JPBlEC_rar1xqYv7Q8hGZwFrmla-4ymUVNJh_A33l1_Smd1uaY9MW7RRD5kyE4IBSkcBjGCvkPOrO9fqcmc3Orqnm541IqaStWqao=w800-h450-k-no","fx":1,"pid":"ChIJCSxXlIzMHkcRvpr8eIiPHjU","pay":"p","L":{"pl":{"n":"Taras widokowy Pałacu Kultury i Nauki","ab":"Otwarty taras widokowy na 30. piętrze najsłynniejszego i najwyższego stalinowskiego wieżowca Warszawy (wysokość — 114 metrów).","wh":"Dzieci zachwyca sama jazda szybką windą trwająca zaledwie kilka sekund. Z góry roztacza się wspaniały widok na całą Warszawę, stadiony, wieżowce i meandrującą Wisłę — miasto wygląda jak zabawkowa makieta.","ag":"Od 3 lat.","st":"Tak. Na taras jeżdżą szybkie windy, po samym tarasie można jeździć wózkiem.","in":"🚻 Na piętrze | 🌳 Wietrznie, są zadaszone strefy | ☕ Kawiarnia na 30. piętrze","hr":"Godzinę przed zachodem słońca. Zobaczysz miasto w świetle dnia, piękny zachód i nocne światła."},"en":{"n":"Palace of Culture Viewing Terrace","ab":"An open circular terrace on the 30th floor of Warsaw's most famous and tallest Stalinist skyscraper (114 metres high).","wh":"Children are thrilled by the ride in the high-speed lift that takes just seconds. From the top there is a stunning view of all of Warsaw, the stadiums, the skyscrapers and the winding Vistula — the city looks like a toy model.","ag":"From 3 years.","st":"Yes. High-speed lifts lead to the terrace, and you can push a stroller around the terrace itself.","in":"🚻 On the floor | 🌳 Windy, with covered areas | ☕ Cafe on the 30th floor","hr":"One hour before sunset. You will see the city in daylight, a beautiful sunset and the night lights."}}},{"id":10,"n":"Варшавская семейная зона","pl":"Warszawska Strefa Rodziny","d":"C","lat":52.2524185,"lng":21.011278,"a":"Stara 4","lo":1,"hi":10,"st":2,"sh":1,"t":["g"],"w":"","about":"Городское инклюзивное рекреационное пространство под открытым небом на берегу Вислы, созданное специально для качественного семейного отдыха.","why":"Отличное бесплатное место для перезагрузки во время прогулки по набережной. Здесь есть развивающие уличные игры, безопасные деревянные лазилки, гамаки для родителей, зеленые лужайки для активных игр и зоны для творчества.","ageT":"1–10 лет.","stT":"Да. Широкая парковая рекреация, твердое безопасное покрытие.","infra":"🚻 Есть общественный санузел | 🌳 Средняя затененность | ☕ Кафе в 5 минутах ходьбы","hrs":"10:00 – 13:00 (летом не так жарко у воды) или 16:30 – 19:00.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLeSOnIqHwdfa9AmLRwAx0881nB5IGmDUfLRmgq2IrJzKOGW0zU9pENEYH0k9GpMxprRNEcleW-V0mM9DJGNtoSvY4t9rZrAmab9aMe85ayoBKpAGzuyEj2RIDjYuVkdGXy_O1OE=w800-h450-k-no","fx":1,"pid":"ChIJRQBhXG7MHkcRI5ZE3KjKrCY","pay":"f","L":{"pl":{"n":"Warszawska Strefa Rodziny","ab":"Miejska inkluzywna przestrzeń rekreacyjna pod gołym niebem nad Wisłą, stworzona specjalnie z myślą o dobrym rodzinnym wypoczynku.","wh":"Świetne bezpłatne miejsce na odpoczynek podczas spaceru po bulwarach. Są tu rozwijające gry plenerowe, bezpieczne drewniane konstrukcje do wspinania, hamaki dla rodziców, zielone trawniki do aktywnych zabaw i strefy twórcze.","ag":"1–10 lat.","st":"Tak. Szeroka przestrzeń parkowa, twarda bezpieczna nawierzchnia.","in":"🚻 Toaleta publiczna | 🌳 Średnie zacienienie | ☕ Kawiarnia 5 minut pieszo","hr":"10:00–13:00 (latem nad wodą jest chłodniej) lub 16:30–19:00."},"en":{"n":"Warsaw Family Zone","ab":"An inclusive urban recreation space in the open air on the Vistula bank, created specially for quality family leisure.","wh":"A great free place to recharge during a stroll along the riverside. It has educational outdoor games, safe wooden climbing structures, hammocks for parents, green lawns for active play and creative zones.","ag":"1–10 years.","st":"Yes. Wide park area with a hard, safe surface.","in":"🚻 Public toilet | 🌳 Moderate shade | ☕ Cafe 5 minutes' walk away","hr":"10:00–13:00 (cooler by the water in summer) or 16:30–19:00."}}},{"id":11,"n":"Сад на крыше университетской библиотеки","pl":"Ogród na dachu Biblioteki Uniwersyteckiej","d":"C","lat":52.2431266,"lng":21.0249825,"a":"Dobra 56/66","lo":0,"hi":16,"st":1,"sh":0,"t":["p","v"],"w":"Biblioteka Uniwersytecka w Warszawie","about":"Один из крупнейших и красивейших садов на крыше в Европе. Пространство разбито на несколько цветовых зон, соединенных мостиками, стеклянными куполами и смотровыми площадками.","why":"Детям очень нравится исследовать это футуристическое зеленое пространство: ходить по металлическим мостикам над стеклянными потолками библиотеки, заглядывать в потайные беседки, увитые розами, и смотреть на панораму реки.","ageT":"Для любого возраста (0+).","stT":"Ограниченно. На верхний уровень сада ведут лестницы, нижний уровень доступен полностью.","infra":"🚻 Туалеты на 1 этаже | 🌳 Беседки, много открытых участков | ☕ Кафе в здании","hrs":"16:00 – 19:00 весной и летом. Мягкий предвечерний свет идеален для панорамных фото Вислы.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfnSlyeNMLupnTvczEV8_4dbXqSQVJ3nOarLJG5Uzlf7J7HjjMkPsIXYTuSKMmeHQtucZJRFvvQvW_STkCa0rCYUfQmbLTY9V9n8r3g68xRG0skieqknzTDjx1RqcIlx5JK5tBb=w800-h450-k-no","fx":1,"pid":"ChIJa5vQa1zMHkcRhjFeXmgI3rU","pay":"f","L":{"pl":{"n":"Ogród na dachu Biblioteki Uniwersyteckiej","ab":"Jeden z największych i najpiękniejszych ogrodów na dachu w Europie. Przestrzeń podzielona jest na kilka stref kolorystycznych połączonych mostkami, szklanymi kopułami i tarasami widokowymi.","wh":"Dzieci uwielbiają odkrywać tę futurystyczną zieloną przestrzeń: chodzić po metalowych mostkach nad szklanymi stropami biblioteki, zaglądać do ukrytych altan oplecionych różami i patrzeć na panoramę rzeki.","ag":"Dla dzieci w każdym wieku (0+).","st":"Ograniczona. Na górny poziom ogrodu prowadzą schody, dolny poziom jest w pełni dostępny.","in":"🚻 Toalety na parterze | 🌳 Altany, wiele otwartych miejsc | ☕ Kawiarnia w budynku","hr":"16:00–19:00 wiosną i latem. Miękkie popołudniowe światło jest idealne do zdjęć panoramy Wisły."},"en":{"n":"University Library Rooftop Garden","ab":"One of Europe's largest and most beautiful rooftop gardens. The space is split into several colour zones linked by bridges, glass domes and viewing platforms.","wh":"Children love exploring this futuristic green space: walking on metal bridges over the library's glass ceilings, peeking into hidden rose-covered arbours and looking at the river panorama.","ag":"Any age (0+).","st":"Limited. Stairs lead to the upper level of the garden; the lower level is fully accessible.","in":"🚻 Toilets on the ground floor | 🌳 Arbours, many open areas | ☕ Cafe in the building","hr":"16:00–19:00 in spring and summer. The soft early-evening light is ideal for panoramic photos of the Vistula."}}},{"id":12,"n":"Королевский замок","pl":"Zamek Królewski","d":"C","lat":52.2477436,"lng":21.0141275,"a":"Plac Zamkowy 4","lo":6,"hi":12,"st":1,"sh":1,"t":["m","v"],"w":"Zamek Królewski w Warszawie","about":"Полностью восстановленная историческая резиденция польских королей на Замковой площади.","why":"Чтобы залы не казались детям скучными, на кассе можно взять интерактивные листы-квесты. Ребенок превращается в исследователя, который ищет скрытые детали на картинах, тайные знаки в тронном зале и королевские символы, параллельно погружаясь в историю рыцарей и королей.","ageT":"От 6 до 12 лет (квесты по залам).","stT":"Ограниченно. Коляску попросят оставить в гардеробной зоне, старинные интерьеры не приспособлены для катания.","infra":"🚻 Есть туалеты | 🌳 В помещении | ☕ Кафетерий при замке","hrs":"10:00 – 12:30. В среду вход бесплатный, лучше выбрать четверг или пятницу.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLckMrfW9Cud6C589GKxYzH2VxOd8Y231SY0-dOOAj_kCDTStoupXbiwkWEtAa6APyxQlRZm3LXhNPaKGMlHinyiqDAc7oowvLxDAbWJNCsJMQqCbzRqn0vJnXCActbYvxbaoQk6=w800-h450-k-no","fx":1,"pid":"ChIJB1RFG2bMHkcRvslJ-0ahGSA","pay":"m","L":{"pl":{"n":"Zamek Królewski","ab":"W pełni odbudowana historyczna rezydencja polskich królów na Placu Zamkowym.","wh":"Aby sale nie nudziły dzieci, w kasie można wziąć interaktywne karty z zadaniami. Dziecko staje się badaczem, który szuka ukrytych szczegółów na obrazach, tajnych znaków w Sali Tronowej i królewskich symboli, jednocześnie poznając historię rycerzy i królów.","ag":"6–12 lat (zadania po salach).","st":"Ograniczona. Wózek poproszą zostawić w szatni, zabytkowe wnętrza nie są przystosowane do jazdy.","in":"🚻 Są | 🌳 W budynku | ☕ Kawiarnia przy zamku","hr":"10:00–12:30. W środę wstęp jest bezpłatny, lepiej wybrać czwartek lub piątek."},"en":{"n":"Royal Castle","ab":"The fully restored historic residence of Polish kings on Castle Square.","wh":"To keep the halls from boring children, you can pick up interactive quest sheets at the ticket desk. The child becomes an explorer searching for hidden details in paintings, secret signs in the Throne Room and royal symbols, learning about knights and kings along the way.","ag":"6–12 years (quests through the halls).","st":"Limited. You will be asked to leave the stroller in the cloakroom area; the historic interiors are not suited to rolling.","in":"🚻 Yes | 🌳 Indoors | ☕ Cafe at the castle","hr":"10:00–12:30. Admission is free on Wednesdays, so Thursday or Friday is better."}}},{"id":13,"n":"Парк первооткрывателей","pl":"Park Odkrywców","d":"C","lat":52.2410168,"lng":21.0303425,"a":"Wybrzeże Kościuszkowskie 20","lo":3,"hi":12,"st":2,"sh":0,"t":["p"],"w":"","about":"Зеленая парковая зона, окружающая Центр науки «Коперник» и выходящая прямо к набережной Вислы.","why":"Это продолжение научной игры, но на свежем воздухе и абсолютно бесплатно. Здесь установлены уличные звуковые инсталляции («эхо-трубы», акустические зеркала), футуристические скульптуры и интерактивные арт-объекты, на которых дети могут экспериментировать со звуковыми волнами.","ageT":"3–12 лет.","stT":"Да. Ровный газон и плитка на набережной Вислы.","infra":"🚻 Рядом в Центре Коперник | 🌳 Открытая зона | ☕ Кафе на набережной","hrs":"13:00 – 15:00. Прекрасное место, чтобы передохнуть между посещением залов музея.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfepLGmeky-zxmVESu4Mwn3WOY3Rqea2RYHpewqeB29EOdvrfk-K5nZvtkn8XOiUYaI6--lWLGs9U_2WFWg6pXx-1mLFeWex2lBex7n0cMmI0vT2VdsErt0Nn4yks1NAB58N5BvBXxc7AQx=w800-h450-k-no","fx":1,"pid":"ChIJZVjnSVrMHkcRvAl5Q3Sw5bo","pay":"f","L":{"pl":{"n":"Park Odkrywców","ab":"Zielona strefa parkowa wokół Centrum Nauki Kopernik, wychodząca wprost na bulwary wiślane.","wh":"To kontynuacja naukowej zabawy, ale na świeżym powietrzu i zupełnie za darmo. Stoją tu plenerowe instalacje dźwiękowe („trąby echa”, zwierciadła akustyczne), futurystyczne rzeźby i interaktywne obiekty artystyczne, na których dzieci mogą eksperymentować z falami dźwiękowymi.","ag":"3–12 lat.","st":"Tak. Równy trawnik i płyty na bulwarze nad Wisłą.","in":"🚻 W pobliżu, w Centrum Kopernik | 🌳 Otwarta przestrzeń | ☕ Kawiarnia na bulwarze","hr":"13:00–15:00. Świetne miejsce na odpoczynek między zwiedzaniem sal muzeum."},"en":{"n":"Discoverers' Park","ab":"A green park area surrounding the Copernicus Science Centre and opening straight onto the Vistula embankment.","wh":"This continues the science fun, but outdoors and completely free. There are outdoor sound installations (“echo tubes”, acoustic mirrors), futuristic sculptures and interactive art objects where children can experiment with sound waves.","ag":"3–12 years.","st":"Yes. Flat lawn and paving on the Vistula embankment.","in":"🚻 Nearby in the Copernicus Centre | 🌳 Open area | ☕ Cafe on the embankment","hr":"13:00–15:00. A great place to rest between visiting the museum halls."}}},{"id":14,"n":"Музей Войска Польского","pl":"Muzeum Wojska Polskiego","d":"C","lat":52.263949,"lng":21.0005376,"a":"Cytadela Warszawska – Pawilon Południowy, Gwardii 4","lo":4,"hi":16,"st":2,"sh":0,"t":["m"],"w":"Muzeum Wojska Polskiego w Warszawie","about":"Один из крупнейших исторических музеев Польши: рассказывает о военном деле от X века до Второй мировой войны и современности. Недавно переехал в современное здание на территории Варшавской цитадели.","why":"Дети в восторге от выставки техники под открытым небом: настоящие танки (в том числе Т-34), орудия, самолёты (например, МиГи) и вертолёты можно рассмотреть вблизи.","ageT":"От 4 лет и подростки.","stT":"Да. Экспонаты стоят на большой асфальтированной уличной площади.","infra":"🚻 Есть на территории | 🌳 Открытая площадка | ☕ Небольшое бистро","hrs":"10:00 – 12:00. На открытом плато практически нет тени, поэтому летом в полдень тут душно.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLe2zdv7gl9JzN4S9ADHhJi2B6eCOumwhfARiaqvT43HzZkTLr820Jhd8PE_IZCF7X6EPFOHZrH-sEWqvQqeVxO8saqxW0XXf7wbqMfHsvLfhKAx0dgy_MgFcFJX1OQrdsvkkcN0TQ=w800-h450-k-no","fx":1,"pid":"ChIJK6UEcvfMHkcRGDePQvvQqow","pay":"p","L":{"pl":{"n":"Muzeum Wojska Polskiego","ab":"Jedno z największych muzeów historycznych w Polsce: opowiada o sztuce wojennej od X wieku po II wojnę światową i czasy współczesne. Niedawno przeniosło się do nowoczesnego budynku na terenie Cytadeli Warszawskiej.","wh":"Dzieci zachwyca wystawa sprzętu pod gołym niebem: prawdziwe czołgi (w tym T-34), działa, samoloty (np. MiG-i) i śmigłowce można obejrzeć z bliska.","ag":"Od 4 lat i nastolatki.","st":"Tak. Eksponaty stoją na dużym asfaltowym placu pod gołym niebem.","in":"🚻 Na terenie | 🌳 Otwarty teren | ☕ Małe bistro","hr":"10:00–12:00. Na otwartym placu prawie nie ma cienia, więc latem w południe jest duszno."},"en":{"n":"Polish Army Museum","ab":"One of Poland's largest history museums, telling the story of warfare from the 10th century to World War II and the present day. It recently moved into a modern building on the grounds of the Warsaw Citadel.","wh":"Children are thrilled by the open-air display of military hardware: real tanks (including the T-34), guns, aircraft (such as MiGs) and helicopters can be seen up close.","ag":"From 4 years and teenagers.","st":"Yes. The exhibits stand on a large asphalt open-air square.","in":"🚻 On site | 🌳 Open area | ☕ Small bistro","hr":"10:00–12:00. There is almost no shade on the open plateau, so it is stuffy at midday in summer."}}},{"id":15,"n":"Планета умных детей","pl":"Smart Kids Planet","d":"W","lat":52.232415,"lng":20.9914348,"a":"ul. Żelazna 51/53","lo":0,"hi":10,"st":2,"sh":1,"t":["a"],"w":"","about":"Первый в Польше инновационный центр умных развлечений для детей, расположенный в отреставрированном пространстве Фабрики Норблина.","why":"Здесь нет стандартных пластиковых горок. Игровая разделена на зоны, где дети могут стать курьерами и сортировать посылки, «строить» дома на цифровой стройке, запускать ракеты, создавать собственные цифровые рисунки и тренировать футбольную меткость.","ageT":"От 0 до 10 лет (лучшее наполнение — для возраста 3–7 лет).","stT":"Да. Идеал безбарьерной среды, есть специальная «парковка» для детских колясок у входа.","infra":"🚻 Детские санузлы | 🌳 Кондиционеры | ☕ Smart Café внутри","hrs":"09:00 – 11:30 или 12:00 – 14:30 в будни. Бронируйте сеансы на сайте заранее.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfv8uk6sBMAjeFE9g9c2hYmSktNo7PHtRWjdMJtd-gIMraX1Y_zGVWGOLV1dWjz27TlQxdWMaUehrqKxZglwzW39w49qHLDWc_iznNl1jtKHiSDbhZ-mhHCzOvTM2kJOz8Jt9erLka-CyE=w800-h450-k-no","fx":1,"pid":"ChIJ17oLtt_NHkcRg0vTeRoJIoQ","pay":"p","L":{"pl":{"n":"Smart Kids Planet","ab":"Pierwsze w Polsce innowacyjne centrum inteligentnej rozrywki dla dzieci w odnowionej przestrzeni Fabryki Norblina.","wh":"Nie ma tu standardowych plastikowych zjeżdżalni. Sala zabaw podzielona jest na strefy, w których dzieci mogą zostać kurierami i sortować paczki, „budować” domy na cyfrowej budowie, wystrzeliwać rakiety, tworzyć własne cyfrowe rysunki i trenować celność w piłce nożnej.","ag":"0–10 lat (najlepsza oferta dla dzieci 3–7 lat).","st":"Tak. Wzorowa przestrzeń bez barier, przy wejściu jest specjalny „parking” na wózki dziecięce.","in":"🚻 Toalety dla dzieci | 🌳 Klimatyzacja | ☕ Smart Café w środku","hr":"9:00–11:30 lub 12:00–14:30 w dni powszednie. Rezerwuj seanse na stronie z wyprzedzeniem."},"en":{"n":"Smart Kids Planet","ab":"Poland's first innovative smart-entertainment centre for children, in the renovated space of the Norblin Factory.","wh":"There are no standard plastic slides here. The play area is divided into zones where children can become couriers and sort parcels, “build” houses on a digital construction site, launch rockets, create their own digital drawings and practise their football aim.","ag":"0–10 years (best content for ages 3–7).","st":"Yes. A model barrier-free environment, with a special stroller “parking” area at the entrance.","in":"🚻 Children's toilets | 🌳 Air conditioning | ☕ Smart Cafe inside","hr":"9:00–11:30 or 12:00–14:30 on weekdays. Book sessions on the website in advance."}}},{"id":16,"n":"Колейково","pl":"Kolejkowo","d":"W","lat":52.2319328,"lng":21.0019725,"a":"ul. Sienna 39","lo":2,"hi":16,"st":2,"sh":1,"t":["m"],"w":"Kolejkowo","about":"Огромный, живой и невероятно детализированный макет железной дороги и миниатюрной Польши на территории Warsaw Towers.","why":"Этот мини-мир живет своей жизнью: по рельсам бегут поезда, ездят крошечные машины, человечки «работают», загорают на пляже и даже тушат пожары. Каждые 9 минут на макете наступает ночь, зажигаются окна домов и уличные фонари. Разглядывание скрытых шутливых сценок занимает детей на часы.","ageT":"От 2 лет и старше (будет интересно даже взрослым).","stT":"Да. Широкие коридоры между макетами, лифты в здании.","infra":"🚻 Есть | 🌳 Кондиционеры | ☕ Кофейни в ТЦ","hrs":"10:00 – 13:00.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfd0t63zlF-KkgA2Bw9eJ5tAuF5s-gbvjTI_eP62mjSwXZoi5lUwD0Lj23MbkaqHsc3LNeROJMS3ZNFJsop5kT5YaiaMBn_Mzy3JTSHRgYu46CuHcj7sqxoVZfj3WWAvmn3RdH5Vu4CoRuq=w800-h450-k-no","fx":1,"pid":"ChIJ5TTKDbDNHkcRnwXGfu2EnWA","pay":"p","L":{"pl":{"n":"Kolejkowo","ab":"Ogromna, żywa i niezwykle szczegółowa makieta kolei oraz miniaturowej Polski na terenie Warsaw Towers.","wh":"Ten mini-świat żyje własnym życiem: po torach jeżdżą pociągi, jeżdżą maleńkie samochody, ludziki „pracują”, opalają się na plaży, a nawet gaszą pożary. Co 9 minut na makiecie zapada noc, zapalają się okna domów i uliczne latarnie. Wypatrywanie ukrytych, żartobliwych scenek zajmuje dzieci na godziny.","ag":"Od 2 lat (ciekawe nawet dla dorosłych).","st":"Tak. Szerokie korytarze między makietami, windy w budynku.","in":"🚻 Są | 🌳 Klimatyzacja | ☕ Kawiarnie w centrum handlowym","hr":"10:00–13:00."},"en":{"n":"Kolejkowo","ab":"A huge, living and incredibly detailed model of a railway and miniature Poland on the premises of Warsaw Towers.","wh":"This mini-world lives its own life: trains run along the tracks, tiny cars drive, little figures “work”, sunbathe on the beach and even put out fires. Every 9 minutes night falls on the model, house windows and street lamps light up. Spotting the hidden humorous scenes keeps children busy for hours.","ag":"From 2 years (interesting even for adults).","st":"Yes. Wide corridors between the models, lifts in the building.","in":"🚻 Yes | 🌳 Air conditioning | ☕ Coffee shops in the shopping centre","hr":"10:00–13:00."}}},{"id":17,"n":"Пинбол станция","pl":"Pinball Station","d":"W","lat":52.2245891,"lng":20.9782156,"a":"Kolejowa 8A","lo":8,"hi":16,"st":0,"sh":1,"t":["a","m"],"w":"","about":"Интерактивный музей старинных игровых автоматов и пинбол-машин, собранных за последние полвека.","why":"Покупая один билет, подростки и их родители получают безлимитный доступ ко всем автоматам. Это идеальная возможность для детей оторваться от экранов телефонов и познакомиться с реальной, тактильной ретро-игровой культурой, а для пап — показать класс в играх своего детства.","ageT":"От 8 лет и старше (подростки).","stT":"Нет. Проходы между рядами автоматов узкие, входные группы исторического здания не адаптированы для колясок.","infra":"🚻 Есть | 🌳 В помещении | ☕ Бар со снеками","hrs":"12:00 – 15:00. К вечеру подтягиваются взрослые компании.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLe3oF6Ip6099rna68tvYeiXybWsnK0Ac-fgNv9cC4qO93sxU94MPi3GzDpdZiUDQzLQphpm0rxMmm6GwkzWBkuncOciWpJHfJQxoxrIMU-3cO-wSeKglW8-J-DEwkP-dDK_1JELsA=w800-h450-k-no","fx":1,"pid":"ChIJ4WjTIpnMHkcRptKrePUwbBE","pay":"p","L":{"pl":{"n":"Pinball Station","ab":"Interaktywne muzeum dawnych automatów do gier i flipperów zebranych na przestrzeni ostatniego półwiecza.","wh":"Kupując jeden bilet, nastolatki i ich rodzice dostają nielimitowany dostęp do wszystkich automatów. To świetna okazja, by dzieci oderwały się od ekranów telefonów i poznały prawdziwą, namacalną kulturę gier retro, a tatusiowie pokazali klasę w grach z dzieciństwa.","ag":"Od 8 lat (nastolatki).","st":"Nie. Przejścia między rzędami automatów są wąskie, wejścia w zabytkowym budynku nie są przystosowane dla wózków.","in":"🚻 Są | 🌳 W pomieszczeniu | ☕ Bar z przekąskami","hr":"12:00–15:00. Wieczorem przychodzą grupy dorosłych."},"en":{"n":"Pinball Station","ab":"An interactive museum of vintage arcade machines and pinball tables collected over the last half-century.","wh":"With a single ticket, teenagers and their parents get unlimited access to all the machines. A perfect chance for kids to look away from phone screens and meet real, tactile retro gaming culture, and for dads to show their skills at the games of their childhood.","ag":"From 8 years (teenagers).","st":"No. Aisles between the machines are narrow, and the entrances of the historic building are not adapted for strollers.","in":"🚻 Yes | 🌳 Indoors | ☕ Snack bar","hr":"12:00–15:00. Adult groups arrive towards the evening."}}},{"id":18,"n":"Pixel XL Box","pl":"Pixel XL Box","d":"C","lat":52.2568314,"lng":20.9839375,"a":"Al. Jana Pawła II 82","lo":6,"hi":16,"st":2,"sh":1,"t":["a"],"w":"","about":"Интерактивная игровая комната внутри ТЦ Westfield Arkadia, где пол превращен в огромный светящийся пиксельный экран.","why":"Отличный способ выплеснуть детскую энергию. Дети играют в командах или в одиночку, прыгая по загорающимся квадратам определенного цвета, собирая «монеты» и избегая виртуальных ловушек. Игра напоминает реальную версию Майнкрафта или Тетриса.","ageT":"От 6 лет и подростки.","stT":"Да. Локация в современном ТЦ, полный безбарьерный доступ.","infra":"🚻 Туалеты ТРЦ | 🌳 В помещении | ☕ Фудкорт ТЦ в шаге","hrs":"10:30 – 13:00. Игра требует высокой активности, лучше идти до того, как ребенок устанет от шопинга.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcTjVDMt1Rv9Jxb_R4hxncKdVxTI1oh-AOVkf3LhRaYavH1vYZ3I88PhkX7y1NTi6QI7SS5XIiuO1cw1panss21dO_LZe5ca_MCd9xuLdJyVMKN3v-K63NxyOL4y_IjPOz074qx=w800-h450-k-no","fx":1,"pid":"ChIJE2D6F07LHkcREYdfCSjOrDU","pay":"p","L":{"pl":{"n":"Pixel XL Box","ab":"Interaktywna sala zabaw wewnątrz centrum Westfield Arkadia, w której podłoga zamienia się w ogromny świecący ekran pikselowy.","wh":"Świetny sposób na wyładowanie dziecięcej energii. Dzieci grają w drużynach lub samodzielnie, skacząc po zapalających się kwadratach określonego koloru, zbierając „monety” i unikając wirtualnych pułapek. Gra przypomina realną wersję Minecrafta lub Tetrisa.","ag":"Od 6 lat i nastolatki.","st":"Tak. Lokal w nowoczesnym centrum handlowym, pełny dostęp bez barier.","in":"🚻 Toalety w centrum handlowym | 🌳 W pomieszczeniu | ☕ Food court tuż obok","hr":"10:30–13:00. Gra wymaga dużej aktywności, lepiej przyjść, zanim dziecko zmęczy się zakupami."},"en":{"n":"Pixel XL Box","ab":"An interactive play room inside Westfield Arkadia, where the floor becomes a huge glowing pixel screen.","wh":"A great way to burn off children's energy. Kids play in teams or alone, jumping on squares that light up in a particular colour, collecting “coins” and avoiding virtual traps. The game feels like a real-life version of Minecraft or Tetris.","ag":"From 6 years and teenagers.","st":"Yes. Located in a modern shopping centre with fully barrier-free access.","in":"🚻 Shopping-centre toilets | 🌳 Indoors | ☕ Food court next door","hr":"10:30–13:00. The game is very active, so it is best to come before the child gets tired from shopping."}}},{"id":19,"n":"Музей Воли","pl":"Muzeum Woli","d":"W","lat":52.2279037,"lng":20.9897211,"a":"Srebrna 12","lo":5,"hi":12,"st":2,"sh":1,"t":["m"],"w":"","about":"Современный филиал Музея Варшавы, полностью посвященный истории, архитектуре и будущему этого самого динамичного индустриального района.","why":"Здесь созданы потрясающие, адаптированные для детей мультимедийные и макетные исторические выставки. Дети могут почувствовать себя архитекторами, собирая макеты фабрик и жилых кварталов, разгадывая городские загадки в интерактивных залах.","ageT":"От 5 до 12 лет.","stT":"Да. Здание полностью модернизировано, оборудовано удобными лифтами и съездами.","infra":"🚻 Есть | 🌳 Климат-контроль | ☕ Кафе в здании","hrs":"11:00 – 14:00.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLc_CAChdAe6t34my8MMLmILNN_XeL4cIJWWF65pJDAzlwYTlhvyg_-I6R1ywtf9dSsxCAmax_k1CxEknme64F8ZXtUpxR1VJNsgmgDIRSLkT7gi153OQAQRnzjlCKELbv2MgGzt=w800-h450-k-no","fx":1,"pid":"ChIJaakjY5DMHkcRZM2aKFN9KCY","pay":"p","L":{"pl":{"n":"Muzeum Woli","ab":"Nowoczesny oddział Muzeum Warszawy, w całości poświęcony historii, architekturze i przyszłości tej najdynamiczniejszej dzielnicy przemysłowej.","wh":"Powstały tu znakomite, dostosowane do dzieci wystawy multimedialne i makietowe. Dzieci mogą poczuć się jak architekci, składając makiety fabryk i osiedli mieszkaniowych oraz rozwiązując miejskie zagadki w interaktywnych salach.","ag":"5–12 lat.","st":"Tak. Budynek jest w pełni zmodernizowany, wyposażony w wygodne windy i podjazdy.","in":"🚻 Są | 🌳 Klimatyzacja | ☕ Kawiarnia w budynku","hr":"11:00–14:00."},"en":{"n":"Wola Museum","ab":"A modern branch of the Museum of Warsaw devoted entirely to the history, architecture and future of this most dynamic industrial district.","wh":"Remarkable multimedia and scale-model history exhibitions made for children. Kids can feel like architects, assembling models of factories and residential blocks and solving city riddles in interactive halls.","ag":"5–12 years.","st":"Yes. The building is fully modernised, with convenient lifts and ramps.","in":"🚻 Yes | 🌳 Climate control | ☕ Cafe in the building","hr":"11:00–14:00."}}},{"id":20,"n":"Батутный парк Jump Arena","pl":"Jump Arena","d":"I","lat":52.3197235,"lng":21.0076785,"a":"Marywilska 44","lo":4,"hi":16,"st":2,"sh":1,"t":["a"],"w":"","about":"Огромный крытый батутный комплекс, предлагающий десятки зон для прыжков, акробатики и активного спорта.","why":"Здесь дети могут безопасно прыгать на профессиональных батутах, прыгать в огромные ямы с мягким поролоном, проходить полосы препятствий «Ниндзя», играть в вышибалы на батутах и учиться крутить сальто под присмотром опытных инструкторов.","ageT":"От 4 лет и старше.","stT":"Да. Коляску можно оставить в зоне рецепции, есть пологие съезды.","infra":"🚻 Раздевалки и душ | 🌳 В помещении | ☕ Зона отдыха с напитками","hrs":"10:00 – 12:00. Первые утренние сеансы идеальны — на арене свободно и безопасно для детей.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLc4X1vGoWGnVa9ZSPHCs9k5af_HQ-WxG4A5C5yRgTqUB2a2duuxFZrmfdAP5MXK8PqGKuDL-xfl1U7Lca6YZ8s9z976NvaXz1ofjIoAIta97MDmSJwZFH1sCMNPGmBR08GkwzeHnA=w800-h450-k-no","fx":1,"pid":"ChIJ7zzMfhfJHkcR6BHrHLprPl8","pay":"p","L":{"pl":{"n":"Jump Arena","ab":"Ogromny kryty park trampolin oferujący dziesiątki stref do skakania, akrobatyki i aktywnego sportu.","wh":"Dzieci mogą tu bezpiecznie skakać na profesjonalnych trampolinach, wskakiwać do ogromnych dołów z miękką pianką, pokonywać tory przeszkód „Ninja”, grać w dwa ognie na trampolinach i uczyć się salt pod okiem doświadczonych instruktorów.","ag":"Od 4 lat.","st":"Tak. Wózek można zostawić w strefie recepcji, są łagodne podjazdy.","in":"🚻 Przebieralnie i prysznice | 🌳 W pomieszczeniu | ☕ Strefa odpoczynku z napojami","hr":"10:00–12:00. Pierwsze poranne wejścia są idealne — na arenie jest luźno i bezpiecznie dla dzieci."},"en":{"n":"Jump Arena Trampoline Park","ab":"A huge indoor trampoline complex with dozens of zones for jumping, acrobatics and active sport.","wh":"Children can safely jump on professional trampolines, dive into huge foam pits, tackle “Ninja” obstacle courses, play dodgeball on trampolines and learn to do somersaults under experienced instructors.","ag":"From 4 years.","st":"Yes. A stroller can be left in the reception area, and there are gentle ramps.","in":"🚻 Changing rooms and showers | 🌳 Indoors | ☕ Rest area with drinks","hr":"10:00–12:00. The first morning sessions are ideal — the arena is quiet and safe for kids."}}},{"id":21,"n":"Аквапарк Мочидло","pl":"Park Wodny Moczydło","d":"W","lat":52.2366376,"lng":20.953538,"a":"Górczewska 69/73","lo":1,"hi":16,"st":2,"sh":0,"t":["w"],"w":"","about":"Крупнейший открытый летний комплекс водных развлечений в Варшаве под управлением городского спортивного центра.","why":"Главный спаситель в летний зной. Для малышей здесь обустроена огромная мелкая «сплеш-зона» с безопасной теплой водой, фонтанчиками и фигурами животных. Для детей постарше — огромный бассейн с искусственной волной, сетками для лазания над водой и крутые скоростные аква-горки.","ageT":"От 1 года до подростков.","stT":"Да. Вся уличная территория обустроена широкими дорожками.","infra":"🚻 Плянжая санзона | 🌳 Мало деревьев | ☕ Летние кафе","hrs":"09:00 – 12:30 в солнечные дни. Успеете занять шезлонги и уйдете до пика жары.","note":"","imgG":"https://lh3.googleusercontent.com/grass-cs/AABkmLc5sgNtxHAxw97uiOiyjnF20Cmt4pvuK_DhsOibo-XxN0ugqtNc6D-T0tD0irJf8lV6FDdOLvcrb3X1NelmaDIfS3-G-9rGIpCeeoEPO2EUDbNx529wf4c5ffdwMhhdrOUQdPZh=s1330-w784-h1330-rw","fx":1,"pid":"ChIJLcQBCnPLHkcRkZsqcmcHDU4","pay":"p","L":{"pl":{"n":"Park Wodny Moczydło","ab":"Największy otwarty letni kompleks atrakcji wodnych w Warszawie, zarządzany przez miejski ośrodek sportu.","wh":"Główny ratunek w letnie upały. Dla maluchów urządzono ogromną płytką „strefę splash” z bezpieczną ciepłą wodą, fontannami i figurami zwierząt. Dla starszych dzieci jest duży basen ze sztuczną falą, siatkami do wspinania nad wodą i szybkie zjeżdżalnie wodne.","ag":"Od 1 roku do nastolatków.","st":"Tak. Cały teren na zewnątrz ma szerokie alejki.","in":"🚻 Plażowe sanitariaty | 🌳 Mało drzew | ☕ Letnie kawiarnie","hr":"9:00–12:30 w słoneczne dni. Zdążysz zająć leżaki i wyjść przed szczytem upału."},"en":{"n":"Moczydło Water Park","ab":"Warsaw's largest open-air summer water-fun complex, run by the city sports centre.","wh":"The main rescue from summer heat. For toddlers there is a huge shallow “splash zone” with safe warm water, fountains and animal figures. For older children there is a big pool with an artificial wave, climbing nets over the water and fast water slides.","ag":"From 1 year to teenagers.","st":"Yes. The whole outdoor area has wide paths.","in":"🚻 Beach-style restrooms | 🌳 Few trees | ☕ Summer cafes","hr":"9:00–12:30 on sunny days. You can grab sun loungers and leave before the peak heat."}}},{"id":22,"n":"Парк Эдварда Шиманского","pl":"Park im. Edwarda Szymańskiego","d":"W","lat":52.2338677,"lng":20.9518058,"a":"Elekcyjna","lo":0,"hi":16,"st":2,"sh":1,"t":["p","w"],"w":"Park Edwarda Szymańskiego","about":"Просторный современный парк с каскадами прудов, мультимедийными фонтанами и развитой спортивной инфраструктурой.","why":"Парк идеален для активных детей на колесах. Здесь проложены километры идеально гладких асфальтированных дорожек для самокатов, роликов и велосипедов. Внутри парка есть крутая бесплатная детская площадка и уличные тренажеры, а вечерами включаются поющие фонтаны с подсветкой.","ageT":"Для любого возраста (0+).","stT":"Да. Ровный асфальт — излюбленное место для прогулок с колясками и катания на роликах.","infra":"🚻 Общественные павильоны | 🌳 Тенистые аллеи | ☕ Лотки с кофе и мороженым","hrs":"17:00 – 20:00 летом. Включаются фонтаны с подсветкой, а спадающая жара идеальна для прогулок.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLd6dufrapUz3M_GN8ATP1MRhIjZiqpD7UwVW0wCkDSUdanx5MkeGq79EUWGSDDYi-k_v4PCieG1eliQLLhbunEkSKihtketX1WGedb4iz7Cctq9zyZkAbfwNEef_tegR0aTV1B0=w800-h450-k-no","fx":1,"pid":"ChIJn-HOKWzLHkcRbr47abaIXLc","pay":"f","L":{"pl":{"n":"Park im. Edwarda Szymańskiego","ab":"Przestronny nowoczesny park z kaskadami stawów, multimedialnymi fontannami i rozwiniętą infrastrukturą sportową.","wh":"Park idealny dla aktywnych dzieci na kółkach. Wytyczono tu kilometry idealnie gładkich asfaltowych ścieżek dla hulajnóg, rolek i rowerów. W parku jest świetny bezpłatny plac zabaw i siłownie plenerowe, a wieczorami włączają się śpiewające fontanny z podświetleniem.","ag":"Dla dzieci w każdym wieku (0+).","st":"Tak. Równy asfalt — ulubione miejsce spacerów z wózkami i jazdy na rolkach.","in":"🚻 Pawilony publiczne | 🌳 Zacienione aleje | ☕ Stoiska z kawą i lodami","hr":"17:00–20:00 latem. Włączają się podświetlone fontanny, a opadający upał sprzyja spacerom."},"en":{"n":"Edward Szymański Park","ab":"A spacious modern park with cascades of ponds, multimedia fountains and well-developed sports infrastructure.","wh":"A park ideal for active kids on wheels. Kilometres of perfectly smooth asphalt paths for scooters, roller skates and bikes. Inside the park there is a great free playground and outdoor gym equipment, and in the evening the singing fountains with lights switch on.","ag":"Any age (0+).","st":"Yes. Smooth asphalt — a favourite spot for stroller walks and roller skating.","in":"🚻 Public pavilions | 🌳 Shaded avenues | ☕ Coffee and ice-cream stands","hr":"17:00–20:00 in summer. Illuminated fountains turn on and the fading heat is perfect for walking."}}},{"id":23,"n":"Сады Ульриха","pl":"Ogrody Ulricha","d":"W","lat":52.2409647,"lng":20.933151,"a":"Górczewska 124 (Wola Park)","lo":1,"hi":8,"st":2,"sh":1,"t":["p"],"w":"","about":"Исторический парк бывших варшавских садоводов Ульрихов с вековыми редкими деревьями и отреставрированными кирпичными оранжереями.","why":"Здесь можно идеально совместить обед и прогулку. Исторические теплицы превращены в уютный фуд-холл, а прямо вокруг них разбит парк с прекрасными бесплатными детскими площадками из эко-дерева с песочницами и веревочными качелями, утопающими в густой тени крон.","ageT":"1–8 лет.","stT":"Да. Гладкие парковые дорожки, съезды без порогов.","infra":"🚻 Рядом в ТЦ | 🌳 Густые старые деревья | ☕ Ресторанный дворик «Ogrody Ulricha»","hrs":"12:00 – 15:00. Деревья парка создают защитный купол, под которым комфортно даже в летний полдень.","note":"","imgG":"https://lh3.googleusercontent.com/gps-cs-s/ANWiy9QB3-irkt-pxT2iPsmx6_Mm00nY6GTqBD7WhABLGXGytLjDPuW2Pz5v9R1HFtaab2ssrwCsPpH_cMLpC9k212pUxf3WMphP2auVoVqk_UiJo3KjnsTyor219NaVCr4fN7dc-Ymp=s1330-w784-h1330-rw","fx":1,"pid":"ChIJW5Wa4N7LHkcR1PpXjgPj7qw","pay":"f","L":{"pl":{"n":"Ogrody Ulricha","ab":"Historyczny park dawnych warszawskich ogrodników Ulrichów z wiekowymi rzadkimi drzewami i odnowionymi ceglanymi szklarniami.","wh":"Można tu idealnie połączyć obiad ze spacerem. Historyczne szklarnie zamieniono w przytulny food hall, a wokół rozciąga się park z wspaniałymi bezpłatnymi placami zabaw z ekodrewna, z piaskownicami i huśtawkami linowymi, tonącymi w gęstym cieniu koron.","ag":"1–8 lat.","st":"Tak. Gładkie parkowe alejki, zjazdy bez progów.","in":"🚻 W pobliżu w centrum handlowym | 🌳 Gęste stare drzewa | ☕ Food court „Ogrody Ulricha”","hr":"12:00–15:00. Drzewa parku tworzą ochronną kopułę, pod którą jest komfortowo nawet w letnie południe."},"en":{"n":"Ulrich Gardens","ab":"A historic park of the former Warsaw gardeners, the Ulrich family, with centuries-old rare trees and restored brick greenhouses.","wh":"A perfect place to combine lunch and a stroll. The historic greenhouses have been turned into a cosy food hall, and around them is a park with wonderful free eco-wood playgrounds, with sandpits and rope swings sunk in the deep shade of the tree crowns.","ag":"1–8 years.","st":"Yes. Smooth park paths, ramps without thresholds.","in":"🚻 Nearby in the shopping centre | 🌳 Dense old trees | ☕ “Ogrody Ulricha” food court","hr":"12:00–15:00. The park's trees form a protective canopy that is comfortable even at midday in summer."}}},{"id":24,"n":"VR Warsaw (ранее VR Project)","pl":"VR Warsaw","d":"W","lat":52.25537,"lng":20.97847,"a":"Burakowska 15/1, I piętro","lo":8,"hi":16,"st":1,"sh":1,"t":["a"],"w":"","about":"Салон виртуальной реальности (ранее VR Project), подходящий для детей и подростков: современные шлемы HTC Vive и Meta Quest и более 70 игр и симуляторов.","why":"Ребёнок переносится в другие миры: приключения, космические путешествия, рисование в 3D, американские горки, спортивные симуляторы и игры для компании. Можно устроить день рождения, забронировав весь зал.","ageT":"Сессии и праздники рекомендуются от 8–10 лет под присмотром персонала. Производители шлемов не советуют VR младше 13 лет, поэтому сеансы для маленьких лучше сокращать.","stT":"Ограниченно. Места в игровых боксах мало, с коляской внутри будет тесно.","infra":"🚻 Есть | 🌳 В помещении | ☕ Вода/кофе на ресепшене","hrs":"14:00 – 17:00 в будни. В выходные дни слоты обычно заняты праздниками.","note":"","imgO":"https://vrwarsaw.com.pl/wp-content/themes/vr/dist/images/photos/1-17.jpg","fx":1,"pid":"ChIJRSv0jo_LHkcRKSdTW95m5Xk","pay":"p","L":{"pl":{"n":"VR Warsaw","ab":"Salon wirtualnej rzeczywistości (dawniej VR Project), odpowiedni dla dzieci i nastolatków: nowoczesne gogle HTC Vive i Meta Quest oraz ponad 70 gier i symulatorów.","wh":"Dziecko przenosi się do innych światów: przygody, podróże kosmiczne, rysowanie w 3D, kolejki górskie, symulatory sportowe i gry dla grupy. Można zorganizować urodziny, rezerwując całą salę.","ag":"Sesje i urodziny polecane od 8–10 lat pod opieką personelu. Producenci gogli odradzają VR dzieciom poniżej 13 lat, dlatego dla młodszych sesje lepiej skracać.","st":"Ograniczona. W boksach do gry jest mało miejsca, z wózkiem w środku będzie ciasno.","in":"🚻 Są | 🌳 W budynku | ☕ Woda/kawa w recepcji","hr":"14:00–17:00 w dni powszednie. W weekendy sloty zwykle zajęte są przez urodziny."},"en":{"n":"VR Warsaw","ab":"A virtual-reality lounge (formerly VR Project) suitable for children and teenagers: modern HTC Vive and Meta Quest headsets and over 70 games and simulators.","wh":"The child is transported to other worlds: adventures, space journeys, 3D painting, roller coasters, sports simulators and group games. You can hold a birthday party by booking the whole room.","ag":"Sessions and parties are recommended from ages 8–10 under staff supervision. Headset makers advise against VR for children under 13, so sessions for younger kids are best kept short.","st":"Limited. There is little room in the gaming boxes, so it will be tight with a stroller inside.","in":"🚻 Yes | 🌳 Indoors | ☕ Water/coffee at reception","hr":"14:00–17:00 on weekdays. Weekend slots are usually taken by birthday parties."}}},{"id":25,"n":"Fun Park Digiloo","pl":"Fun Park Digiloo","d":"M","lat":52.196522,"lng":21.02623,"a":"Dominika Merliniego 2","lo":1,"hi":12,"st":2,"sh":1,"t":["a"],"w":"","about":"Один из самых масштабных крытых развлекательных центров в Варшаве, построенный в формате огромного игрового павильона со спортивным уклоном.","why":"Главная гордость парка — гигантский многоуровневый лабиринт с мягкими препятствиями, винтовыми горками, пушками, стреляющими поролоновыми шарами, и батутной зоной. Для малышей до 4 лет выделен безопасный уединенный уголок с сухим бассейном и мягкими модулями-конструкторами.","ageT":"1–4 года (мини-зона), 5–12 лет (основной лабиринт).","stT":"Да. Большое плоское пространство, коляску можно подкатить прямо к столу.","infra":"🚻 Оборудованные санузлы | 🌳 Кондиционируемый павильон | ☕ Пиццерия внутри","hrs":"10:00 – 13:00. В первой половине дня лабиринты и горки свободны от школьных групп.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLcMaXrAko7ohHm3PNP1tnzQuZHJsu-bjmSudtKQYdOWGbnXTe8NdjLW6cMm6pXaV5iGCO4zJVKtQGbKn3lDHWie0GAkHs7ttBsR1OPcMRP0tNvovhAClAvYbrD8js0r8X6zXrk=w800-h450-k-no","fx":1,"pid":"ChIJW75Kri7NHkcRwkIYKAETyE0","pay":"p","L":{"pl":{"n":"Fun Park Digiloo","ab":"Jedno z największych krytych centrów rozrywki w Warszawie, zbudowane w formie ogromnego pawilonu zabaw o sportowym charakterze.","wh":"Główna duma parku to gigantyczny wielopoziomowy labirynt z miękkimi przeszkodami, zjeżdżalniami spiralnymi, armatkami strzelającymi piankowymi kulkami i strefą trampolin. Dla maluchów do 4 lat przygotowano bezpieczny, osobny kącik z suchym basenem i miękkimi modułami-klockami.","ag":"1–4 lata (mini-strefa), 5–12 lat (główny labirynt).","st":"Tak. Duża płaska przestrzeń, wózek można dowieźć wprost do stolika.","in":"🚻 Wyposażone toalety | 🌳 Klimatyzowany pawilon | ☕ Pizzeria w środku","hr":"10:00–13:00. Przed południem labirynty i zjeżdżalnie są wolne od grup szkolnych."},"en":{"n":"Fun Park Digiloo","ab":"One of Warsaw's largest indoor entertainment centres, built as a huge sports-themed play pavilion.","wh":"The park's pride is a giant multi-level maze with soft obstacles, spiral slides, cannons shooting foam balls and a trampoline zone. For toddlers under 4 there is a safe, secluded corner with a ball pit and soft building-block modules.","ag":"1–4 years (mini zone), 5–12 years (main maze).","st":"Yes. A large flat space; you can wheel the stroller right up to the table.","in":"🚻 Equipped toilets | 🌳 Air-conditioned pavilion | ☕ Pizzeria inside","hr":"10:00–13:00. In the first half of the day the mazes and slides are free of school groups."}}},{"id":26,"n":"Водный парк «Варшавянка»","pl":"Wodny Park Warszawianka","d":"M","lat":52.1952952,"lng":21.026059,"a":"Dominika Merliniego 4","lo":0,"hi":16,"st":2,"sh":1,"t":["w"],"w":"Wodny Park Warszawianka","about":"Главный круглогодичный спортивно-развлекательный аквакомплекс столицы под крышей, включающий олимпийский бассейн и рекреационную зону.","why":"Идеальное место для семейного заплыва. Детей ждут несколько водных горок (самая длинная — 70 метров), бассейн с искусственной бурной рекой, водопады, джакузи и теплая детская бухта-лягушатник для самых маленьких. Родители могут расслабиться в гидромассажных зонах.","ageT":"От 0 лет (есть теплая мелкая зона для грудничков) до подростков.","stT":"Да. Есть лифт к раздевалкам и безбарьерные проходы.","infra":"🚻 В раздевалках | 🌳 Крытый аквапарк | ☕ Бистро на 2 этаже зоны бассейнов","hrs":"08:00 – 10:30 в выходные. Действует утренний тариф, дорожки свободны.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLeUmquYcUC6yc5TypGvziR5fC9_ObU5Lrcd2tOr7ZHynNj5UOgH_MVVvrFChfeFLZgudkR6Xskd2Qhezt3RTgyipypcxGs1q8cW7F22QeoxWOAaL3Ia77SBDJCZWPiE9EKt4xCp=w800-h450-k-no","fx":1,"pid":"ChIJV3paJCzNHkcRWl5hKdDUv4k","pay":"p","L":{"pl":{"n":"Wodny Park Warszawianka","ab":"Główny całoroczny kryty kompleks sportowo-rozrywkowy ze strefą wodną w stolicy, z basenem olimpijskim i strefą rekreacyjną.","wh":"Idealne miejsce na rodzinne pływanie. Dzieci czekają zjeżdżalnie (najdłuższa ma 70 metrów), basen ze sztuczną rwącą rzeką, wodospady, jacuzzi i ciepła dziecięca zatoczka dla najmłodszych. Rodzice mogą odpocząć w strefach hydromasażu.","ag":"Od 0 lat (jest ciepła płytka strefa dla niemowląt) do nastolatków.","st":"Tak. Jest winda do szatni i przejścia bez barier.","in":"🚻 W szatniach | 🌳 Kryty aquapark | ☕ Bistro na 2. piętrze strefy basenów","hr":"8:00–10:30 w weekendy. Obowiązuje poranna taryfa, tory są wolne."},"en":{"n":"Warszawianka Water Park","ab":"The capital's main year-round indoor sports and leisure water complex, with an Olympic pool and a recreation zone.","wh":"A perfect place for a family swim. Kids get several water slides (the longest is 70 metres), a pool with an artificial rapid river, waterfalls, jacuzzis and a warm children's paddling bay for the very smallest. Parents can relax in the hydromassage areas.","ag":"From 0 years (there is a warm shallow zone for babies) to teenagers.","st":"Yes. There is a lift to the changing rooms and barrier-free passages.","in":"🚻 In changing rooms | 🌳 Indoor water park | ☕ Bistro on the 2nd floor of the pool area","hr":"8:00–10:30 at weekends. The morning tariff applies and lanes are free."}}},{"id":27,"n":"Парк Дрешера","pl":"Park Orlicz-Dreszera","d":"M","lat":52.1977932,"lng":21.0211077,"a":"Puławska 119A","lo":1,"hi":6,"st":2,"sh":1,"t":["g","p"],"w":"Park Gustawa Orlicz-Dreszera","about":"Небольшой, исторический и очень изящный французский парк на Мокотуве со строгими тенистыми аллеями и фонтаном по центру.","why":"Сюда стоит заглянуть ради уютной уличной детской площадки. Она полностью огорожена по периметру, что исключает побег малыша, имеет безопасное мягкое покрытие, удобные качели-гнезда, деревянные домики и современные лазилки. Летом прямо у фонтана часто устраивают бесплатные джазовые или классические концерты под открытым небом.","ageT":"1–6 лет (спокойная огороженная площадка).","stT":"Да. Парк со всех сторон оборудован ровными съездами.","infra":"🚻 Городской автотуалет | 🌳 Густая тень крон | ☕ Кафе через дорогу","hrs":"10:00 – 12:00. В утреннее время здесь тихо и малолюдно.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLf01Cw1SA3mT-Qv-Y-7_MSTigTPFl3G8fAWGSxpiEASZKteR4yqy7RB7fd64oLM9bIvgoGf-wtVZRsBmrMuIRvRlNdyDfcBbOEYzRsTsLGdcfDAeuuNESfNpNpNYfuqmEt4Ac1Pqw=w800-h450-k-no","fx":1,"pid":"ChIJN3tJnCnNHkcRvQmOWeBTHWA","pay":"f","L":{"pl":{"n":"Park Orlicz-Dreszera","ab":"Niewielki, historyczny i bardzo elegancki park francuski na Mokotowie ze ścisłymi zacienionymi alejami i fontanną pośrodku.","wh":"Warto tu zajrzeć dla przytulnego plenerowego placu zabaw. Jest w pełni ogrodzony po obwodzie, co wyklucza ucieczkę malucha, ma bezpieczną miękką nawierzchnię, wygodne huśtawki-gniazda, drewniane domki i nowoczesne konstrukcje do wspinania. Latem tuż przy fontannie często organizowane są bezpłatne koncerty jazzowe lub klasyczne pod gołym niebem.","ag":"1–6 lat (spokojny, ogrodzony plac zabaw).","st":"Tak. Park ze wszystkich stron ma równe zjazdy.","in":"🚻 Miejska toaleta automatyczna | 🌳 Gęsty cień koron | ☕ Kawiarnia po drugiej stronie ulicy","hr":"10:00–12:00. Rano jest tu cicho i mało ludzi."},"en":{"n":"Dreszer Park","ab":"A small, historic and very elegant French-style park in Mokotów with strict shady avenues and a fountain in the middle.","wh":"Worth a visit for the cosy outdoor playground. It is fully fenced around the perimeter so a toddler cannot wander off, and has a safe soft surface, comfy nest swings, wooden houses and modern climbing frames. In summer free open-air jazz or classical concerts are often held right by the fountain.","ag":"1–6 years (a calm, fenced playground).","st":"Yes. The park has smooth ramps on all sides.","in":"🚻 City automatic toilet | 🌳 Dense tree shade | ☕ Cafe across the street","hr":"10:00–12:00. In the morning it is quiet and uncrowded here."}}},{"id":28,"n":"Детские сеансы в кинотеатре «Иллюзион»","pl":"Kino Iluzjon – seanse dla dzieci","d":"M","lat":52.2056275,"lng":21.0108316,"a":"ul. Ludwika Narbutta 50A","lo":3,"hi":12,"st":2,"sh":1,"t":["a"],"w":"","about":"Легендарный архивный кинотеатр Национальной фильмотеки, расположенный в уникальном модернистском здании-ротонде 1950-х годов.","why":"В «Иллюзионе» регулярно проходят детские утренники «Iluzjon Dzieciom», где на большом экране крутят шедевры классической польской мультипликации (Болек и Лёлек, Рекс) и современные авторские детские фильмы, которые не встретишь в обычных ТЦ.","ageT":"От 3 до 12 лет.","stT":"Да. Здание полностью адаптировано, есть пандусы и места для колясок в залах.","infra":"🚻 Есть | 🌳 Кондиционирование | ☕ Уютная кофейня в холле","hrs":"Под детские утренние сеансы на сайте кинотеатра.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLeDdGRZ1nNDAznXOtKEPDSnOzdlbW1vbNn-MoN0bINMJVq9GhzPODsYIC0sllm_sVc9K7esxG-BSeEdhlV5k2pqOCXZc9W3PxJDthPCn6XZz_hYAFHMKtcFAnyzSrPFxZkPRHhDRA=w800-h450-k-no","fx":1,"pid":"ChIJnS-z1MPMHkcRwZ3IlMzLM8Q","pay":"p","L":{"pl":{"n":"Kino Iluzjon – seanse dla dzieci","ab":"Legendarne archiwalne kino Filmoteki Narodowej w wyjątkowym modernistycznym budynku-rotundzie z lat 50.","wh":"W „Iluzjonie” regularnie odbywają się dziecięce poranki „Iluzjon Dzieciom”, na których na dużym ekranie wyświetla się arcydzieła klasycznej polskiej animacji (Bolek i Lolek, Reksio) oraz współczesne autorskie filmy dla dzieci, których nie zobaczysz w zwykłych multipleksach.","ag":"3–12 lat.","st":"Tak. Budynek jest w pełni dostosowany, są podjazdy i miejsca na wózki w salach.","in":"🚻 Są | 🌳 Klimatyzacja | ☕ Przytulna kawiarnia w holu","hr":"Na poranne seanse dla dzieci według repertuaru na stronie kina."},"en":{"n":"Iluzjon Cinema – children's screenings","ab":"The legendary archive cinema of the National Film Archive, in a unique modernist rotunda building from the 1950s.","wh":"“Iluzjon” regularly hosts the children's matinees “Iluzjon Dzieciom”, showing classics of Polish animation on the big screen (Bolek and Lolek, Reksio) as well as modern independent children's films you will not find in ordinary multiplexes.","ag":"3–12 years.","st":"Yes. The building is fully adapted, with ramps and stroller spaces in the halls.","in":"🚻 Yes | 🌳 Air conditioning | ☕ Cosy cafe in the lobby","hr":"For the children's morning screenings listed on the cinema's website."}}},{"id":29,"n":"Скейтпарк Jutrzenka","pl":"Skatepark Jutrzenka","d":"M","lat":52.2263538,"lng":21.0327038,"a":"Rozbrat 2","lo":10,"hi":16,"st":2,"sh":0,"t":["a","p"],"w":"","about":"Профессиональный, частично крытый скейтпарк под управлением городских властей, оборудованный рампами, грайндбоксами и рейлами разной сложности.","why":"Мекка для активных подростков. Сюда стоит идти со своим скейтом, самокатом, роликами или BMX-байком. Площадка позволяет безопасно тренировать трюки и прыжки, а царящая здесь дружелюбная атмосфера молодежного комьюнити мотивирует ребенка развивать координацию и спортивные навыки.","ageT":"От 10 лет и подростки.","stT":"Да. Зона вокруг рамп полностью асфальтирована, удобно наблюдать со стороны.","infra":"🚻 При спорткомплексе | 🌳 Открытый роллердром | ☕ Кофейни рядом","hrs":"16:30 – 19:30. Ближе к вечеру собирается классное молодежное комьюнити.","note":"","imgO":"","imgG":"https://gz0.googleusercontent.com/grass-cs/AABkmLfx_O7JpQb47mM5JWkO5HLmcCQHXD7HpWuXO_6TQhMROmSHYLpp0ZOmRu6g-WPeD5hcm0W735N26V7xQ_c0l-Ea3fjuqgw1OCPAgiVGFR_zRtkfFpLHYonjxj2ypxIep8vhruhC2Q=w800-h450-k-no","fx":1,"pid":"ChIJUXjma_zMHkcRsoXM4IUeMZ4","pay":"f","L":{"pl":{"n":"Skatepark Jutrzenka","ab":"Profesjonalny, częściowo kryty skatepark pod zarządem miasta, wyposażony w rampy, grindboxy i railsy o różnym poziomie trudności.","wh":"Mekka dla aktywnych nastolatków. Warto przyjść ze swoją deskorolką, hulajnogą, rolkami lub rowerem BMX. Miejsce pozwala bezpiecznie trenować triki i skoki, a przyjazna atmosfera młodzieżowej społeczności motywuje dziecko do rozwijania koordynacji i umiejętności sportowych.","ag":"Od 10 lat i nastolatki.","st":"Tak. Teren wokół ramp jest w całości wyasfaltowany, wygodnie obserwować z boku.","in":"🚻 Przy kompleksie sportowym | 🌳 Otwarty rolkowisko | ☕ Kawiarnie w pobliżu","hr":"16:30–19:30. Pod wieczór zbiera się świetna młodzieżowa społeczność."},"en":{"n":"Jutrzenka Skatepark","ab":"A professional, partly covered skatepark run by the city, equipped with ramps, grind boxes and rails of varying difficulty.","wh":"A mecca for active teenagers. Come with your skateboard, scooter, roller skates or BMX bike. The park lets you practise tricks and jumps safely, and the friendly youth-community atmosphere motivates kids to develop coordination and sports skills.","ag":"From 10 years and teenagers.","st":"Yes. The area around the ramps is fully asphalted, convenient for watching from the side.","in":"🚻 At the sports complex | 🌳 Open roller rink | ☕ Cafes nearby","hr":"16:30–19:30. A great youth community gathers towards the evening."}}},{"id":30,"n":"Станция Гравитация","pl":"Stacja Grawitacja","d":"H","lat":52.213233,"lng":20.957588,"a":"aleja Bohaterów Września 12","lo":3,"hi":14,"st":1,"sh":1,"t":["a"],"w":"","about":"Развлекательно-спортивный центр 3200 м² в районе Охота: батуты, скалодром, верёвочный парк и интерактивные игры под одной крышей.","why":"Батуты с воздушной подушкой, скалодром Happy Climb с автостраховкой для детей, верёвочный парк над батутами, трасса «ниндзя»
